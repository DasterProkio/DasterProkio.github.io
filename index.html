const SRC = {"post":"//@@ POST_COMPOSITE\n// Transition compositor: blends scene A and B in world space.\nprecision highp float;\nin vec2 vUv; out vec4 o;\nuniform sampler2D uA, uB;\nuniform float uMix;       // 0 = A only, 1 = B only\nuniform int   uMode;      // 0 crossfade, 1 ember burn, 2 ink bleed, 3 light bloom, 4 dark void\nuniform vec3  uCamPos; uniform mat3 uCamRot; uniform float uFov; uniform vec2 uRes;\nuniform vec3  uCenter;    // world-space origin of the transition front\nuniform float uTime;\n\nfloat h12(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }\nfloat vn(vec3 p){\n  vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);\n  float n=dot(i,vec3(1.0,57.0,113.0));\n  #define H(x) fract(sin(x)*43758.5453)\n  return mix(mix(mix(H(n),H(n+1.0),f.x),mix(H(n+57.0),H(n+58.0),f.x),f.y),\n             mix(mix(H(n+113.0),H(n+114.0),f.x),mix(H(n+170.0),H(n+171.0),f.x),f.y),f.z);\n  #undef H\n}\nfloat fbm3(vec3 p){ return 0.5*vn(p)+0.25*vn(p*2.1)+0.125*vn(p*4.3)+0.0625*vn(p*8.7); }\n\nvoid main(){\n  vec4 a = texture(uA, vUv), b = texture(uB, vUv);\n  if(uMode==0 || uMix<=0.0 || uMix>=1.0){ o = mix(a,b,uMix); return; }\n  vec2 uv = (2.0*gl_FragCoord.xy-uRes)/uRes.y;\n  vec3 rd = normalize(uCamRot*vec3(uv*uFov,1.0));\n  // use the nearer surface to place the front in the world\n  float dA = a.a, dB = b.a;\n  vec3 pw = uCamPos + rd*min(dA, dB);\n  float r = length(pw-uCenter);\n  if(uMode==1){\n    // ember burn: a noisy front grows outward from the centre, glowing edge\n    float n = fbm3(pw*1.3+vec3(0.0,-uTime*0.3,0.0));\n    float front = uMix*14.0 - r + (n-0.5)*3.5;\n    float k = smoothstep(0.0, 0.35, front);\n    float edge = exp(-abs(front)*5.0)*step(0.0, 1.0-k)*(1.0-uMix*0.5);\n    vec3 c = mix(a.rgb, b.rgb, k);\n    c += vec3(3.0,0.9,0.18)*edge*(0.5+n);\n    o = vec4(c, mix(a.a,b.a,k));\n  } else if(uMode==2){\n    // ink bleed: screen-space-ish radial with fibre noise\n    float n = fbm3(vec3(uv*6.0, 1.0));\n    float front = uMix*2.6 - length(uv)*1.2 + (n-0.5)*0.8;\n    float k = smoothstep(-0.05, 0.1, front);\n    o = mix(a, b, k);\n  } else if(uMode==3){\n    // light bloom: the world brightens into white light then settles into B\n    float w = sin(uMix*3.14159);\n    vec4 m = mix(a,b,smoothstep(0.3,0.7,uMix));\n    o = vec4(m.rgb + w*w*2.5*vec3(1.0,0.85,0.6)*(0.4+0.6*fbm3(pw*0.5)), m.a);\n  } else if(uMode==5){\n    // mist: a soft noisy front grows from the centre, faintly luminous\n    float n = fbm3(pw*0.9+vec3(0.0,uTime*0.05,0.0));\n    float front = uMix*9.0 - r + (n-0.5)*3.0;\n    float k = smoothstep(-0.7, 0.7, front);\n    vec3 c = mix(a.rgb, b.rgb, k);\n    c += (a.rgb+b.rgb)*0.2*exp(-abs(front)*1.5)*sin(uMix*3.14159);\n    o = vec4(c, mix(a.a, b.a, k));\n  } else {\n    // dark void: world dissolves into darkness from the edges of the frame\n    float n = fbm3(pw*0.8);\n    float k = smoothstep(0.0, 0.3, uMix*1.6 - length(uv)*0.5 - n*0.5);\n    o = mix(a, b, k);\n  }\n}\n\n//@@ POST_COC\n// Circle of confusion (pixels, signed: <0 near) into alpha; colour premultiplied weight\nprecision highp float;\nin vec2 vUv; out vec4 o;\nuniform sampler2D uSrc;\nuniform float uFocus, uAperture, uMaxCoc;\nvoid main(){\n  vec4 c = texture(uSrc, vUv);\n  float d = c.a;\n  float coc = uAperture*(d-uFocus)/max(d,1e-3);\n  coc = clamp(coc*uMaxCoc, -uMaxCoc, uMaxCoc);\n  o = vec4(c.rgb, coc);\n}\n\n//@@ POST_DOF\n// Half-res gather bokeh (golden-angle spiral). Input: rgb + signed CoC in pixels (full res units).\nprecision highp float;\nin vec2 vUv; out vec4 o;\nuniform sampler2D uSrc; uniform vec2 uTexel; uniform float uMaxCoc;\nvoid main(){\n  vec4 c0 = texture(uSrc, vUv);\n  float r0 = abs(c0.a);\n  vec3 acc = vec3(0); float wsum = 0.0;\n  const int N = 40;\n  float ga = 2.39996323;\n  float radius = uMaxCoc;\n  for(int i=0;i<N;i++){\n    float fi = float(i)+0.5;\n    float r = sqrt(fi/float(N))*radius;\n    vec2 off = vec2(cos(fi*ga), sin(fi*ga))*r;\n    vec4 s = textureLod(uSrc, vUv+off*uTexel, 0.0);\n    float cs = abs(s.a);\n    // sample contributes if its CoC covers this distance; background samples\n    // cannot bleed over sharper foreground\n    float w = smoothstep(r-1.0, r+0.5, cs);\n    if(s.a > c0.a+2.0) w *= smoothstep(r-1.0, r+0.5, r0);  // farther sample, only if we are blurry too\n    // bokeh highlights: slight boost of bright samples\n    w *= 1.0 + 0.8*smoothstep(1.5, 6.0, dot(s.rgb, vec3(0.3,0.5,0.2)));\n    acc += s.rgb*w; wsum += w;\n  }\n  vec3 col = wsum>0.0 ? acc/wsum : c0.rgb;\n  o = vec4(col, r0);\n}\n\n//@@ POST_DOFMIX\nprecision highp float;\nin vec2 vUv; out vec4 o;\nuniform sampler2D uSharp, uBlur;\nvoid main(){\n  vec4 s = texture(uSharp, vUv);\n  vec4 b = texture(uBlur, vUv);\n  float k = smoothstep(0.6, 2.2, abs(s.a));\n  // near-field blur spills over: use blurred coc too\n  k = max(k, smoothstep(0.8, 2.5, b.a));\n  o = vec4(mix(s.rgb, b.rgb, k), s.a);\n}\n\n//@@ POST_DOWN\n// 13-tap downsample (CoD / Jimenez) with a soft threshold on the first level\nprecision highp float;\nin vec2 vUv; out vec4 o;\nuniform sampler2D uSrc; uniform vec2 uTexel; uniform float uThresh; uniform int uFirst;\nvec3 s(vec2 d){ return texture(uSrc, vUv+d*uTexel).rgb; }\nvoid main(){\n  vec3 a=s(vec2(-2,2)), b=s(vec2(0,2)), c=s(vec2(2,2));\n  vec3 d=s(vec2(-2,0)), e=s(vec2(0,0)), f=s(vec2(2,0));\n  vec3 g=s(vec2(-2,-2)), h=s(vec2(0,-2)), i=s(vec2(2,-2));\n  vec3 j=s(vec2(-1,1)), k=s(vec2(1,1)), l=s(vec2(-1,-1)), m=s(vec2(1,-1));\n  vec3 col = e*0.125 + (a+c+g+i)*0.03125 + (b+d+f+h)*0.0625 + (j+k+l+m)*0.125;\n  if(uFirst==1){\n    float br = max(col.r, max(col.g, col.b));\n    float soft = clamp(br-uThresh+0.5, 0.0, 1.0);\n    soft = soft*soft*0.5;\n    float contrib = max(soft, br-uThresh)/max(br, 1e-4);\n    col *= contrib;\n    col = min(col, vec3(60.0));\n  }\n  o = vec4(col, 1.0);\n}\n\n//@@ POST_UP\nprecision highp float;\nin vec2 vUv; out vec4 o;\nuniform sampler2D uSrc, uPrev; uniform vec2 uTexel; uniform float uRadius;\nvoid main(){\n  vec2 d = uTexel*uRadius;\n  vec3 c = texture(uSrc, vUv+vec2(-d.x,d.y)).rgb + 2.0*texture(uSrc, vUv+vec2(0,d.y)).rgb + texture(uSrc, vUv+d).rgb\n         + 2.0*texture(uSrc, vUv+vec2(-d.x,0)).rgb + 4.0*texture(uSrc, vUv).rgb + 2.0*texture(uSrc, vUv+vec2(d.x,0)).rgb\n         + texture(uSrc, vUv-d).rgb + 2.0*texture(uSrc, vUv+vec2(0,-d.y)).rgb + texture(uSrc, vUv+vec2(d.x,-d.y)).rgb;\n  o = vec4(c/16.0 + texture(uPrev, vUv).rgb, 1.0);\n}\n\n//@@ POST_FINAL\nprecision highp float;\nin vec2 vUv; out vec4 o;\nuniform sampler2D uSrc, uBloom, uOverlay;\nuniform vec2 uRes;           // output resolution\nuniform float uExposure, uBloomAmt, uGrain, uVignette, uCA, uTime, uLetterbox, uFade, uOverlayAmt, uShimmer;\nuniform vec3 uLift, uGamma, uGain; uniform float uSat; uniform vec3 uTintShadow, uTintHigh;\nuniform float uContrast;\nuniform float uPunch;\n\nfloat hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }\n\nvec3 agx(vec3 c){\n  const mat3 M = mat3(0.842479,0.0423282,0.0423756, 0.0784336,0.878468,0.0784336, 0.0792237,0.0791661,0.879142);\n  const mat3 Mi = mat3(1.19687,-0.0528968,-0.0529716, -0.0980208,1.15190,-0.0980434, -0.0990297,-0.0989612,1.15107);\n  c = M*max(c,1e-6);\n  c = clamp((log2(c)+12.47393)/16.5, 0.0, 1.0);\n  vec3 x2=c*c, x4=x2*x2;\n  c = 15.5*x4*x2 - 40.14*x4*c + 31.96*x4 - 6.868*x2*c + 0.4298*x2 + 0.1191*c - 0.00232;\n  // \"punchy\" look: more contrast in the toe, richer colour\n  vec3 lc = pow(max(c,0.0), vec3(mix(1.0, 1.35, uPunch)));\n  float l = dot(lc, vec3(0.2126,0.7152,0.0722));\n  c = l + (lc-l)*mix(1.0, 1.4, uPunch);\n  c = Mi*c;\n  return pow(max(c,0.0), vec3(2.2));\n}\n\nvoid main(){\n  vec2 uv = vUv;\n  vec2 cc = uv-0.5;\n  // heat shimmer\n  if(uShimmer>0.0){\n    float s = sin(uv.y*60.0+uTime*9.0)*sin(uv.x*23.0-uTime*5.0);\n    uv += vec2(s, cos(uv.x*40.0+uTime*7.0))*0.0012*uShimmer;\n  }\n  // chromatic aberration grows toward the edges\n  float ca = uCA*dot(cc,cc);\n  vec3 col;\n  col.r = texture(uSrc, uv - cc*ca).r;\n  col.g = texture(uSrc, uv).g;\n  col.b = texture(uSrc, uv + cc*ca).b;\n  vec3 bl = texture(uBloom, uv).rgb;\n  col += bl*uBloomAmt;\n  col *= uExposure;\n  col = agx(col);\n  // grade (display-referred)\n  col = pow(max(col,0.0), vec3(1.0/2.2));\n  float l = dot(col, vec3(0.2126,0.7152,0.0722));\n  col = mix(vec3(l), col, uSat);\n  col = (col-0.5)*uContrast+0.5;\n  col = col*uGain + uLift*(1.0-col);\n  col = pow(max(col,0.0), 1.0/uGamma);\n  l = dot(col, vec3(0.2126,0.7152,0.0722));\n  col *= mix(uTintShadow, uTintHigh, smoothstep(0.0,1.0,l));\n  // vignette\n  vec2 vv = cc*vec2(uRes.x/uRes.y,1.0);\n  col *= mix(1.0, smoothstep(1.25, 0.25, length(vv)), uVignette);\n  // overlay (paper, titles) in display space\n  vec4 ov = texture(uOverlay, vUv);\n  col = mix(col, ov.rgb, ov.a*uOverlayAmt);\n  // film grain (luma-weighted) + dither\n  float g = hash(gl_FragCoord.xy + fract(uTime*7.13)*1000.0) - 0.5;\n  col += g*uGrain*(0.4+0.6*sqrt(max(l,0.0)));\n  col += (hash(gl_FragCoord.xy*1.3+17.0)-0.5)/255.0;\n  col *= uFade;\n  // letterbox\n  float bar = (1.0 - uRes.x/uRes.y/uLetterbox)*0.5;\n  if(uLetterbox>0.0 && (vUv.y < bar || vUv.y > 1.0-bar)) col = vec3(0);\n  o = vec4(col, 1.0);\n}\n","scenes":{"life":"#version 300 es\n// ---------------------------------------------------------------- common\nprecision highp float;\nprecision highp int;\n\nin vec2 vUv;\nuniform vec2  uRes;\nuniform float uTime;      // film time, seconds\nuniform float uLocal;     // scene-local time\nuniform vec3  uCamPos;\nuniform mat3  uCamRot;\nuniform float uFov;       // tan(fov/2)\nuniform vec2  uJitter;    // subpixel jitter in pixels\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n\nfloat sat(float x){ return clamp(x,0.,1.); }\nvec3  sat(vec3 x){ return clamp(x,0.,1.); }\nfloat sq(float x){ return x*x; }\nfloat lin(float a,float b,float x){ return sat((x-a)/(b-a)); }\nmat2  rot(float a){ float c=cos(a),s=sin(a); return mat2(c,s,-s,c); }\n\n// ---- hashing (integer based, stable across GPUs)\nuint hashu(uint x){ x ^= x>>16; x *= 0x7feb352du; x ^= x>>15; x *= 0x846ca68bu; x ^= x>>16; return x; }\nfloat hash11(float p){ return float(hashu(floatBitsToUint(p)))*(1.0/4294967296.0); }\nfloat hash12(vec2 p){ uvec2 q = uvec2(ivec2(floor(p))); return float(hashu(q.x ^ hashu(q.y + 0x9e3779b9u)))*(1.0/4294967296.0); }\nfloat hash13(vec3 p){ uvec3 q = uvec3(ivec3(floor(p))); return float(hashu(q.x ^ hashu(q.y ^ hashu(q.z + 0x632be5abu))))*(1.0/4294967296.0); }\nvec3  hash33(vec3 p){\n  uvec3 q = uvec3(ivec3(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y ^ hashu(q.z)));\n  return vec3(float(h), float(hashu(h)), float(hashu(h+1u)))*(1.0/4294967296.0);\n}\nvec2  hash22(vec2 p){\n  uvec2 q = uvec2(ivec2(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y));\n  return vec2(float(h), float(hashu(h)))*(1.0/4294967296.0);\n}\n// screen-space blue-ish noise for dithering / jittering ray starts\nfloat ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056,0.00583715)))); }\n\n// ---- value noise\nfloat vnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*(3.0-2.0*f);\n  float a=hash13(i), b=hash13(i+vec3(1,0,0)), c=hash13(i+vec3(0,1,0)), d=hash13(i+vec3(1,1,0));\n  float e=hash13(i+vec3(0,0,1)), f1=hash13(i+vec3(1,0,1)), g=hash13(i+vec3(0,1,1)), h=hash13(i+vec3(1,1,1));\n  return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y), mix(mix(e,f1,u.x),mix(g,h,u.x),u.y), u.z);\n}\nfloat vnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*(3.0-2.0*f);\n  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y);\n}\n// gradient noise (signed, -1..1)\nfloat gnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash33(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(mix(G(vec3(0,0,0)),G(vec3(1,0,0)),u.x), mix(G(vec3(0,1,0)),G(vec3(1,1,0)),u.x),u.y),\n                mix(mix(G(vec3(0,0,1)),G(vec3(1,0,1)),u.x), mix(G(vec3(0,1,1)),G(vec3(1,1,1)),u.x),u.y),u.z);\n  #undef G\n  return r*1.6;\n}\nfloat gnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash22(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(G(vec2(0,0)),G(vec2(1,0)),u.x), mix(G(vec2(0,1)),G(vec2(1,1)),u.x), u.y);\n  #undef G\n  return r*1.4;\n}\nfloat fbm(vec3 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=p*2.03+vec3(17.1,-3.7,9.2); a*=0.5; }\n  return s;\n}\nfloat fbm(vec2 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,7.7); a*=0.5; }\n  return s;\n}\n\n// Voronoi with true border distance (iq). Returns (border distance, cell id hash, F1)\nvec3 voronoiB(vec3 x){\n  vec3 p=floor(x), f=fract(x);\n  vec3 mb; vec3 mr; float md=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=mb+vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    vec3 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash13(p+mb+vec3(7.0)), sqrt(md));\n}\nvec3 voronoiB(vec2 x){\n  vec2 p=floor(x), f=fract(x);\n  vec2 mb; vec2 mr; float md=8.0;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec2 b=vec2(i,j); vec2 r=b+hash22(p+b)-f; float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){\n    vec2 b=mb+vec2(i,j); vec2 r=b+hash22(p+b)-f; vec2 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash12(p+mb+vec2(7.0)), sqrt(md));\n}\n\n// ---- SDF helpers\nfloat smin(float a,float b,float k){ float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*0.25; }\nfloat smax(float a,float b,float k){ return -smin(-a,-b,k); }\nfloat sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }\nfloat sdBox(vec2 p, vec2 b){ vec2 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,q.y),0.0); }\nfloat sdRBox(vec3 p, vec3 b, float r){ return sdBox(p,b-r)-r; }\nfloat sdCyl(vec3 p, float r, float h){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }\nfloat sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=sat(dot(pa,ba)/dot(ba,ba)); return length(pa-ba*h); }\n\n// ---- camera\nvec3 camRay(vec2 frag){\n  vec2 uv = (2.0*(frag+uJitter)-uRes)/uRes.y;\n  return normalize(uCamRot*vec3(uv*uFov, 1.0));\n}\n\n// ---- colour\nvec3 blackbody(float t){ // t in Kelvin, returns linear rgb (normalised-ish)\n  t = clamp(t, 800.0, 12000.0)/100.0;\n  vec3 c;\n  c.r = t<=66.0 ? 1.0 : 1.292936*pow(t-60.0,-0.1332047592);\n  c.g = t<=66.0 ? 0.3900815*log(t)-0.6318414 : 1.129890*pow(t-60.0,-0.0755148492);\n  c.b = t>=66.0 ? 1.0 : (t<=19.0 ? 0.0 : 0.5432068*log(t-10.0)-1.1962541);\n  return pow(sat(c), vec3(2.2));\n}\nfloat luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }\n\n// ---- BRDF\nfloat D_GGX(float nh, float a){ float a2=a*a; float d=nh*nh*(a2-1.0)+1.0; return a2/(PI*d*d); }\nfloat V_SmithJ(float nv, float nl, float a){ float a2=a*a;\n  float gv=nl*sqrt(nv*nv*(1.0-a2)+a2), gl=nv*sqrt(nl*nl*(1.0-a2)+a2); return 0.5/max(gv+gl,1e-5); }\nvec3  F_Schlick(vec3 f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\nfloat F_Schlick1(float f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\n// returns specular (already multiplied by nl)\nvec3 specGGX(vec3 n, vec3 v, vec3 l, float rough, vec3 f0){\n  vec3 h=normalize(v+l);\n  float nl=sat(dot(n,l)), nv=max(dot(n,v),1e-4), nh=sat(dot(n,h)), vh=sat(dot(v,h));\n  float a=max(rough*rough,0.002);\n  return D_GGX(nh,a)*V_SmithJ(nv,nl,a)*F_Schlick(f0,vh)*nl;\n}\n// analytic env-BRDF approximation (Karis)\nvec2 envBRDF(float nv, float rough){\n  vec4 c0=vec4(-1,-0.0275,-0.572,0.022), c1=vec4(1,0.0425,1.04,-0.04);\n  vec4 r=rough*c0+c1; float a004=min(r.x*r.x,exp2(-9.28*nv))*r.x+r.y;\n  return vec2(-1.04,1.04)*a004+r.zw;\n}\n\n// ---------------------------------------------------------------- bowl\n// Units: 1.0 = 10 cm. Bowl local space: foot rests on y=0, axis is +y.\n#define NPROF 16\nuniform vec4  uProf[NPROF];   // centerline (r, y), half thickness, unused\nuniform vec4  uFoot;          // foot ring stroke: r0,y0,r1,y1\nuniform float uFootTh;        // foot half thickness (0 = none)\nuniform float uWobble;        // rim wobble amplitude\nuniform float uOval;          // ovality\nuniform float uRidge;         // throwing ridge amplitude\nuniform float uSpin;          // wheel angle (radians), rotates surface detail\n\n// material state\nuniform float uWet;       // 1 = wet thrown clay\nuniform float uDry;       // 0..1 wet->leather->bone dry\nuniform float uGlazeRaw;  // raw glaze slip coverage (matte)\nuniform float uMelt;      // glaze melted (glossy)\nuniform float uHeat;      // incandescence 0..1\nuniform float uAsh;       // natural ash deposit\nuniform float uCrackle;   // crackle network visibility\nuniform float uStain;     // tea stain in crackle\nuniform float uGold;      // kintsugi seams\nuniform float uTeaLevel;  // tea fill 0..1 (0 = empty)\nuniform float uFroth;     // matcha froth amount\n\n// fracture / seam network\n#define NSEED 14\nuniform vec4 uSeeds[NSEED]; // xyz seed on bowl surface (local), w unused\n\nstruct BowlHit { float d; float side; float s; vec2 nDelta; };\n\nvec2 segPerp(int i){ vec2 b=normalize(uProf[i+1].xy-uProf[i].xy); return vec2(-b.y, b.x); }\n\n// distance-only version for marching\nfloat bowlProfileD(vec2 q){\n  float d = 1e5;\n  for(int i=0;i<NPROF-1;i++){\n    vec2 a=uProf[i].xy, ba=uProf[i+1].xy-a, pa=q-a;\n    float t=sat(dot(pa,ba)/dot(ba,ba));\n    d=min(d, length(pa-ba*t)-mix(uProf[i].z, uProf[i+1].z, t));\n  }\n  return d;\n}\n\n// full version: side (+1 inside ed per shard.\n// (Mirrored exactly in bowl.js for CPU-side centroids.)\nvec3 fracWarp(vec3 p){\n  return p + 0.030*sin(p.zxy*9.1+vec3(1.3,4.1,2.7))\n           + 0.012*sin(p.yzx*23.7+vec3(0.4,2.2,5.1))\n           + 0.005*sin(p.zxy*61.0+vec3(2.9,0.7,4.4));\n}\n\n// Warped Voronoi on the fixed fracture seeds. Returns (border distance, cell index, second index)\nvec3 seamField(vec3 p){\n  vec3 w = fracWarp(p);\n  float d1=1e5, d2=1e5; int i1=0, i2=0;\n  for(int i=0;i<NSEED;i++){\n    vec3 r = w-uSeeds[i].xyz;\n    float d = dot(r,r);\n    if(d<d1){ d2=d1; i2=i1; d1=d; i1=i; } else if(d<d2){ d2=d; i2=i; }\n  }\n  vec3 s1=uSeeds[i1].xyz, s2=uSeeds[i2].xyz;\n  float bd = (d2-d1)/(2.0*length(s2-s1));\n  return vec3(bd, float(i1), float(i2));\n}\n\n// signed distance (in warped space) to the boundary of cell i: <0 inside\nfloat cellDist(vec3 p, int i){\n  vec3 w = fracWarp(p);\n  vec3 si = uSeeds[i].xyz;\n  float di = dot(w-si,w-si);\n  float d = -1e5;\n  for(int j=0;j<NSEED;j++){\n    if(j==i) continue;\n    vec3 sj = uSeeds[j].xyz;\n    float dj = dot(w-sj,w-sj);\n    d = max(d, (di-dj)/(2.0*length(sj-si)));\n  }\n  return d;\n}\n\n// glaze thickness 0..~2 on the surface\nfloat glazeThickness(vec3 p, BowlHit h){\n  float a = atan(p.z,p.x);\n  if(h.side < -1.5) return 0.0;              // foot\n  float s = h.s;\n  float t;\n  if(h.side > 0.0){\n    // interior: pools in the well\n    t = 0.75 + 1.1*smoothstep(0.42,0.05,s) ;\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);     // thins over the rim\n  } else {\n    // exterior: glaze line with drips\n    float line = 0.46 + 0.04*gnoise(vec2(a*2.0,1.7));\n    float drip = pow(sat(gnoise(vec2(a*7.0, 3.1))*0.5+0.5), 5.0)*0.28\n               + pow(sat(gnoise(vec2(a*19.0, 8.3))*0.5+0.5), 8.0)*0.18;\n    float edge = line - drip;\n    float cov = smoothstep(edge-0.004, edge+0.01, s);\n    // thick roll at the drip end, thinning toward the rim\n    t = cov*(0.7 + 1.1*exp(-max(s-edge,0.0)*28.0));\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);\n  }\n  // natural ash: heavier on one flank (facing the fire)\n  float ashSide = sat(0.5+0.5*cos(a-2.4))*smoothstep(0.35,0.85,s);\n  t += uAsh*ashSide*(0.6+0.8*sat(gnoise(p*14.0)+0.3));\n  return t;\n}\n\n// ---------------------------------------------------------------- bowl material\nstruct Surf {\n  vec3 alb;      // diffuse albedo (base, under coat)\n  vec3 f0;       // base specular reflectance (metals)\n  float rough;   // base roughness\n  float coat;    // clear coat (glaze / water film) strength 0..1\n  float coatRough;\n  vec3 n;        // base normal\n  vec3 cn;       // coat normal\n  vec3 emit;\n  float sss;     // wrap / translucency amount\n};\n\nSurf defaultSurf(vec3 n){\n  Surf s; s.alb=vec3(0.5); s.f0=vec3(0.04); s.rough=0.8; s.coat=0.0; s.coatRough=0.1;\n  s.n=n; s.cn=n; s.emit=vec3(0); s.sss=0.0; return s;\n}\n\nvec3 rotYv(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x-s*p.z, p.y, s*p.x+c*p.z); }\n\n// perturb normal with a scalar height function's numerical gradient projected on the surface\n#define BUMP(n, P, F, EPS, AMT) { \\\n  vec3 _e=vec3(EPS,0,0); float _h0=F(P); \\\n  vec3 _g=vec3(F(P+_e.xyy)-_h0, F(P+_e.yxy)-_h0, F(P+_e.yyx)-_h0)/EPS; \\\n  _g-=n*dot(_g,n); n=normalize(n-AMT*_g); }\n\nfloat clayGrain(vec3 p){ return gnoise(p*140.0)*0.5+gnoise(p*330.0)*0.25; }\nfloat glazeRipple(vec3 p){ return gnoise(p*22.0)+0.35*gnoise(p*61.0); }\n\nSurf bowlSurface(vec3 p, vec3 n, vec3 v){\n  Surf s = defaultSurf(n);\n  BowlHit h = bowlInfo(p);\n  { vec2 dr = normalize(p.xz+1e-6); n = normalize(n + vec3(dr.x*h.nDelta.x, h.nDelta.y, dr.y*h.nDelta.x)); s.n=n; s.cn=n; }\n  vec3 pr = rotYv(p, uSpin);            // detail rotating with the wheel\n  float a = atan(pr.z, pr.x);\n\n  // ---------- clay body\n  float speck = smoothstep(0.86, 0.95, vnoise(pr*80.0)) * 0.7;\n  float grain = clayGrain(pr);\n  vec3 fired = vec3(0.50,0.44,0.37)*(0.92+0.1*grain);\n  fired = mix(fired, vec3(0.18,0.09,0.05), speck);\n  // flashing on the unglazed foot / exposed body\n  float flash = sat(0.5+0.8*gnoise(pr*4.0+3.0));\n  vec3 footCol = mix(fired, vec3(0.58,0.30,0.14), 0.55*flash);\n\n  // unfired clay (wet -> dry)\n  vec3 wetCol = vec3(0.19,0.10,0.065);\n  vec3 dryCol = vec3(0.60,0.53,0.46)*(0.95+0.08*grain);\n  vec3 raw = mix(wetCol, dryCol, smoothstep(0.0,1.0,uDry));\n  float slurry = sat(0.5+0.9*gnoise(vec3(a*6.0, pr.y*38.0, 0.0)));\n\n  float firedAmt = max(uMelt, uHeat);\n  // iron shows through where the glaze thins over the rim: a warm brown lip, not raw grain\n  fired = mix(fired, vec3(0.30,0.19,0.12)*(0.95+0.05*grain), smoothstep(0.9, 0.995, h.s)*0.85);\n  vec3 body = mix(raw, h.side<-1.5 ? footCol : fired, sat(firedAmt*1.5));\n  s.alb = body;\n  s.rough = 0.85;\n  BUMP(s.n, pr, clayGrain, 0.002, 0.00025*(1.0-0.8*uMelt));\n\n  // ---------- wet film\n  if(uWet>0.0){\n    float film = uWet*(0.55+0.45*slurry);\n    s.coat = film;\n    s.coatRough = mix(0.32, 0.12, slurry);\n    s.alb = mix(s.alb, s.alb*0.7, film);\n    s.cn = n;\n    // throwing lines in the film\n    vec3 nn = n;\n    float lines = sin(p.y*140.0+2.0*gnoise(vec3(a*3.0,p.y*10.0,0.0)));\n    nn = normalize(nn + 0.08*uWet*lines*vec3(0,1,0));\n    s.cn = nn;\n  }\n\n  // ---------- glaze\n  float t = glazeThickness(p, h);\n  float rawCov = smoothstep(1.02-uGlazeRaw*1.1, 1.04-uGlazeRaw*1.1, h.s)*step(0.001,uGlazeRaw);\n  float cov = sat(t*4.0)*max(rawCov, uMelt);\n  if(cov>0.0){\n    // raw slip (unfired glaze powder)\n    vec3 slip = vec3(0.70,0.72,0.70)*(0.95+0.08*grain);\n    float rawAmt = rawCov*(1.0-uMelt);\n    // melted celadon: Beer-Lambert over the body + milky scatter\n    vec3 sigma = vec3(0.62,0.26,0.33);\n    float tt = t*(1.0+0.15*gnoise(p*7.0));\n    vec3 trans = exp(-sigma*tt*1.6);\n    vec3 milk = vec3(0.55,0.72,0.66);\n    float scat = 1.0-exp(-tt*0.9);\n    vec3 glazeCol = mix(body*trans*1.15, milk*mix(vec3(1.0),trans,0.5), scat*0.72);\n    // ash: greener glassy runs\n    glazeCol = mix(glazeCol, vec3(0.30,0.42,0.22)*trans*1.4, sat(uAsh*(t-0.9)*0.9));\n    // iron specks bleed through\n    glazeCol = mix(glazeCol, vec3(0.22,0.13,0.07), speck*0.5*exp(-tt*1.2));\n\n    // crackle network (two scales, only in glaze)\n    float crk = 0.0;\n    if(uCrackle>0.0){\n      vec3 wp = p + 0.02*vec3(gnoise(p*13.0), gnoise(p*13.0+7.0), gnoise(p*13.0+3.0));\n      vec3 c1 = voronoiB(wp*vec3(5.5,7.0,5.5)+vec3(3.0));\n      vec3 c2 = voronoiB(wp*15.0+vec3(1.3));\n      float l1 = 1.0-smoothstep(0.004, 0.016, c1.x);\n      float l2 = (1.0-smoothstep(0.004, 0.02, c2.x))*0.45;\n      float reveal = smoothstep(c1.y*0.8, c1.y*0.8+0.2, uCrackle);\n      crk = max(l1*reveal, l2*smoothstep(0.4,1.0,uCrackle)*step(0.55,c2.y));\n      crk *= 0.55+0.45*sat(gnoise(p*5.0)+0.5);\n      vec3 crackCol = mix(glazeCol*1.4+0.06, vec3(0.28,0.16,0.07), uStain*(h.side>0.0?1.0:0.6));\n      glazeCol = mix(glazeCol, crackCol, crk*0.8);\n    }\n\n    vec3 glazed = glazeCol;\n    s.alb = mix(s.alb, mix(glazed, slip, rawAmt), cov);\n    s.rough = mix(s.rough, 0.9, cov*rawAmt);\n    // melted glaze is a clear coat\n    float coat = cov*uMelt;\n    s.coat = max(s.coat, coat);\n    s.coatRough = mix(s.coatRough, 0.045, coat);\n    vec3 cn = n;\n    BUMP(cn, p, glazeRipple, 0.004, 0.0004*uMelt);\n    s.cn = normalize(mix(s.cn, cn, coat));\n    s.sss = 0.35*coat*scat;\n  }\n\n  // ---------- tea stain on the unglazed foot over years\n  s.alb *= 1.0 - 0.15*uStain*step(h.side,-1.5);\n\n  // ---------- incandescence\n  if(uHeat>0.0){\n    float T = mix(800.0, 1330.0, uHeat);\n    s.emit = blackbody(T)*pow(uHeat,2.2)*2.5*(0.85+0.15*grain);\n  }\n\n  // ---------- kintsugi gold\n  if(uGold>0.0){\n    vec3 sf = seamField(p);\n    float w = 0.0075*(0.75+0.5*sat(gnoise(p*6.0)*0.5+0.5));\n    float g = 1.0-smoothstep(w*0.75, w, sf.x);\n    g *= uGold;\n    if(g>0.0){\n      vec3 e = normalize(uSeeds[int(sf.z)].xyz-uSeeds[int(sf.y)].xyz);\n      float x = sat(sf.x/w);\n      float slope = -0.9*x/sqrt(max(1.0-x*x,0.02));\n      vec3 et = normalize(e - n*dot(e,n));\n      vec3 gn = normalize(n + slope*et*0.6);\n      float burnish = sat(0.5+0.8*gnoise(p*40.0));\n      s.alb = mix(s.alb, vec3(0.0), g);\n      s.f0 = mix(s.f0, vec3(1.0,0.74,0.32), g);\n      s.rough = mix(s.rough, mix(0.34,0.14,burnish), g);\n      s.coat = mix(s.coat, 0.0, g);\n      s.n = normalize(mix(s.n, gn, g));\n      s.cn = s.n;\n    }\n  }\n  return s;\n}\n\n// ---------------------------------------------------------------- the room\n// A low table by a shoji wall. Every visual parameter lives in a Mem struct so\n// the same room can be traced \"now\" (Life scene) or at any remembered moment\n// (the shard portals).\n//\n// Room coordinates (units 10cm): table top y=0, bowl at origin.\n// Shoji wall is the plane z = WALLZ, facing -z. Floor at y = FLOORY.\n#define WALLZ 7.0\n#define FLOORY -3.3\n#define TABLE_HX 6.0\n#define TABLE_HZ 4.2\n\nstruct Mem {\n  float day;      // 0..1  (0.25 sunrise, 0.5 noon, 0.75 sunset)\n  float season;   // 0 spring, 1 summer, 2 autumn, 3 winter (continuous)\n  float two;      // second bowl presence 0..1\n  float gap;      // distance between the bowls (bowl-centre spacing)\n  float candle;   // candle light 0..1\n  float steam;    // steam amount 0..1\n  float tea;      // tea level 0..1 in the celadon bowl\n  float tea2;     // tea in the tenmoku\n  float open;     // shoji panel open 0..1\n  float ring;     // faint ring left where the second bowl stood\n  float bowlOn;   // celadon bowl present on table (0 while lifted/fallen)\n  vec3  bowlOff;  // offset of the celadon bowl (lift)\n  float bowlTilt; // tilt of the celadon bowl\n};\n\nuniform vec4 uProf2[6]; // tenmoku profile\n\n// ---- second bowl: tenmoku (conical, dark iron glaze), analytic 6-point lathe\nfloat sdTenmoku(vec3 p){\n  vec2 q = vec2(length(p.xz), p.y);\n  float d = 1e5;\n  for(int i=0;i<5;i++){\n    vec2 a=uProf2[i].xy, ba=uProf2[i+1].xy-a, pa=q-a;\n    float t=sat(dot(pa,ba)/dot(ba,ba));\n    d=min(d, length(pa-ba*t)-mix(uProf2[i].z, uProf2[i+1].z, t));\n  }\n  // foot\n  d = smin(d, sdSeg(q, vec2(0.17,0.07), vec2(0.18,0.025))-0.022, 0.02);\n  return d;\n}\n\nvec3 sunDir(Mem m){\n  // sun travels across the sky beyond the shoji (+z), lower in winter\n  float a = (m.day-0.25)*PI;            // 0 at sunrise, PI at sunset\n  float elev = mix(0.95, 0.5, sat(abs(m.season-1.0)/2.0)) ;\n  vec3 d = vec3(-cos(a)*0.9, sin(a)*elev, 1.0);\n  return normalize(d);\n}\nfloat sunUp(Mem m){ return smoothstep(0.2,0.3,m.day)*smoothstep(0.8,0.7,m.day); }\nvec3 sunColor(Mem m){\n  float h = sunDir(m).y;\n  vec3 c = mix(vec3(1.0,0.45,0.16), vec3(1.0,0.86,0.68), smoothstep(0.05,0.45,h));\n  c *= mix(1.0, 0.8, smoothstep(2.5,3.0,m.season)); // pale winter\n  return c*6.0*sunUp(m);\n}\nvec3 skyColor(Mem m, float up){\n  float d = sunUp(m);\n  vec3 night = vec3(0.012,0.016,0.03);\n  vec3 dayc = mix(vec3(0.45,0.58,0.8), vec3(0.62,0.66,0.72), smoothstep(2.4,3.0,m.season));\n  vec3 c = mix(night, dayc*(0.6+0.4*up), d);\n  float dusk = sat(1.0-abs(m.day-0.25)*12.0)+sat(1.0-abs(m.day-0.75)*12.0);\n  c = mix(c, vec3(0.9,0.5,0.3)*0.8, dusk*0.5*(1.0-up));\n  return c;\n}\n\n// shoji lattice: 1 on paper, 0 on wood bars. uv in wall coords (x, y)\nfloat shojiPaper(vec2 w){\n  vec2 cell = vec2(1.9, 2.3);\n  vec2 f = abs(fract(w/cell+0.5)-0.5)*cell;\n  float bar = min(f.x, f.y);\n  return smoothstep(0.07, 0.1, bar);\n}\n// open panel: a slid-open gap in the shoji (x from -1.2 widening to the right)\nfloat openPanel(vec2 w, Mem m){\n  float x0 = -1.2, x1 = x0 + m.open*4.0;\n  return step(x0,w.x)*step(w.x,x1)*step(-1.0,w.y)*step(w.y,14.0);\n}\n// light transmitted through the wall toward direction L from point p\n// returns (direct sun fraction through the gap, diffuse paper glow factor)\nvec2 wallTransmit(vec3 p, vec3 L, Mem m){\n  if(L.z<=0.01) return vec2(0);\n  float t = (WALLZ-p.z)/L.z;\n  vec2 w = (p+L*t).xy;\n  if(w.y<-1.0 || w.y>14.0) return vec2(0);\n  // soft penumbra on the gap edges (sun is not a point, the gap is 30cm away)\n  float x0 = -1.2, x1 = x0 + m.open*4.0;\n  float pen = 0.05 + 0.012*t;\n  float open = smoothstep(x0-pen, x0+pen, w.x)*smoothstep(x1+pen, x1-pen, w.x)*smoothstep(-1.0,-0.6,w.y);\n  return vec2(open, 1.0-open);\n}\n\n// garden through the gap: an out-of-focus impression (DOF will blur it more)\nvec3 garden(vec3 ro, vec3 rd, Mem m){\n  vec3 sky = skyColor(m, rd.y);\n  float t = (WALLZ+40.0-ro.z)/max(rd.z,1e-3);\n  vec2 g = (ro+rd*t).xy*0.05;\n  float s = m.season;\n  vec3 spring = vec3(1.0,0.66,0.74), summer = vec3(0.16,0.32,0.10), autumn = vec3(0.9,0.26,0.06), winter = vec3(0.35,0.32,0.3);\n  vec3 leaf = s<1.0 ? mix(spring,summer,smoothstep(0.3,1.0,s)) : s<2.0 ? mix(summer,autumn,smoothstep(1.3,2.0,s)) : mix(autumn,winter,smoothstep(2.1,2.6,s));\n  float bare = smoothstep(2.2,2.7,s);\n  vec3 sunc = sunColor(m);\n  vec3 lit = sunc*0.1 + skyColor(m,1.0)*0.45;\n  // foliage mass: soft, low frequency\n  float mass = fbm(g*vec2(1.2,1.6)+vec2(1.7,0.3), 4)*0.9 + 0.25 - 0.35*g.y;\n  float leafy = smoothstep(-0.05,0.25,mass)*(1.0-0.85*bare);\n  vec3 col = mix(sky, leaf*lit*(0.55+0.6*sat(fbm(g*5.0,3)+0.5)), leafy);\n  // sun sparkles through the canopy (become bokeh discs)\n  vec3 v = voronoiB(g*14.0);\n  float spark = smoothstep(0.25,0.05,v.z)*step(0.82,v.y)*leafy*sunUp(m);\n  col += sunc*0.25*spark*mix(vec3(1.0), leaf+0.3, 0.5);\n  // winter: snow on the ground and bare dark branches\n  float branches = (1.0-smoothstep(0.0,0.06,abs(fbm(g*vec2(2.0,1.0)+3.0,4))))*smoothstep(0.8,0.0,g.y)*bare;\n  col = mix(col, vec3(0.02)*lit, branches*0.8);\n  float ground = smoothstep(-0.28,-0.4,g.y+0.05*fbm(g*6.0,2));\n  vec3 gcol = mix(vec3(0.06,0.09,0.04), vec3(0.85,0.88,0.93), smoothstep(2.6,2.9,s));\n  col = mix(col, gcol*(lit+0.02), ground);\n  return col;\n}\n\n// -------- geometry\n// ids: 1 bowl, 2 tenmoku, 3 table, 4 wall, 5 floor, 6 tea surface, 7 candle\nvec3 bowlLocal(vec3 p, Mem m){\n  vec3 q = p - m.bowlOff;\n  q.xy = rot(m.bowlTilt)*q.xy;\n  return q;\n}\nvec3 tenLocal(vec3 p, Mem m){ return p - vec3(-m.gap*0.95, 0.0, m.gap*0.3); }\nvec3 candlePos(){ return vec3(2.6, 0.0, 1.6); }\n\nvec2 roomMap(vec3 p, Mem m){\n  vec2 r = vec2(1e5, 0.0);\n  // table top slab (only its top face and edges matter)\n  float tb = sdRBox(p-vec3(0.0,-0.25,0.0), vec3(TABLE_HX,0.25,TABLE_HZ), 0.04);\n  r = vec2(tb, 3.0);\n  if(m.bowlOn>0.5){\n    vec3 q = bowlLocal(p,m);\n    float bb = length(q-vec3(0,0.35,0))-0.75;\n    float b = bb>0.4 ? bb : sdBowl(q);\n    if(b<r.x) r=vec2(b,1.0);\n  }\n  if(m.two>0.01){\n    vec3 q = tenLocal(p,m);\n    q.y += (1.0-m.two)*8.0;    // absent bowls are far below the table\n    float bb = length(q-vec3(0,0.3,0))-0.7;\n    float b = bb>0.4 ? bb : sdTenmoku(q);\n    if(b<r.x) r=vec2(b,2.0);\n  }\n  // candle (short, in a clay dish)\n  if(m.candle>0.01){\n    vec3 q = p-candlePos();\n    float c = sdCyl(q-vec3(0,0.4,0), 0.22, 0.4);\n    c = min(c, sdCyl(q-vec3(0,0.04,0), 0.42, 0.04));\n    if(c<r.x) r=vec2(c,7.0);\n  }\n  // wall and floor\n  float w = WALLZ + 0.02 - p.z;\n  if(w<r.x) r=vec2(w,4.0);\n  float back = min(p.z + 16.0, min(14.0 - p.x, p.x + 14.0));\n  if(back<r.x) r=vec2(back, 8.0);\n  float f = p.y-FLOORY;\n  if(f<r.x) r=vec2(f,5.0);\n  return r;\n}\n\nvec3 roomNormal(vec3 p, Mem m){\n  const vec2 e=vec2(0.0008,-0.0008);\n  return normalize(e.xyy*roomMap(p+e.xyy,m).x+e.yyx*roomMap(p+e.yyx,m).x+e.yxy*roomMap(p+e.yxy,m).x+e.xxx*roomMap(p+e.xxx,m).x);\n}\n\nfloat roomShadow(vec3 ro, vec3 rd, Mem m, float k){\n  float res=1.0, t=0.01;\n  for(int i=0;i<40;i++){\n    vec3 p = ro+rd*t;\n    if(p.y>1.5 || p.z>WALLZ-0.1) break;\n    float h=roomMap(p,m).x;\n    res=min(res, k*h/t);\n    t+=clamp(h,0.01,0.25);\n    if(res<0.002) break;\n  }\n  return sat(res);\n}\n\n// radiance of the shoji wall itself (glowing paper; the gap shows the garden)\nvec3 wallRadianceR(vec3 p, vec3 rd, Mem m, float rough){\n  vec2 w = p.xy;\n  vec3 L = sunDir(m);\n  vec3 sunc = sunColor(m);\n  float paper = mix(shojiPaper(w), 0.8, sat(rough*6.0));\n  vec3 glow = (skyColor(m,0.7)*1.1 + sunc*0.10*sat(L.z))*vec3(1.0,0.95,0.86);\n  // the sun's disc seen through paper: broad warm hot-spot\n  vec2 sp = vec2(p.x - L.x/L.z*6.0, p.y - 2.0 + L.y*4.0);\n  glow *= 1.0 + 1.1*sunUp(m)*exp(-dot(sp,sp)*0.02);\n  glow *= 0.9+0.1*fbm(w*2.5,3);\n  vec3 wood = vec3(0.045,0.03,0.02)*(skyColor(m,0.5)*0.5 + 0.02);\n  vec3 col = mix(wood, glow, paper);\n  float open = openPanel(w, m);\n  if(open>0.5) col = garden(p, rd, m);\n  // plaster below the shoji, lintel above\n  if(w.y<-1.0 || w.y>14.0) col = vec3(0.30,0.26,0.21)*(skyColor(m,0.2)*0.15+0.004);\n  return col;\n}\nvec3 wallRadiance(vec3 p, vec3 rd, Mem m){ return wallRadianceR(p, rd, m, 0.0); }\n\n// irradiance estimate inside the room: the shoji is a big soft area light\nvec3 roomAmbient(vec3 p, vec3 n, Mem m){\n  vec3 sky = skyColor(m, 0.7);\n  float toWall = sat(n.z*0.6+0.4);\n  float near = 1.0/(1.0+0.02*sq(WALLZ-p.z));\n  vec3 a = sky*(0.03 + 0.55*toWall*toWall*near)*(0.7+0.3*sat(n.y));\n  // warm bounce from the room behind the camera (sunlit tatami, plaster)\n  a += (sky*0.06 + sunColor(m)*0.012)*vec3(1.0,0.85,0.7)*sat(-n.z*0.7+0.3);\n  a += sunColor(m)*0.015*sat(-n.y*0.5+0.5)*0.5;  // bounce from sunlit floor\n  return a;\n}\n\nvec3 candleLight(vec3 p, vec3 n, Mem m, out vec3 L){\n  vec3 fl = candlePos()+vec3(0.0,1.05,0.0);\n  vec3 d = fl-p; float r2 = dot(d,d); L = d*inversesqrt(r2);\n  float flick = 0.85+0.15*sin(uTime*23.0)*sin(uTime*7.3+1.0);\n  return vec3(1.0,0.55,0.22)*m.candle*flick*3.0/(r2+0.5);\n}\n\nvec3 woodTable(vec3 p){\n  vec2 u = p.xz;\n  float warp = fbm(u*vec2(0.18,0.9),3);\n  float ring = fract((u.y+warp*1.8)*1.6 + 0.3*fbm(u*vec2(0.06,0.5),2));\n  float grain = smoothstep(0.0,0.3,ring)*smoothstep(1.0,0.55,ring);\n  vec3 c = mix(vec3(0.075,0.042,0.024), vec3(0.15,0.085,0.045), grain);\n  c *= 0.8+0.3*sat(fbm(u*vec2(0.5,14.0),3)+0.5);\n  return c;\n}\n\n// inner radius of the celadon bowl at height y (for the tea surface)\nfloat teaRadius(float y){\n  for(int i=0;i<NPROF-1;i++){\n    vec4 a=uProf[i], b=uProf[i+1];\n    if(y>=a.y && y<b.y){ float t=(y-a.y)/max(b.y-a.y,1e-4); return mix(a.x,b.x,t)-mix(a.z,b.z,t)*1.1; }\n  }\n  return 0.0;\n}\nfloat teaHeight(float lvl){ return mix(0.16, 0.56, lvl); }\n\n// cheap reflection lookup: shoji wall / table / dark room, no occlusion\nvec3 roomReflect(vec3 p, vec3 r, float rough, Mem m){\n  vec3 c = vec3(0.0);\n  if(r.z>0.05){\n    float t=(WALLZ-p.z)/r.z; vec3 w=p+r*t;\n    if(w.y>FLOORY && w.y<16.0) c = wallRadianceR(w, r, m, rough);\n    else c = skyColor(m,0.3)*0.05;\n  } else if(r.y<-0.05){\n    float t=-p.y/r.y; vec3 w=p+r*t;\n    vec2 tr = wallTransmit(w, sunDir(m), m);\n    c = woodTable(w)*(sunColor(m)*tr.x*sat(sunDir(m).y) + roomAmbient(w, vec3(0,1,0), m));\n  } else {\n    c = roomAmbient(p, -r, m)*0.25;\n  }\n  // blur toward average as roughness grows\n  return mix(c, roomAmbient(p, r, m)*0.8, sat(rough*3.5));\n}\n\nvec3 roomLightSurf(Surf s, vec3 p, vec3 v, Mem m, float ao){\n  vec3 L = sunDir(m);\n  vec3 sc = sunColor(m);\n  vec2 tr = wallTransmit(p, L, m);\n  float sh = 1.0;\n  if(tr.x>0.0 && sunUp(m)>0.0) sh = roomShadow(p+s.n*0.004, L, m, 12.0);\n  vec3 direct = sc*tr.x*sh;\n  float nl = sat(dot(s.n,L));\n  float nv = sat(dot(s.cn,v));\n  float Fc = s.coat*F_Schlick1(0.04, nv);\n  vec3 amb = roomAmbient(p, s.n, m)*ao;\n  vec3 Lc; vec3 cl = candleLight(p, s.n, m, Lc);\n  vec3 dif = s.alb*(1.0-Fc)*(direct*nl + amb + cl*sat(dot(s.n,Lc)) + s.sss*direct*sat(dot(-s.n,L)*0.5+0.4)*0.4);\n  vec3 spec = specGGX(s.n, v, L, s.rough, s.f0)*direct + specGGX(s.n, v, Lc, s.rough, s.f0)*cl;\n  vec2 eb = envBRDF(sat(dot(s.n,v)), s.rough);\n  spec += roomReflect(p, reflect(-v,s.n), s.rough, m)*(s.f0*eb.x+eb.y)*ao;\n  vec3 coat = vec3(0);\n  if(s.coat>0.0){\n    coat = s.coat*(specGGX(s.cn, v, L, s.coatRough, vec3(0.04))*direct\n                  + specGGX(s.cn, v, Lc, s.coatRough, vec3(0.04))*cl\n                  + roomReflect(p, reflect(-v,s.cn), s.coatRough, m)*F_Schlick1(0.04,nv)*ao);\n  }\n  return dif + spec + coat + s.emit;\n}\n\nfloat roomAO(vec3 p, vec3 n, Mem m){\n  float o=0.0, sc=1.0;\n  for(int i=1;i<=4;i++){ float h=0.03*float(i*i); o+=(h-roomMap(p+n*h,m).x)*sc; sc*=0.65; }\n  return sat(1.0-1.6*o);\n}\n\nSurf tenmokuSurface(vec3 q, vec3 n){\n  Surf s = defaultSurf(n);\n  float y = q.y;\n  // iron glaze: black-brown with rust breaking at the rim, \"hare's fur\" streaks\n  float a = atan(q.z,q.x);\n  float fur = sat(0.5+0.7*gnoise(vec3(a*90.0+3.0*gnoise(q*6.0), y*2.0, 0.0)))*0.8;\n  vec3 black = vec3(0.018,0.012,0.009);\n  vec3 rust = vec3(0.30,0.12,0.04);\n  vec3 c = mix(black, rust, sat(fur*smoothstep(0.3,0.62,y)*0.55 + 0.8*smoothstep(0.56,0.63,y)));\n  float foot = step(y,0.1)*step(length(q.xz),0.24);\n  c = mix(c, vec3(0.42,0.3,0.2), foot + smoothstep(0.14,0.1,y));\n  s.alb = c; s.rough=0.7;\n  s.coat = 1.0-foot; s.coatRough = 0.035;\n  return s;\n}\n\n// shade tea surface (matcha)\nvec3 teaShade(vec3 p, vec3 v, Mem m, float froth){\n  vec3 n = vec3(0,1,0);\n  vec2 u = p.xz;\n  float bub = voronoiB(vec3(u*55.0, 1.0)).z;\n  float foam = sat(froth*(0.6+0.6*fbm(u*9.0,3)));\n  vec3 base = mix(vec3(0.10,0.17,0.02), vec3(0.42,0.58,0.16), foam);\n  base *= 0.9+0.2*smoothstep(0.2,0.6,bub);\n  Surf s = defaultSurf(n);\n  s.alb = base; s.rough=0.5; s.coat = 1.0-foam*0.8; s.coatRough = 0.06;\n  s.n = normalize(n + vec3(gnoise(vec3(u*30.0,0.0)),0.0,gnoise(vec3(u*30.0,3.0)))*0.03*foam);\n  s.cn = n;\n  return roomLightSurf(s, p, v, m, 1.0);\n}\n\n// steam: a few noisy wisps rising from a point, integrated front to back\nvec4 steamVolume(vec3 ro, vec3 rd, float tmax, vec3 base, float amt, Mem m){\n  if(amt<0.01) return vec4(0);\n  // bounding cylinder r=0.55 around base, y in [base.y, base.y+4]\n  vec3 oc = ro-base;\n  float a=dot(rd.xz,rd.xz), b=dot(oc.xz,rd.xz), c=dot(oc.xz,oc.xz)-0.55*0.55;\n  float h=b*b-a*c; if(h<0.0) return vec4(0);\n  h=sqrt(h); float t0=max((-b-h)/a,0.0), t1=min((-b+h)/a,tmax);\n  if(t1<=t0) return vec4(0);\n  vec4 acc=vec4(0);\n  float dt=(t1-t0)/14.0;\n  float t=t0+dt*ign(gl_FragCoord.xy);\n  vec3 sc = sunColor(m)*0.18+roomAmbient(base, vec3(0,1,0), m)*2.2 + vec3(0.02);\n  for(int i=0;i<14;i++){\n    vec3 p=ro+rd*t-base;\n    float y=p.y;\n    if(y>0.0 && y<4.0){\n      vec3 q=p; q.xz += vec2(sin(y*1.3+uTime*0.7), cos(y*1.1+uTime*0.5))*0.12*y;\n      float r=length(q.xz);\n      float n=fbm(vec3(q.x*3.5, y*1.4-uTime*1.1, q.z*3.5),3);\n      // thin rising filaments rather than a cloud\n      float fil = 1.0-abs(2.0*vnoise(vec3(q.x*6.0, y*2.2-uTime*1.5, q.z*6.0))-1.0);\n      float d=sat(n*1.5+0.05-r*2.6)*fil*fil*smoothstep(0.0,0.35,y)*smoothstep(3.2,0.8,y)*amt;\n      float al=1.0-exp(-d*dt*3.0);\n      acc.rgb += (1.0-acc.a)*al*sc*0.6;\n      acc.a += (1.0-acc.a)*al;\n    }\n    t+=dt;\n  }\n  return acc;\n}\n\n// ---- full trace of the room. Returns colour and hit distance.\nvec4 roomTrace(vec3 ro, vec3 rd, Mem m, int steps){\n  float t=0.0; vec2 h=vec2(0.0);\n  bool hit=false;\n  for(int i=0;i<200;i++){\n    if(i>=steps) break;\n    h = roomMap(ro+rd*t, m);\n    if(h.x<0.0003*t+0.0005){ hit=true; break; }\n    t += h.x*0.9;\n    if(t>120.0) break;\n  }\n  // tea surface is analytic (flat disk inside the bowl)\n  float tTea = 1e5;\n  if(m.tea>0.01 && m.bowlOn>0.5){\n    float yT = teaHeight(m.tea);\n    vec3 lo = bowlLocal(ro,m), ld = rd; ld.xy = rot(m.bowlTilt)*ld.xy;\n    float tt = (yT-lo.y)/ld.y;\n    if(tt>0.0){ vec3 q=lo+ld*tt; if(length(q.xz)<teaRadius(yT)) tTea=tt; }\n  }\n  vec3 col = vec3(0);\n  if(hit || tTea<1e4){\n    if(tTea < t || !hit){\n      t = tTea;\n      col = teaShade(ro+rd*t, -rd, m, 0.8);\n    } else {\n      vec3 p = ro+rd*t;\n      vec3 n = roomNormal(p, m);\n      vec3 v = -rd;\n      float ao = roomAO(p, n, m);\n      if(h.y==1.0){\n        vec3 q = bowlLocal(p,m);\n        vec3 nq = n; nq.xy = rot(m.bowlTilt)*nq.xy;\n        Surf s = bowlSurface(q, nq, v);\n        s.n.xy = rot(-m.bowlTilt)*s.n.xy; s.cn.xy = rot(-m.bowlTilt)*s.cn.xy;\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==2.0){\n        Surf s = tenmokuSurface(tenLocal(p,m), n);\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==3.0){\n        Surf s = defaultSurf(n);\n        s.alb = woodTable(p);\n        // ring stain where the second bowl stood\n        vec3 tq = tenLocal(p, m);\n        float rr = length(tq.xz);\n        s.alb *= 1.0 - 0.35*m.ring*smoothstep(0.03,0.0,abs(rr-0.2))*step(p.y,0.01);\n        s.rough = 0.55; s.coat = 0.35; s.coatRough = 0.16;\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==4.0){\n        col = wallRadiance(p, rd, m);\n      } else if(h.y==5.0){\n        Surf s = defaultSurf(n);\n        // dark polished floorboards\n        float plank = floor(p.x/1.4);\n        float gz = p.z + hash11(plank)*30.0;\n        float grain = fbm(vec2(p.x*3.0, gz*0.35)+plank*7.0, 4);\n        s.alb = vec3(0.10,0.06,0.035)*(0.75+0.5*sat(grain+0.5))*(0.85+0.3*hash11(plank+3.0));\n        float seam = smoothstep(0.02,0.0,abs(fract(p.x/1.4)-0.5)-0.49);\n        s.alb *= 1.0-0.6*seam;\n        s.rough=0.5; s.coat=0.6; s.coatRough=0.12;\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==8.0){\n        Surf s = defaultSurf(n);\n        s.alb = vec3(0.28,0.24,0.2)*(0.8+0.2*fbm(p.xy*0.5,3)); s.rough = 0.9;\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==7.0){\n        Surf s = defaultSurf(n);\n        vec3 q = p-candlePos();\n        s.alb = q.y>0.1 ? vec3(0.8,0.75,0.65) : vec3(0.3,0.18,0.1);\n        s.sss = 1.0; s.rough=0.6;\n        col = roomLightSurf(s, p, v, m, ao);\n        // wax glows near the top\n        col += vec3(1.0,0.5,0.2)*m.candle*smoothstep(0.5,0.8,q.y)*0.6;\n      }\n    }\n  } else {\n    col = roomAmbient(ro, -rd, m)*0.2;\n    t = 120.0;\n  }\n  // candle flame (additive glow along the ray)\n  if(m.candle>0.01){\n    vec3 fl = candlePos()+vec3(0.0,1.05,0.0);\n    vec3 oc = fl-ro; float tc = max(dot(oc,rd),0.0);\n    if(tc<t+0.2){\n      vec3 d = ro+rd*tc-fl; d.y *= 0.45;\n      float fd = length(d);\n      col += vec3(1.0,0.62,0.25)*m.candle*(0.02/(fd*fd+0.004) + 0.15*exp(-fd*4.0));\n    }\n  }\n  return vec4(col, t);\n}\n\n// sunbeams through the open panel, with drifting dust\nvec3 roomBeams(vec3 ro, vec3 rd, float tmax, Mem m, int N, float dens){\n  vec3 L = sunDir(m);\n  vec3 sc = sunColor(m);\n  if(sunUp(m)<0.01) return vec3(0);\n  float tEnd = min(tmax, 30.0);\n  float dt = tEnd/float(N);\n  float t = dt*ign(gl_FragCoord.xy+uTime*60.0);\n  vec3 acc = vec3(0);\n  float mu = dot(rd, L);\n  float g=0.55; float phase = (1.0-g*g)/(4.0*PI*pow(1.0+g*g-2.0*g*mu,1.5));\n  for(int i=0;i<64;i++){\n    if(i>=N) break;\n    vec3 p = ro+rd*t;\n    vec2 tr = wallTransmit(p, L, m);\n    float d = dens*(0.25+1.2*sq(vnoise(p*0.9+vec3(0.0,uTime*0.05,0.0))));\n    acc += tr.x*d*dt;\n    t += dt;\n  }\n  return acc*sc*phase;\n}\n\n// ---------------------------------------------------------------- scene: LIFE\nuniform float uMemDay, uMemSeason, uMemTwo, uMemGap, uMemCandle, uMemSteam, uMemTea, uMemTea2, uMemOpen, uMemRing;\nuniform float uBowlOn, uBowlTilt;\nuniform vec3  uBowlOff;\nuniform float uBeams;\nout vec4 fragColor;\n\nMem currentMem(){\n  Mem m;\n  m.day=uMemDay; m.season=uMemSeason; m.two=uMemTwo; m.gap=uMemGap; m.candle=uMemCandle;\n  m.steam=uMemSteam; m.tea=uMemTea; m.tea2=uMemTea2; m.open=uMemOpen; m.ring=uMemRing;\n  m.bowlOn=uBowlOn; m.bowlOff=uBowlOff; m.bowlTilt=uBowlTilt;\n  return m;\n}\n\nvoid main(){\n  Mem m = currentMem();\n  vec3 ro = uCamPos, rd = camRay(gl_FragCoord.xy);\n  vec4 r = roomTrace(ro, rd, m, 140);\n  vec3 col = r.rgb;\n  // steam above the bowls\n  vec4 st = steamVolume(ro, rd, r.a, m.bowlOff+vec3(0,teaHeight(m.tea),0), m.steam*step(0.01,m.tea), m);\n  vec4 st2 = steamVolume(ro, rd, r.a, vec3(-m.gap*0.95, 0.45, m.gap*0.3), m.steam*m.two*step(0.01,m.tea2), m);\n  col = col*(1.0-st.a)+st.rgb;\n  col = col*(1.0-st2.a)+st2.rgb;\n  col += roomBeams(ro, rd, r.a, m, 24, 0.05*uBeams);\n  fragColor = vec4(col, r.a);\n}\n","enso":"#version 300 es\n// ---------------------------------------------------------------- common\nprecision highp float;\nprecision highp int;\n\nin vec2 vUv;\nuniform vec2  uRes;\nuniform float uTime;      // film time, seconds\nuniform float uLocal;     // scene-local time\nuniform vec3  uCamPos;\nuniform mat3  uCamRot;\nuniform float uFov;       // tan(fov/2)\nuniform vec2  uJitter;    // subpixel jitter in pixels\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n\nfloat sat(float x){ return clamp(x,0.,1.); }\nvec3  sat(vec3 x){ return clamp(x,0.,1.); }\nfloat sq(float x){ return x*x; }\nfloat lin(float a,float b,float x){ return sat((x-a)/(b-a)); }\nmat2  rot(float a){ float c=cos(a),s=sin(a); return mat2(c,s,-s,c); }\n\n// ---- hashing (integer based, stable across GPUs)\nuint hashu(uint x){ x ^= x>>16; x *= 0x7feb352du; x ^= x>>15; x *= 0x846ca68bu; x ^= x>>16; return x; }\nfloat hash11(float p){ return float(hashu(floatBitsToUint(p)))*(1.0/4294967296.0); }\nfloat hash12(vec2 p){ uvec2 q = uvec2(ivec2(floor(p))); return float(hashu(q.x ^ hashu(q.y + 0x9e3779b9u)))*(1.0/4294967296.0); }\nfloat hash13(vec3 p){ uvec3 q = uvec3(ivec3(floor(p))); return float(hashu(q.x ^ hashu(q.y ^ hashu(q.z + 0x632be5abu))))*(1.0/4294967296.0); }\nvec3  hash33(vec3 p){\n  uvec3 q = uvec3(ivec3(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y ^ hashu(q.z)));\n  return vec3(float(h), float(hashu(h)), float(hashu(h+1u)))*(1.0/4294967296.0);\n}\nvec2  hash22(vec2 p){\n  uvec2 q = uvec2(ivec2(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y));\n  return vec2(float(h), float(hashu(h)))*(1.0/4294967296.0);\n}\n// screen-space blue-ish noise for dithering / jittering ray starts\nfloat ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056,0.00583715)))); }\n\n// ---- value noise\nfloat vnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*(3.0-2.0*f);\n  float a=hash13(i), b=hash13(i+vec3(1,0,0)), c=hash13(i+vec3(0,1,0)), d=hash13(i+vec3(1,1,0));\n  float e=hash13(i+vec3(0,0,1)), f1=hash13(i+vec3(1,0,1)), g=hash13(i+vec3(0,1,1)), h=hash13(i+vec3(1,1,1));\n  return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y), mix(mix(e,f1,u.x),mix(g,h,u.x),u.y), u.z);\n}\nfloat vnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*(3.0-2.0*f);\n  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y);\n}\n// gradient noise (signed, -1..1)\nfloat gnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash33(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(mix(G(vec3(0,0,0)),G(vec3(1,0,0)),u.x), mix(G(vec3(0,1,0)),G(vec3(1,1,0)),u.x),u.y),\n                mix(mix(G(vec3(0,0,1)),G(vec3(1,0,1)),u.x), mix(G(vec3(0,1,1)),G(vec3(1,1,1)),u.x),u.y),u.z);\n  #undef G\n  return r*1.6;\n}\nfloat gnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash22(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(G(vec2(0,0)),G(vec2(1,0)),u.x), mix(G(vec2(0,1)),G(vec2(1,1)),u.x), u.y);\n  #undef G\n  return r*1.4;\n}\nfloat fbm(vec3 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=p*2.03+vec3(17.1,-3.7,9.2); a*=0.5; }\n  return s;\n}\nfloat fbm(vec2 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,7.7); a*=0.5; }\n  return s;\n}\n\n// Voronoi with true border distance (iq). Returns (border distance, cell id hash, F1)\nvec3 voronoiB(vec3 x){\n  vec3 p=floor(x), f=fract(x);\n  vec3 mb; vec3 mr; float md=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=mb+vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    vec3 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash13(p+mb+vec3(7.0)), sqrt(md));\n}\nvec3 voronoiB(vec2 x){\n  vec2 p=floor(x), f=fract(x);\n  vec2 mb; vec2 mr; float md=8.0;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec2 b=vec2(i,j); vec2 r=b+hash22(p+b)-f; float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){\n    vec2 b=mb+vec2(i,j); vec2 r=b+hash22(p+b)-f; vec2 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash12(p+mb+vec2(7.0)), sqrt(md));\n}\n\n// ---- SDF helpers\nfloat smin(float a,float b,float k){ float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*0.25; }\nfloat smax(float a,float b,float k){ return -smin(-a,-b,k); }\nfloat sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }\nfloat sdBox(vec2 p, vec2 b){ vec2 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,q.y),0.0); }\nfloat sdRBox(vec3 p, vec3 b, float r){ return sdBox(p,b-r)-r; }\nfloat sdCyl(vec3 p, float r, float h){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }\nfloat sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=sat(dot(pa,ba)/dot(ba,ba)); return length(pa-ba*h); }\n\n// ---- camera\nvec3 camRay(vec2 frag){\n  vec2 uv = (2.0*(frag+uJitter)-uRes)/uRes.y;\n  return normalize(uCamRot*vec3(uv*uFov, 1.0));\n}\n\n// ---- colour\nvec3 blackbody(float t){ // t in Kelvin, returns linear rgb (normalised-ish)\n  t = clamp(t, 800.0, 12000.0)/100.0;\n  vec3 c;\n  c.r = t<=66.0 ? 1.0 : 1.292936*pow(t-60.0,-0.1332047592);\n  c.g = t<=66.0 ? 0.3900815*log(t)-0.6318414 : 1.129890*pow(t-60.0,-0.0755148492);\n  c.b = t>=66.0 ? 1.0 : (t<=19.0 ? 0.0 : 0.5432068*log(t-10.0)-1.1962541);\n  return pow(sat(c), vec3(2.2));\n}\nfloat luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }\n\n// ---- BRDF\nfloat D_GGX(float nh, float a){ float a2=a*a; float d=nh*nh*(a2-1.0)+1.0; return a2/(PI*d*d); }\nfloat V_SmithJ(float nv, float nl, float a){ float a2=a*a;\n  float gv=nl*sqrt(nv*nv*(1.0-a2)+a2), gl=nv*sqrt(nl*nl*(1.0-a2)+a2); return 0.5/max(gv+gl,1e-5); }\nvec3  F_Schlick(vec3 f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\nfloat F_Schlick1(float f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\n// returns specular (already multiplied by nl)\nvec3 specGGX(vec3 n, vec3 v, vec3 l, float rough, vec3 f0){\n  vec3 h=normalize(v+l);\n  float nl=sat(dot(n,l)), nv=max(dot(n,v),1e-4), nh=sat(dot(n,h)), vh=sat(dot(v,h));\n  float a=max(rough*rough,0.002);\n  return D_GGX(nh,a)*V_SmithJ(nv,nl,a)*F_Schlick(f0,vh)*nl;\n}\n// analytic env-BRDF approximation (Karis)\nvec2 envBRDF(float nv, float rough){\n  vec4 c0=vec4(-1,-0.0275,-0.572,0.022), c1=vec4(1,0.0425,1.04,-0.04);\n  vec4 r=rough*c0+c1; float a004=min(r.x*r.x,exp2(-9.28*nv))*r.x+r.y;\n  return vec2(-1.04,1.04)*a004+r.zw;\n}\n\n// ---------------------------------------------------------------- scene: ENSŌ\n// Rice paper, top-down. One breath: a brush circle. Also the gold ensō at the end.\nuniform float uStroke;    // stroke progress 0..1\nuniform float uWet;       // wet sheen 0..1\nuniform float uGoldInk;   // 0 sumi, 1 gold\nuniform float uZoom;      // view half-height in paper units\nuniform vec2  uCenter;    // view centre\nuniform float uPaperL;    // paper illumination\nuniform float uFadeInk;   // ink fading out (for the final transition), 0..1\nout vec4 fragColor;\n\n#define R0 1.0\n#define TH0 (-2.25)\n#define SPAN 5.55\n\nfloat fiberField(vec2 p){\n  float f = 0.0;\n  for(int i=0;i<4;i++){\n    float a = float(i)*1.7+0.4;\n    vec2 q = rot(a)*p;\n    q += 0.3*vec2(gnoise(p*2.0+float(i)), 0.0);\n    float n = gnoise(q*vec2(2.0, 60.0)+float(i)*13.0);\n    float line = smoothstep(0.08, 0.0, abs(n))*smoothstep(0.2,0.6,vnoise(q*vec2(0.8,3.0)+float(i)));\n    f += line;\n  }\n  return f;\n}\nfloat paperHeight(vec2 p){\n  return fbm(p*6.0,4)*0.5 + fiberField(p)*0.35 + gnoise(p*90.0)*0.08;\n}\n\n// brush pressure along the stroke (0..1 arc parameter)\nfloat pressure(float u){\n  float touch = smoothstep(0.0,0.03,u);\n  float body = mix(1.25, 0.8, smoothstep(0.02,0.35,u)) * mix(1.0, 0.55, smoothstep(0.55,1.0,u));\n  return touch*body;\n}\nfloat inkLoad(float u){ return 1.0 - smoothstep(0.55, 1.02, u); }\n\n// returns ink coverage, and wetness weight in y\nvec2 ensoInk(vec2 p){\n  float r = length(p);\n  float th = atan(p.y, p.x);\n  // unwrap relative to the start, travelling counter-clockwise\n  float a = th - TH0;\n  a = mod(a, TAU);\n  float u = a/SPAN;\n  // centreline wobble and a slight spiral inward at the end\n  float Rc = R0*(1.0 + 0.018*sin(th*3.0+0.7) + 0.01*sin(th*7.0) - 0.035*smoothstep(0.7,1.0,u));\n  float w = 0.13*pressure(u);\n  float d = r - Rc;\n  // the gap after the stroke end, and the unpainted part\n  float painted = step(u, uStroke) * step(u, 1.0);\n  // brush head: rounded tip at the current position\n  float headU = min(uStroke, 1.0);\n  vec2 hp = vec2(cos(TH0+headU*SPAN), sin(TH0+headU*SPAN))*R0;\n  float tip = smoothstep(w*0.9, w*0.6, length(p-hp))*step(uStroke,0.999)*step(0.005,uStroke);\n  // bristle streaks along the stroke: v across, streak noise along u\n  float v = d/max(w,1e-3);\n  float bristle = vnoise(vec2(v*14.0, u*3.0)) * 0.6 + vnoise(vec2(v*37.0, u*9.0))*0.4;\n  float load = inkLoad(u);\n  // dry brush: gaps appear where bristles run out of ink\n  float dry = smoothstep(load-0.25, load+0.05, bristle*(0.65+0.35*abs(v)));\n  float feather = 0.05*(fiberField(p*1.3)-0.5) + 0.03*gnoise(p*40.0);\n  float edge = smoothstep(1.0+feather*6.0, 0.86+feather*6.0, abs(v));\n  float cov = edge*(1.0-dry)*painted*smoothstep(0.0, 0.006, u);\n  // start: ink pools where the brush touched down\n  vec2 sp = vec2(cos(TH0), sin(TH0))*R0;\n  float capR = 0.13*1.05;\n  float pool = smoothstep(capR, capR*0.8, length(p-sp) + 0.012*gnoise(p*30.0) + 0.01*(fiberField(p*1.3)-0.5))*step(0.001,uStroke);\n  cov = max(cov, pool);\n  cov = max(cov, tip);\n  float poolD = pool;\n  // ink density varies: darker where the bristles pressed, lighter in the dry tail\n  float dens = mix(0.8, 1.0, bristle)*mix(1.0, 0.75, smoothstep(0.55,1.0,u)*step(0.02,u));\n  dens = max(dens, poolD);\n  // how recently painted (for the wet sheen)\n  float age = max(uStroke - u, 0.0);\n  float wet = exp(-age*3.5)*painted;\n  return vec2(sat(cov), wet + 10.0*floor(dens*100.0)/100.0);\n}\n\nvoid main(){\n  vec2 uv = (2.0*(gl_FragCoord.xy+uJitter)-uRes)/uRes.y;\n  vec2 p = uCenter + uv*uZoom;\n  // paper\n  float h = paperHeight(p);\n  vec2 e = vec2(0.002, 0.0);\n  vec2 g = vec2(paperHeight(p+e.xy)-h, paperHeight(p+e.yx)-h)/e.x;\n  vec3 n = normalize(vec3(-g*0.004, 1.0));\n  vec3 L = normalize(vec3(-0.6, 0.5, 0.65));\n  float diff = 0.75 + 0.35*dot(n, L);\n  vec3 paper = vec3(0.95,0.905,0.82)*(0.96+0.06*fbm(p*3.0,3))*diff;\n  paper += vec3(0.02,0.015,0.0)*fiberField(p);\n  vec2 ink = ensoInk(p);\n  float dens = floor(ink.y/10.0*100.0+0.5)/100.0; ink.y = ink.y - dens*10.0;\n  ink.x *= 1.0-uFadeInk;\n  // sumi: nearly black where loaded, a warm grey where the brush ran dry\n  vec3 sumi = mix(vec3(0.05,0.047,0.045), vec3(0.003,0.003,0.0045), smoothstep(0.72,0.95,dens));\n  vec3 gold = vec3(0.0);\n  vec3 col = mix(paper, sumi, ink.x*0.96);\n  if(uGoldInk>0.0){\n    // gold leaf over lacquer: metallic, catches the raking light\n    float spark = pow(sat(dot(reflect(-L, normalize(n+vec3(gnoise(p*80.0),gnoise(p*80.0+3.0),0.0)*0.3)), vec3(0,0,1))), 12.0);\n    gold = vec3(0.78,0.55,0.2)*(0.7+0.5*fbm(p*20.0,3)) + vec3(1.0,0.85,0.5)*spark*1.5;\n    col = mix(paper, gold, ink.x*uGoldInk);\n  }\n  // wet sheen: soft specular on fresh ink\n  vec3 V = vec3(0,0,1);\n  float spec = pow(sat(dot(reflect(-L, normalize(n*0.2+vec3(0,0,1))), V)), 40.0);\n  col += vec3(0.25)*spec*ink.y*ink.x*uWet;\n  col *= uPaperL;\n  fragColor = vec4(col, 3.0);\n}\n","studio":"#version 300 es\n// ---------------------------------------------------------------- common\nprecision highp float;\nprecision highp int;\n\nin vec2 vUv;\nuniform vec2  uRes;\nuniform float uTime;      // film time, seconds\nuniform float uLocal;     // scene-local time\nuniform vec3  uCamPos;\nuniform mat3  uCamRot;\nuniform float uFov;       // tan(fov/2)\nuniform vec2  uJitter;    // subpixel jitter in pixels\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n\nfloat sat(float x){ return clamp(x,0.,1.); }\nvec3  sat(vec3 x){ return clamp(x,0.,1.); }\nfloat sq(float x){ return x*x; }\nfloat lin(float a,float b,float x){ return sat((x-a)/(b-a)); }\nmat2  rot(float a){ float c=cos(a),s=sin(a); return mat2(c,s,-s,c); }\n\n// ---- hashing (integer based, stable across GPUs)\nuint hashu(uint x){ x ^= x>>16; x *= 0x7feb352du; x ^= x>>15; x *= 0x846ca68bu; x ^= x>>16; return x; }\nfloat hash11(float p){ return float(hashu(floatBitsToUint(p)))*(1.0/4294967296.0); }\nfloat hash12(vec2 p){ uvec2 q = uvec2(ivec2(floor(p))); return float(hashu(q.x ^ hashu(q.y + 0x9e3779b9u)))*(1.0/4294967296.0); }\nfloat hash13(vec3 p){ uvec3 q = uvec3(ivec3(floor(p))); return float(hashu(q.x ^ hashu(q.y ^ hashu(q.z + 0x632be5abu))))*(1.0/4294967296.0); }\nvec3  hash33(vec3 p){\n  uvec3 q = uvec3(ivec3(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y ^ hashu(q.z)));\n  return vec3(float(h), float(hashu(h)), float(hashu(h+1u)))*(1.0/4294967296.0);\n}\nvec2  hash22(vec2 p){\n  uvec2 q = uvec2(ivec2(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y));\n  return vec2(float(h), float(hashu(h)))*(1.0/4294967296.0);\n}\n// screen-space blue-ish noise for dithering / jittering ray starts\nfloat ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056,0.00583715)))); }\n\n// ---- value noise\nfloat vnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*(3.0-2.0*f);\n  float a=hash13(i), b=hash13(i+vec3(1,0,0)), c=hash13(i+vec3(0,1,0)), d=hash13(i+vec3(1,1,0));\n  float e=hash13(i+vec3(0,0,1)), f1=hash13(i+vec3(1,0,1)), g=hash13(i+vec3(0,1,1)), h=hash13(i+vec3(1,1,1));\n  return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y), mix(mix(e,f1,u.x),mix(g,h,u.x),u.y), u.z);\n}\nfloat vnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*(3.0-2.0*f);\n  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y);\n}\n// gradient noise (signed, -1..1)\nfloat gnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash33(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(mix(G(vec3(0,0,0)),G(vec3(1,0,0)),u.x), mix(G(vec3(0,1,0)),G(vec3(1,1,0)),u.x),u.y),\n                mix(mix(G(vec3(0,0,1)),G(vec3(1,0,1)),u.x), mix(G(vec3(0,1,1)),G(vec3(1,1,1)),u.x),u.y),u.z);\n  #undef G\n  return r*1.6;\n}\nfloat gnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash22(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(G(vec2(0,0)),G(vec2(1,0)),u.x), mix(G(vec2(0,1)),G(vec2(1,1)),u.x), u.y);\n  #undef G\n  return r*1.4;\n}\nfloat fbm(vec3 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=p*2.03+vec3(17.1,-3.7,9.2); a*=0.5; }\n  return s;\n}\nfloat fbm(vec2 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,7.7); a*=0.5; }\n  return s;\n}\n\n// Voronoi with true border distance (iq). Returns (border distance, cell id hash, F1)\nvec3 voronoiB(vec3 x){\n  vec3 p=floor(x), f=fract(x);\n  vec3 mb; vec3 mr; float md=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=mb+vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    vec3 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash13(p+mb+vec3(7.0)), sqrt(md));\n}\nvec3 voronoiB(vec2 x){\n  vec2 p=floor(x), f=fract(x);\n  vec2 mb; vec2 mr; float md=8.0;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec2 b=vec2(i,j); vec2 r=b+hash22(p+b)-f; float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){\n    vec2 b=mb+vec2(i,j); vec2 r=b+hash22(p+b)-f; vec2 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash12(p+mb+vec2(7.0)), sqrt(md));\n}\n\n// ---- SDF helpers\nfloat smin(float a,float b,float k){ float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*0.25; }\nfloat smax(float a,float b,float k){ return -smin(-a,-b,k); }\nfloat sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }\nfloat sdBox(vec2 p, vec2 b){ vec2 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,q.y),0.0); }\nfloat sdRBox(vec3 p, vec3 b, float r){ return sdBox(p,b-r)-r; }\nfloat sdCyl(vec3 p, float r, float h){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }\nfloat sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=sat(dot(pa,ba)/dot(ba,ba)); return length(pa-ba*h); }\n\n// ---- camera\nvec3 camRay(vec2 frag){\n  vec2 uv = (2.0*(frag+uJitter)-uRes)/uRes.y;\n  return normalize(uCamRot*vec3(uv*uFov, 1.0));\n}\n\n// ---- colour\nvec3 blackbody(float t){ // t in Kelvin, returns linear rgb (normalised-ish)\n  t = clamp(t, 800.0, 12000.0)/100.0;\n  vec3 c;\n  c.r = t<=66.0 ? 1.0 : 1.292936*pow(t-60.0,-0.1332047592);\n  c.g = t<=66.0 ? 0.3900815*log(t)-0.6318414 : 1.129890*pow(t-60.0,-0.0755148492);\n  c.b = t>=66.0 ? 1.0 : (t<=19.0 ? 0.0 : 0.5432068*log(t-10.0)-1.1962541);\n  return pow(sat(c), vec3(2.2));\n}\nfloat luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }\n\n// ---- BRDF\nfloat D_GGX(float nh, float a){ float a2=a*a; float d=nh*nh*(a2-1.0)+1.0; return a2/(PI*d*d); }\nfloat V_SmithJ(float nv, float nl, float a){ float a2=a*a;\n  float gv=nl*sqrt(nv*nv*(1.0-a2)+a2), gl=nv*sqrt(nl*nl*(1.0-a2)+a2); return 0.5/max(gv+gl,1e-5); }\nvec3  F_Schlick(vec3 f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\nfloat F_Schlick1(float f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\n// returns specular (already multiplied by nl)\nvec3 specGGX(vec3 n, vec3 v, vec3 l, float rough, vec3 f0){\n  vec3 h=normalize(v+l);\n  float nl=sat(dot(n,l)), nv=max(dot(n,v),1e-4), nh=sat(dot(n,h)), vh=sat(dot(v,h));\n  float a=max(rough*rough,0.002);\n  return D_GGX(nh,a)*V_SmithJ(nv,nl,a)*F_Schlick(f0,vh)*nl;\n}\n// analytic env-BRDF approximation (Karis)\nvec2 envBRDF(float nv, float rough){\n  vec4 c0=vec4(-1,-0.0275,-0.572,0.022), c1=vec4(1,0.0425,1.04,-0.04);\n  vec4 r=rough*c0+c1; float a004=min(r.x*r.x,exp2(-9.28*nv))*r.x+r.y;\n  return vec2(-1.04,1.04)*a004+r.zw;\n}\n\n// ---------------------------------------------------------------- bowl\n// Units: 1.0 = 10 cm. Bowl local space: foot rests on y=0, axis is +y.\n#define NPROF 16\nuniform vec4  uProf[NPROF];   // centerline (r, y), half thickness, unused\nuniform vec4  uFoot;          // foot ring stroke: r0,y0,r1,y1\nuniform float uFootTh;        // foot half thickness (0 = none)\nuniform float uWobble;        // rim wobble amplitude\nuniform float uOval;          // ovality\nuniform float uRidge;         // throwing ridge amplitude\nuniform float uSpin;          // wheel angle (radians), rotates surface detail\n\n// material state\nuniform float uWet;       // 1 = wet thrown clay\nuniform float uDry;       // 0..1 wet->leather->bone dry\nuniform float uGlazeRaw;  // raw glaze slip coverage (matte)\nuniform float uMelt;      // glaze melted (glossy)\nuniform float uHeat;      // incandescence 0..1\nuniform float uAsh;       // natural ash deposit\nuniform float uCrackle;   // crackle network visibility\nuniform float uStain;     // tea stain in crackle\nuniform float uGold;      // kintsugi seams\nuniform float uTeaLevel;  // tea fill 0..1 (0 = empty)\nuniform float uFroth;     // matcha froth amount\n\n// fracture / seam network\n#define NSEED 14\nuniform vec4 uSeeds[NSEED]; // xyz seed on bowl surface (local), w unused\n\nstruct BowlHit { float d; float side; float s; vec2 nDelta; };\n\nvec2 segPerp(int i){ vec2 b=normalize(uProf[i+1].xy-uProf[i].xy); return vec2(-b.y, b.x); }\n\n// distance-only version for marching\nfloat bowlProfileD(vec2 q){\n  float d = 1e5;\n  for(int i=0;i<NPROF-1;i++){\n    vec2 a=uProf[i].xy, ba=uProf[i+1].xy-a, pa=q-a;\n    float t=sat(dot(pa,ba)/dot(ba,ba));\n    d=min(d, length(pa-ba*t)-mix(uProf[i].z, uProf[i+1].z, t));\n  }\n  return d;\n}\n\n// full version: side (+1 inside the cavity, -1 outside), arc parameter, and the\n// correction that turns faceted polyline normals into smooth (Phong-like) ones\nBowlHit bowlProfile(vec2 q){\n  BowlHit h; h.d = 1e5; h.side = 0.0; h.s = 0.0; h.nDelta=vec2(0);\n  float acc = 0.0, total = 0.0;\n  for(int i=0;i<NPROF-1;i++) total += length(uProf[i+1].xy-uProf[i].xy);\n  int bi=0; float bt=0.0;\n  for(int i=0;i<NPROF-1;i++){\n    vec2 a=uProf[i].xy, b=uProf[i+1].xy;\n    vec2 pa=q-a, ba=b-a;\n    float L = length(ba);\n    float t=sat(dot(pa,ba)/(L*L));\n    float th=mix(uProf[i].z, uProf[i+1].z, t);\n    float d=length(pa-ba*t)-th;\n    if(d<h.d){ h.d=d; h.side = (pa.x*ba.y-pa.y*ba.x) < 0.0 ? 1.0 : -1.0; h.s=(acc+t*L)/total; bi=i; bt=t; }\n    acc += L;\n  }\n  if(bt>0.0 && bt<1.0){\n    vec2 pf = segPerp(bi);\n    vec2 n0 = bi>0 ? normalize(segPerp(bi-1)+pf) : pf;\n    vec2 n1 = bi<NPROF-2 ? normalize(segPerp(bi+1)+pf) : pf;\n    vec2 ns = normalize(mix(n0,n1,bt));\n    h.nDelta = (ns-pf)*h.side;\n  }\n  return h;\n}\n\nvec2 bowlQ(vec3 p){\n  float a = atan(p.z,p.x);\n  float r = length(p.xz);\n  r *= 1.0 + uOval*cos(2.0*a-1.4);\n  float rim = smoothstep(0.25,0.75,p.y);\n  float y = p.y - uWobble*rim*(0.55*sin(a*2.0+1.3)+0.3*sin(a*5.0+4.0)+0.15*sin(a*9.0+0.5));\n  return vec2(r, y);\n}\n\nfloat sdBowl(vec3 p){\n  vec2 q = bowlQ(p);\n  float d = bowlProfileD(q);\n  if(uFootTh>0.0){\n    float th = uFootTh;\n    float df = sdSeg(q, uFoot.xy, uFoot.zw) - th;\n    d = smin(d, df, 0.03);\n  }\n  // throwing ridges (spiral rings)\n  d -= uRidge*sin(q.y*70.0 + 0.6*sin(q.y*9.0))*smoothstep(0.02,0.1,q.y);\n  return d;\n}\n\n// full info at a surface point (called once per hit)\nBowlHit bowlInfo(vec3 p){\n  vec2 q = bowlQ(p);\n  BowlHit h = bowlProfile(q);\n  if(uFootTh>0.0){\n    float df = sdSeg(q, uFoot.xy, uFoot.zw) - uFootTh;\n    if(df < h.d + 0.012){ h.side = -2.0; h.nDelta = vec2(0); } // foot ring: unglazed\n  }\n  return h;\n}\n\n// Fracture warp: cheap analytic wobble so the same cells can be marched per shard.\n// (Mirrored exactly in bowl.js for CPU-side centroids.)\nvec3 fracWarp(vec3 p){\n  return p + 0.030*sin(p.zxy*9.1+vec3(1.3,4.1,2.7))\n           + 0.012*sin(p.yzx*23.7+vec3(0.4,2.2,5.1))\n           + 0.005*sin(p.zxy*61.0+vec3(2.9,0.7,4.4));\n}\n\n// Warped Voronoi on the fixed fracture seeds. Returns (border distance, cell index, second index)\nvec3 seamField(vec3 p){\n  vec3 w = fracWarp(p);\n  float d1=1e5, d2=1e5; int i1=0, i2=0;\n  for(int i=0;i<NSEED;i++){\n    vec3 r = w-uSeeds[i].xyz;\n    float d = dot(r,r);\n    if(d<d1){ d2=d1; i2=i1; d1=d; i1=i; } else if(d<d2){ d2=d; i2=i; }\n  }\n  vec3 s1=uSeeds[i1].xyz, s2=uSeeds[i2].xyz;\n  float bd = (d2-d1)/(2.0*length(s2-s1));\n  return vec3(bd, float(i1), float(i2));\n}\n\n// signed distance (in warped space) to the boundary of cell i: <0 inside\nfloat cellDist(vec3 p, int i){\n  vec3 w = fracWarp(p);\n  vec3 si = uSeeds[i].xyz;\n  float di = dot(w-si,w-si);\n  float d = -1e5;\n  for(int j=0;j<NSEED;j++){\n    if(j==i) continue;\n    vec3 sj = uSeeds[j].xyz;\n    float dj = dot(w-sj,w-sj);\n    d = max(d, (di-dj)/(2.0*length(sj-si)));\n  }\n  return d;\n}\n\n// glaze thickness 0..~2 on the surface\nfloat glazeThickness(vec3 p, BowlHit h){\n  float a = atan(p.z,p.x);\n  if(h.side < -1.5) return 0.0;              // foot\n  float s = h.s;\n  float t;\n  if(h.side > 0.0){\n    // interior: pools in the well\n    t = 0.75 + 1.1*smoothstep(0.42,0.05,s) ;\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);     // thins over the rim\n  } else {\n    // exterior: glaze line with drips\n    float line = 0.46 + 0.04*gnoise(vec2(a*2.0,1.7));\n    float drip = pow(sat(gnoise(vec2(a*7.0, 3.1))*0.5+0.5), 5.0)*0.28\n               + pow(sat(gnoise(vec2(a*19.0, 8.3))*0.5+0.5), 8.0)*0.18;\n    float edge = line - drip;\n    float cov = smoothstep(edge-0.004, edge+0.01, s);\n    // thick roll at the drip end, thinning toward the rim\n    t = cov*(0.7 + 1.1*exp(-max(s-edge,0.0)*28.0));\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);\n  }\n  // natural ash: heavier on one flank (facing the fire)\n  float ashSide = sat(0.5+0.5*cos(a-2.4))*smoothstep(0.35,0.85,s);\n  t += uAsh*ashSide*(0.6+0.8*sat(gnoise(p*14.0)+0.3));\n  return t;\n}\n\n// ---------------------------------------------------------------- bowl material\nstruct Surf {\n  vec3 alb;      // diffuse albedo (base, under coat)\n  vec3 f0;       // base specular reflectance (metals)\n  float rough;   // base roughness\n  float coat;    // clear coat (glaze / water film) strength 0..1\n  float coatRough;\n  vec3 n;        // base normal\n  vec3 cn;       // coat normal\n  vec3 emit;\n  float sss;     // wrap / translucency amount\n};\n\nSurf defaultSurf(vec3 n){\n  Surf s; s.alb=vec3(0.5); s.f0=vec3(0.04); s.rough=0.8; s.coat=0.0; s.coatRough=0.1;\n  s.n=n; s.cn=n; s.emit=vec3(0); s.sss=0.0; return s;\n}\n\nvec3 rotYv(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x-s*p.z, p.y, s*p.x+c*p.z); }\n\n// perturb normal with a scalar height function's numerical gradient projected on the surface\n#define BUMP(n, P, F, EPS, AMT) { \\\n  vec3 _e=vec3(EPS,0,0); float _h0=F(P); \\\n  vec3 _g=vec3(F(P+_e.xyy)-_h0, F(P+_e.yxy)-_h0, F(P+_e.yyx)-_h0)/EPS; \\\n  _g-=n*dot(_g,n); n=normalize(n-AMT*_g); }\n\nfloat clayGrain(vec3 p){ return gnoise(p*140.0)*0.5+gnoise(p*330.0)*0.25; }\nfloat glazeRipple(vec3 p){ return gnoise(p*22.0)+0.35*gnoise(p*61.0); }\n\nSurf bowlSurface(vec3 p, vec3 n, vec3 v){\n  Surf s = defaultSurf(n);\n  BowlHit h = bowlInfo(p);\n  { vec2 dr = normalize(p.xz+1e-6); n = normalize(n + vec3(dr.x*h.nDelta.x, h.nDelta.y, dr.y*h.nDelta.x)); s.n=n; s.cn=n; }\n  vec3 pr = rotYv(p, uSpin);            // detail rotating with the wheel\n  float a = atan(pr.z, pr.x);\n\n  // ---------- clay body\n  float speck = smoothstep(0.86, 0.95, vnoise(pr*80.0)) * 0.7;\n  float grain = clayGrain(pr);\n  vec3 fired = vec3(0.50,0.44,0.37)*(0.92+0.1*grain);\n  fired = mix(fired, vec3(0.18,0.09,0.05), speck);\n  // flashing on the unglazed foot / exposed body\n  float flash = sat(0.5+0.8*gnoise(pr*4.0+3.0));\n  vec3 footCol = mix(fired, vec3(0.58,0.30,0.14), 0.55*flash);\n\n  // unfired clay (wet -> dry)\n  vec3 wetCol = vec3(0.19,0.10,0.065);\n  vec3 dryCol = vec3(0.60,0.53,0.46)*(0.95+0.08*grain);\n  vec3 raw = mix(wetCol, dryCol, smoothstep(0.0,1.0,uDry));\n  float slurry = sat(0.5+0.9*gnoise(vec3(a*6.0, pr.y*38.0, 0.0)));\n\n  float firedAmt = max(uMelt, uHeat);\n  // iron shows through where the glaze thins over the rim: a warm brown lip, not raw grain\n  fired = mix(fired, vec3(0.30,0.19,0.12)*(0.95+0.05*grain), smoothstep(0.9, 0.995, h.s)*0.85);\n  vec3 body = mix(raw, h.side<-1.5 ? footCol : fired, sat(firedAmt*1.5));\n  s.alb = body;\n  s.rough = 0.85;\n  BUMP(s.n, pr, clayGrain, 0.002, 0.00025*(1.0-0.8*uMelt));\n\n  // ---------- wet film\n  if(uWet>0.0){\n    float film = uWet*(0.55+0.45*slurry);\n    s.coat = film;\n    s.coatRough = mix(0.32, 0.12, slurry);\n    s.alb = mix(s.alb, s.alb*0.7, film);\n    s.cn = n;\n    // throwing lines in the film\n    vec3 nn = n;\n    float lines = sin(p.y*140.0+2.0*gnoise(vec3(a*3.0,p.y*10.0,0.0)));\n    nn = normalize(nn + 0.08*uWet*lines*vec3(0,1,0));\n    s.cn = nn;\n  }\n\n  // ---------- glaze\n  float t = glazeThickness(p, h);\n  float rawCov = smoothstep(1.02-uGlazeRaw*1.1, 1.04-uGlazeRaw*1.1, h.s)*step(0.001,uGlazeRaw);\n  float cov = sat(t*4.0)*max(rawCov, uMelt);\n  if(cov>0.0){\n    // raw slip (unfired glaze powder)\n    vec3 slip = vec3(0.70,0.72,0.70)*(0.95+0.08*grain);\n    float rawAmt = rawCov*(1.0-uMelt);\n    // melted celadon: Beer-Lambert over the body + milky scatter\n    vec3 sigma = vec3(0.62,0.26,0.33);\n    float tt = t*(1.0+0.15*gnoise(p*7.0));\n    vec3 trans = exp(-sigma*tt*1.6);\n    vec3 milk = vec3(0.55,0.72,0.66);\n    float scat = 1.0-exp(-tt*0.9);\n    vec3 glazeCol = mix(body*trans*1.15, milk*mix(vec3(1.0),trans,0.5), scat*0.72);\n    // ash: greener glassy runs\n    glazeCol = mix(glazeCol, vec3(0.30,0.42,0.22)*trans*1.4, sat(uAsh*(t-0.9)*0.9));\n    // iron specks bleed through\n    glazeCol = mix(glazeCol, vec3(0.22,0.13,0.07), speck*0.5*exp(-tt*1.2));\n\n    // crackle network (two scales, only in glaze)\n    float crk = 0.0;\n    if(uCrackle>0.0){\n      vec3 wp = p + 0.02*vec3(gnoise(p*13.0), gnoise(p*13.0+7.0), gnoise(p*13.0+3.0));\n      vec3 c1 = voronoiB(wp*vec3(5.5,7.0,5.5)+vec3(3.0));\n      vec3 c2 = voronoiB(wp*15.0+vec3(1.3));\n      float l1 = 1.0-smoothstep(0.004, 0.016, c1.x);\n      float l2 = (1.0-smoothstep(0.004, 0.02, c2.x))*0.45;\n      float reveal = smoothstep(c1.y*0.8, c1.y*0.8+0.2, uCrackle);\n      crk = max(l1*reveal, l2*smoothstep(0.4,1.0,uCrackle)*step(0.55,c2.y));\n      crk *= 0.55+0.45*sat(gnoise(p*5.0)+0.5);\n      vec3 crackCol = mix(glazeCol*1.4+0.06, vec3(0.28,0.16,0.07), uStain*(h.side>0.0?1.0:0.6));\n      glazeCol = mix(glazeCol, crackCol, crk*0.8);\n    }\n\n    vec3 glazed = glazeCol;\n    s.alb = mix(s.alb, mix(glazed, slip, rawAmt), cov);\n    s.rough = mix(s.rough, 0.9, cov*rawAmt);\n    // melted glaze is a clear coat\n    float coat = cov*uMelt;\n    s.coat = max(s.coat, coat);\n    s.coatRough = mix(s.coatRough, 0.045, coat);\n    vec3 cn = n;\n    BUMP(cn, p, glazeRipple, 0.004, 0.0004*uMelt);\n    s.cn = normalize(mix(s.cn, cn, coat));\n    s.sss = 0.35*coat*scat;\n  }\n\n  // ---------- tea stain on the unglazed foot over years\n  s.alb *= 1.0 - 0.15*uStain*step(h.side,-1.5);\n\n  // ---------- incandescence\n  if(uHeat>0.0){\n    float T = mix(800.0, 1330.0, uHeat);\n    s.emit = blackbody(T)*pow(uHeat,2.2)*2.5*(0.85+0.15*grain);\n  }\n\n  // ---------- kintsugi gold\n  if(uGold>0.0){\n    vec3 sf = seamField(p);\n    float w = 0.0075*(0.75+0.5*sat(gnoise(p*6.0)*0.5+0.5));\n    float g = 1.0-smoothstep(w*0.75, w, sf.x);\n    g *= uGold;\n    if(g>0.0){\n      vec3 e = normalize(uSeeds[int(sf.z)].xyz-uSeeds[int(sf.y)].xyz);\n      float x = sat(sf.x/w);\n      float slope = -0.9*x/sqrt(max(1.0-x*x,0.02));\n      vec3 et = normalize(e - n*dot(e,n));\n      vec3 gn = normalize(n + slope*et*0.6);\n      float burnish = sat(0.5+0.8*gnoise(p*40.0));\n      s.alb = mix(s.alb, vec3(0.0), g);\n      s.f0 = mix(s.f0, vec3(1.0,0.74,0.32), g);\n      s.rough = mix(s.rough, mix(0.34,0.14,burnish), g);\n      s.coat = mix(s.coat, 0.0, g);\n      s.n = normalize(mix(s.n, gn, g));\n      s.cn = s.n;\n    }\n  }\n  return s;\n}\n\n// ---------------------------------------------------------------- scene: CLAY (studio)\n// A dark pottery studio. One window shaft. The clay rises on a spinning wheel.\nuniform vec3  uSun;        // direction toward the window light\nuniform vec3  uSunCol;\nuniform float uWheelSpin;  // wheel head angle\nuniform float uWater;      // wetness of the wheel head\nuniform float uDust;\nuniform float uWarm;       // warm practical light (evening / drying)\nout vec4 fragColor;\n\n#define WIN_X -9.0\n// window opening on the plane x = WIN_X (y in [2,9], z in [-3,2])\nfloat windowLit(vec3 p, vec3 L){\n  if(L.x >= -0.01) return 0.0;\n  float t = (WIN_X - p.x)/L.x;\n  vec3 w = p + L*t;\n  float pen = 0.04 + 0.01*t;\n  float a = smoothstep(2.0-pen, 2.0+pen, w.y)*smoothstep(9.0+pen, 9.0-pen, w.y)*smoothstep(-3.0-pen,-3.0+pen,w.z)*smoothstep(2.0+pen,2.0-pen,w.z);\n  // mullions\n  float m = smoothstep(0.06, 0.12, abs(w.z+0.5))*smoothstep(0.06,0.12,abs(w.y-5.5));\n  return a*mix(1.0, m, 0.9);\n}\n\n// ids: 1 clay, 2 wheel head, 3 splash pan, 4 room, 5 shelf pots\nvec2 studioMap(vec3 p){\n  vec2 r = vec2(1e5, 0.0);\n  float bb = length(p-vec3(0,0.4,0))-0.95;\n  float c = bb > 0.3 ? bb : sdBowl(p);\n  r = vec2(c, 1.0);\n  // wheel head: disc radius 1.6, top at y = 0\n  float wh = sdCyl(p-vec3(0,-0.12,0), 1.6, 0.12) - 0.02;\n  if(wh<r.x) r = vec2(wh, 2.0);\n  // splash pan: bowl-shaped ring around the wheel\n  vec2 q = vec2(length(p.xz), p.y);\n  float pan = max(abs(q.x-2.5)-0.06, abs(q.y+0.35)-0.55);\n  pan = min(pan, max(q.x-2.5, abs(q.y+0.9)-0.05));\n  if(pan<r.x) r = vec2(pan, 3.0);\n  // floor, back wall, window wall\n  float room = min(p.y+3.2, min(12.0-p.z, p.x-WIN_X+0.3));\n  if(room<r.x) r = vec2(room, 4.0);\n  // shelf with pots in the background\n  vec3 s = p-vec3(1.0, 2.2, 9.0);\n  float shelf = sdBox(s-vec3(0,-0.1,0), vec3(8.0,0.08,0.8));\n  float pots = 1e5;\n  for(int i=0;i<6;i++){\n    float fi = float(i);\n    vec3 o = s-vec3(-6.0+fi*2.4, 0.0, 0.1*sin(fi*3.0));\n    float h = 0.6+0.5*fract(fi*0.618);\n    float w = 0.45+0.25*fract(fi*0.37);\n    vec2 pq = vec2(length(o.xz), o.y);\n    float body = length(pq/vec2(w, h)-vec2(0.0, 0.9))*min(w,h) - min(w,h)*0.95;\n    body = max(body, -o.y);\n    pots = min(pots, body);\n  }\n  shelf = min(shelf, pots);\n  if(shelf<r.x) r = vec2(shelf, 5.0);\n  return r;\n}\n\nvec3 studioNormal(vec3 p){\n  const vec2 e = vec2(0.0007,-0.0007);\n  return normalize(e.xyy*studioMap(p+e.xyy).x + e.yyx*studioMap(p+e.yyx).x + e.yxy*studioMap(p+e.yxy).x + e.xxx*studioMap(p+e.xxx).x);\n}\n\nfloat studioShadow(vec3 ro, vec3 rd){\n  float res = 1.0, t = 0.01;\n  for(int i=0;i<40;i++){\n    vec3 p = ro+rd*t;\n    float h = min(studioMap(p).x, 1e5);\n    res = min(res, 10.0*h/t);\n    t += clamp(h, 0.01, 0.3);\n    if(res<0.003 || t>8.0) break;\n  }\n  return sat(res);\n}\n\nvec3 studioEn
