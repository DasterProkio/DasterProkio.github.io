e gap is 30cm away)\n  float x0 = -1.2, x1 = x0 + m.open*4.0;\n  float pen = 0.05 + 0.012*t;\n  float open = smoothstep(x0-pen, x0+pen, w.x)*smoothstep(x1+pen, x1-pen, w.x)*smoothstep(-1.0,-0.6,w.y);\n  return vec2(open, 1.0-open);\n}\n\n// garden through the gap: an out-of-focus impression (DOF will blur it more)\nvec3 garden(vec3 ro, vec3 rd, Mem m){\n  vec3 sky = skyColor(m, rd.y);\n  float t = (WALLZ+40.0-ro.z)/max(rd.z,1e-3);\n  vec2 g = (ro+rd*t).xy*0.05;\n  float s = m.season;\n  vec3 spring = vec3(1.0,0.66,0.74), summer = vec3(0.16,0.32,0.10), autumn = vec3(0.9,0.26,0.06), winter = vec3(0.35,0.32,0.3);\n  vec3 leaf = s<1.0 ? mix(spring,summer,smoothstep(0.3,1.0,s)) : s<2.0 ? mix(summer,autumn,smoothstep(1.3,2.0,s)) : mix(autumn,winter,smoothstep(2.1,2.6,s));\n  float bare = smoothstep(2.2,2.7,s);\n  vec3 sunc = sunColor(m);\n  vec3 lit = sunc*0.1 + skyColor(m,1.0)*0.45;\n  // foliage mass: soft, low frequency\n  float mass = fbm(g*vec2(1.2,1.6)+vec2(1.7,0.3), 4)*0.9 + 0.25 - 0.35*g.y;\n  float leafy = smoothstep(-0.05,0.25,mass)*(1.0-0.85*bare);\n  vec3 col = mix(sky, leaf*lit*(0.55+0.6*sat(fbm(g*5.0,3)+0.5)), leafy);\n  // sun sparkles through the canopy (become bokeh discs)\n  vec3 v = voronoiB(g*14.0);\n  float spark = smoothstep(0.25,0.05,v.z)*step(0.82,v.y)*leafy*sunUp(m);\n  col += sunc*0.25*spark*mix(vec3(1.0), leaf+0.3, 0.5);\n  // winter: snow on the ground and bare dark branches\n  float branches = (1.0-smoothstep(0.0,0.06,abs(fbm(g*vec2(2.0,1.0)+3.0,4))))*smoothstep(0.8,0.0,g.y)*bare;\n  col = mix(col, vec3(0.02)*lit, branches*0.8);\n  float ground = smoothstep(-0.28,-0.4,g.y+0.05*fbm(g*6.0,2));\n  vec3 gcol = mix(vec3(0.06,0.09,0.04), vec3(0.85,0.88,0.93), smoothstep(2.6,2.9,s));\n  col = mix(col, gcol*(lit+0.02), ground);\n  return col;\n}\n\n// -------- geometry\n// ids: 1 bowl, 2 tenmoku, 3 table, 4 wall, 5 floor, 6 tea surface, 7 candle\nvec3 bowlLocal(vec3 p, Mem m){\n  vec3 q = p - m.bowlOff;\n  q.xy = rot(m.bowlTilt)*q.xy;\n  return q;\n}\nvec3 tenLocal(vec3 p, Mem m){ return p - vec3(-m.gap*0.95, 0.0, m.gap*0.3); }\nvec3 candlePos(){ return vec3(2.6, 0.0, 1.6); }\n\nvec2 roomMap(vec3 p, Mem m){\n  vec2 r = vec2(1e5, 0.0);\n  // table top slab (only its top face and edges matter)\n  float tb = sdRBox(p-vec3(0.0,-0.25,0.0), vec3(TABLE_HX,0.25,TABLE_HZ), 0.04);\n  r = vec2(tb, 3.0);\n  if(m.bowlOn>0.5){\n    vec3 q = bowlLocal(p,m);\n    float bb = length(q-vec3(0,0.35,0))-0.75;\n    float b = bb>0.4 ? bb : sdBowl(q);\n    if(b<r.x) r=vec2(b,1.0);\n  }\n  if(m.two>0.01){\n    vec3 q = tenLocal(p,m);\n    q.y += (1.0-m.two)*8.0;    // absent bowls are far below the table\n    float bb = length(q-vec3(0,0.3,0))-0.7;\n    float b = bb>0.4 ? bb : sdTenmoku(q);\n    if(b<r.x) r=vec2(b,2.0);\n  }\n  // candle (short, in a clay dish)\n  if(m.candle>0.01){\n    vec3 q = p-candlePos();\n    float c = sdCyl(q-vec3(0,0.4,0), 0.22, 0.4);\n    c = min(c, sdCyl(q-vec3(0,0.04,0), 0.42, 0.04));\n    if(c<r.x) r=vec2(c,7.0);\n  }\n  // wall and floor\n  float w = WALLZ + 0.02 - p.z;\n  if(w<r.x) r=vec2(w,4.0);\n  float back = min(p.z + 16.0, min(14.0 - p.x, p.x + 14.0));\n  if(back<r.x) r=vec2(back, 8.0);\n  float f = p.y-FLOORY;\n  if(f<r.x) r=vec2(f,5.0);\n  return r;\n}\n\nvec3 roomNormal(vec3 p, Mem m){\n  const vec2 e=vec2(0.0008,-0.0008);\n  return normalize(e.xyy*roomMap(p+e.xyy,m).x+e.yyx*roomMap(p+e.yyx,m).x+e.yxy*roomMap(p+e.yxy,m).x+e.xxx*roomMap(p+e.xxx,m).x);\n}\n\nfloat roomShadow(vec3 ro, vec3 rd, Mem m, float k){\n  float res=1.0, t=0.01;\n  for(int i=0;i<40;i++){\n    vec3 p = ro+rd*t;\n    if(p.y>1.5 || p.z>WALLZ-0.1) break;\n    float h=roomMap(p,m).x;\n    res=min(res, k*h/t);\n    t+=clamp(h,0.01,0.25);\n    if(res<0.002) break;\n  }\n  return sat(res);\n}\n\n// radiance of the shoji wall itself (glowing paper; the gap shows the garden)\nvec3 wallRadianceR(vec3 p, vec3 rd, Mem m, float rough){\n  vec2 w = p.xy;\n  vec3 L = sunDir(m);\n  vec3 sunc = sunColor(m);\n  float paper = mix(shojiPaper(w), 0.8, sat(rough*6.0));\n  vec3 glow = (skyColor(m,0.7)*1.1 + sunc*0.10*sat(L.z))*vec3(1.0,0.95,0.86);\n  // the sun's disc seen through paper: broad warm hot-spot\n  vec2 sp = vec2(p.x - L.x/L.z*6.0, p.y - 2.0 + L.y*4.0);\n  glow *= 1.0 + 1.1*sunUp(m)*exp(-dot(sp,sp)*0.02);\n  glow *= 0.9+0.1*fbm(w*2.5,3);\n  vec3 wood = vec3(0.045,0.03,0.02)*(skyColor(m,0.5)*0.5 + 0.02);\n  vec3 col = mix(wood, glow, paper);\n  float open = openPanel(w, m);\n  if(open>0.5) col = garden(p, rd, m);\n  // plaster below the shoji, lintel above\n  if(w.y<-1.0 || w.y>14.0) col = vec3(0.30,0.26,0.21)*(skyColor(m,0.2)*0.15+0.004);\n  return col;\n}\nvec3 wallRadiance(vec3 p, vec3 rd, Mem m){ return wallRadianceR(p, rd, m, 0.0); }\n\n// irradiance estimate inside the room: the shoji is a big soft area light\nvec3 roomAmbient(vec3 p, vec3 n, Mem m){\n  vec3 sky = skyColor(m, 0.7);\n  float toWall = sat(n.z*0.6+0.4);\n  float near = 1.0/(1.0+0.02*sq(WALLZ-p.z));\n  vec3 a = sky*(0.03 + 0.55*toWall*toWall*near)*(0.7+0.3*sat(n.y));\n  // warm bounce from the room behind the camera (sunlit tatami, plaster)\n  a += (sky*0.06 + sunColor(m)*0.012)*vec3(1.0,0.85,0.7)*sat(-n.z*0.7+0.3);\n  a += sunColor(m)*0.015*sat(-n.y*0.5+0.5)*0.5;  // bounce from sunlit floor\n  return a;\n}\n\nvec3 candleLight(vec3 p, vec3 n, Mem m, out vec3 L){\n  vec3 fl = candlePos()+vec3(0.0,1.05,0.0);\n  vec3 d = fl-p; float r2 = dot(d,d); L = d*inversesqrt(r2);\n  float flick = 0.85+0.15*sin(uTime*23.0)*sin(uTime*7.3+1.0);\n  return vec3(1.0,0.55,0.22)*m.candle*flick*3.0/(r2+0.5);\n}\n\nvec3 woodTable(vec3 p){\n  vec2 u = p.xz;\n  float warp = fbm(u*vec2(0.18,0.9),3);\n  float ring = fract((u.y+warp*1.8)*1.6 + 0.3*fbm(u*vec2(0.06,0.5),2));\n  float grain = smoothstep(0.0,0.3,ring)*smoothstep(1.0,0.55,ring);\n  vec3 c = mix(vec3(0.075,0.042,0.024), vec3(0.15,0.085,0.045), grain);\n  c *= 0.8+0.3*sat(fbm(u*vec2(0.5,14.0),3)+0.5);\n  return c;\n}\n\n// inner radius of the celadon bowl at height y (for the tea surface)\nfloat teaRadius(float y){\n  for(int i=0;i<NPROF-1;i++){\n    vec4 a=uProf[i], b=uProf[i+1];\n    if(y>=a.y && y<b.y){ float t=(y-a.y)/max(b.y-a.y,1e-4); return mix(a.x,b.x,t)-mix(a.z,b.z,t)*1.1; }\n  }\n  return 0.0;\n}\nfloat teaHeight(float lvl){ return mix(0.16, 0.56, lvl); }\n\n// cheap reflection lookup: shoji wall / table / dark room, no occlusion\nvec3 roomReflect(vec3 p, vec3 r, float rough, Mem m){\n  vec3 c = vec3(0.0);\n  if(r.z>0.05){\n    float t=(WALLZ-p.z)/r.z; vec3 w=p+r*t;\n    if(w.y>FLOORY && w.y<16.0) c = wallRadianceR(w, r, m, rough);\n    else c = skyColor(m,0.3)*0.05;\n  } else if(r.y<-0.05){\n    float t=-p.y/r.y; vec3 w=p+r*t;\n    vec2 tr = wallTransmit(w, sunDir(m), m);\n    c = woodTable(w)*(sunColor(m)*tr.x*sat(sunDir(m).y) + roomAmbient(w, vec3(0,1,0), m));\n  } else {\n    c = roomAmbient(p, -r, m)*0.25;\n  }\n  // blur toward average as roughness grows\n  return mix(c, roomAmbient(p, r, m)*0.8, sat(rough*3.5));\n}\n\nvec3 roomLightSurf(Surf s, vec3 p, vec3 v, Mem m, float ao){\n  vec3 L = sunDir(m);\n  vec3 sc = sunColor(m);\n  vec2 tr = wallTransmit(p, L, m);\n  float sh = 1.0;\n  if(tr.x>0.0 && sunUp(m)>0.0) sh = roomShadow(p+s.n*0.004, L, m, 12.0);\n  vec3 direct = sc*tr.x*sh;\n  float nl = sat(dot(s.n,L));\n  float nv = sat(dot(s.cn,v));\n  float Fc = s.coat*F_Schlick1(0.04, nv);\n  vec3 amb = roomAmbient(p, s.n, m)*ao;\n  vec3 Lc; vec3 cl = candleLight(p, s.n, m, Lc);\n  vec3 dif = s.alb*(1.0-Fc)*(direct*nl + amb + cl*sat(dot(s.n,Lc)) + s.sss*direct*sat(dot(-s.n,L)*0.5+0.4)*0.4);\n  vec3 spec = specGGX(s.n, v, L, s.rough, s.f0)*direct + specGGX(s.n, v, Lc, s.rough, s.f0)*cl;\n  vec2 eb = envBRDF(sat(dot(s.n,v)), s.rough);\n  spec += roomReflect(p, reflect(-v,s.n), s.rough, m)*(s.f0*eb.x+eb.y)*ao;\n  vec3 coat = vec3(0);\n  if(s.coat>0.0){\n    coat = s.coat*(specGGX(s.cn, v, L, s.coatRough, vec3(0.04))*direct\n                  + specGGX(s.cn, v, Lc, s.coatRough, vec3(0.04))*cl\n                  + roomReflect(p, reflect(-v,s.cn), s.coatRough, m)*F_Schlick1(0.04,nv)*ao);\n  }\n  return dif + spec + coat + s.emit;\n}\n\nfloat roomAO(vec3 p, vec3 n, Mem m){\n  float o=0.0, sc=1.0;\n  for(int i=1;i<=4;i++){ float h=0.03*float(i*i); o+=(h-roomMap(p+n*h,m).x)*sc; sc*=0.65; }\n  return sat(1.0-1.6*o);\n}\n\nSurf tenmokuSurface(vec3 q, vec3 n){\n  Surf s = defaultSurf(n);\n  float y = q.y;\n  // iron glaze: black-brown with rust breaking at the rim, \"hare's fur\" streaks\n  float a = atan(q.z,q.x);\n  float fur = sat(0.5+0.7*gnoise(vec3(a*90.0+3.0*gnoise(q*6.0), y*2.0, 0.0)))*0.8;\n  vec3 black = vec3(0.018,0.012,0.009);\n  vec3 rust = vec3(0.30,0.12,0.04);\n  vec3 c = mix(black, rust, sat(fur*smoothstep(0.3,0.62,y)*0.55 + 0.8*smoothstep(0.56,0.63,y)));\n  float foot = step(y,0.1)*step(length(q.xz),0.24);\n  c = mix(c, vec3(0.42,0.3,0.2), foot + smoothstep(0.14,0.1,y));\n  s.alb = c; s.rough=0.7;\n  s.coat = 1.0-foot; s.coatRough = 0.035;\n  return s;\n}\n\n// shade tea surface (matcha)\nvec3 teaShade(vec3 p, vec3 v, Mem m, float froth){\n  vec3 n = vec3(0,1,0);\n  vec2 u = p.xz;\n  float bub = voronoiB(vec3(u*55.0, 1.0)).z;\n  float foam = sat(froth*(0.6+0.6*fbm(u*9.0,3)));\n  vec3 base = mix(vec3(0.10,0.17,0.02), vec3(0.42,0.58,0.16), foam);\n  base *= 0.9+0.2*smoothstep(0.2,0.6,bub);\n  Surf s = defaultSurf(n);\n  s.alb = base; s.rough=0.5; s.coat = 1.0-foam*0.8; s.coatRough = 0.06;\n  s.n = normalize(n + vec3(gnoise(vec3(u*30.0,0.0)),0.0,gnoise(vec3(u*30.0,3.0)))*0.03*foam);\n  s.cn = n;\n  return roomLightSurf(s, p, v, m, 1.0);\n}\n\n// steam: a few noisy wisps rising from a point, integrated front to back\nvec4 steamVolume(vec3 ro, vec3 rd, float tmax, vec3 base, float amt, Mem m){\n  if(amt<0.01) return vec4(0);\n  // bounding cylinder r=0.55 around base, y in [base.y, base.y+4]\n  vec3 oc = ro-base;\n  float a=dot(rd.xz,rd.xz), b=dot(oc.xz,rd.xz), c=dot(oc.xz,oc.xz)-0.55*0.55;\n  float h=b*b-a*c; if(h<0.0) return vec4(0);\n  h=sqrt(h); float t0=max((-b-h)/a,0.0), t1=min((-b+h)/a,tmax);\n  if(t1<=t0) return vec4(0);\n  vec4 acc=vec4(0);\n  float dt=(t1-t0)/14.0;\n  float t=t0+dt*ign(gl_FragCoord.xy);\n  vec3 sc = sunColor(m)*0.18+roomAmbient(base, vec3(0,1,0), m)*2.2 + vec3(0.02);\n  for(int i=0;i<14;i++){\n    vec3 p=ro+rd*t-base;\n    float y=p.y;\n    if(y>0.0 && y<4.0){\n      vec3 q=p; q.xz += vec2(sin(y*1.3+uTime*0.7), cos(y*1.1+uTime*0.5))*0.12*y;\n      float r=length(q.xz);\n      float n=fbm(vec3(q.x*3.5, y*1.4-uTime*1.1, q.z*3.5),3);\n      // thin rising filaments rather than a cloud\n      float fil = 1.0-abs(2.0*vnoise(vec3(q.x*6.0, y*2.2-uTime*1.5, q.z*6.0))-1.0);\n      float d=sat(n*1.5+0.05-r*2.6)*fil*fil*smoothstep(0.0,0.35,y)*smoothstep(3.2,0.8,y)*amt;\n      float al=1.0-exp(-d*dt*3.0);\n      acc.rgb += (1.0-acc.a)*al*sc*0.6;\n      acc.a += (1.0-acc.a)*al;\n    }\n    t+=dt;\n  }\n  return acc;\n}\n\n// ---- full trace of the room. Returns colour and hit distance.\nvec4 roomTrace(vec3 ro, vec3 rd, Mem m, int steps){\n  float t=0.0; vec2 h=vec2(0.0);\n  bool hit=false;\n  for(int i=0;i<200;i++){\n    if(i>=steps) break;\n    h = roomMap(ro+rd*t, m);\n    if(h.x<0.0003*t+0.0005){ hit=true; break; }\n    t += h.x*0.9;\n    if(t>120.0) break;\n  }\n  // tea surface is analytic (flat disk inside the bowl)\n  float tTea = 1e5;\n  if(m.tea>0.01 && m.bowlOn>0.5){\n    float yT = teaHeight(m.tea);\n    vec3 lo = bowlLocal(ro,m), ld = rd; ld.xy = rot(m.bowlTilt)*ld.xy;\n    float tt = (yT-lo.y)/ld.y;\n    if(tt>0.0){ vec3 q=lo+ld*tt; if(length(q.xz)<teaRadius(yT)) tTea=tt; }\n  }\n  vec3 col = vec3(0);\n  if(hit || tTea<1e4){\n    if(tTea < t || !hit){\n      t = tTea;\n      col = teaShade(ro+rd*t, -rd, m, 0.8);\n    } else {\n      vec3 p = ro+rd*t;\n      vec3 n = roomNormal(p, m);\n      vec3 v = -rd;\n      float ao = roomAO(p, n, m);\n      if(h.y==1.0){\n        vec3 q = bowlLocal(p,m);\n        vec3 nq = n; nq.xy = rot(m.bowlTilt)*nq.xy;\n        Surf s = bowlSurface(q, nq, v);\n        s.n.xy = rot(-m.bowlTilt)*s.n.xy; s.cn.xy = rot(-m.bowlTilt)*s.cn.xy;\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==2.0){\n        Surf s = tenmokuSurface(tenLocal(p,m), n);\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==3.0){\n        Surf s = defaultSurf(n);\n        s.alb = woodTable(p);\n        // ring stain where the second bowl stood\n        vec3 tq = tenLocal(p, m);\n        float rr = length(tq.xz);\n        s.alb *= 1.0 - 0.35*m.ring*smoothstep(0.03,0.0,abs(rr-0.2))*step(p.y,0.01);\n        s.rough = 0.55; s.coat = 0.35; s.coatRough = 0.16;\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==4.0){\n        col = wallRadiance(p, rd, m);\n      } else if(h.y==5.0){\n        Surf s = defaultSurf(n);\n        // dark polished floorboards\n        float plank = floor(p.x/1.4);\n        float gz = p.z + hash11(plank)*30.0;\n        float grain = fbm(vec2(p.x*3.0, gz*0.35)+plank*7.0, 4);\n        s.alb = vec3(0.10,0.06,0.035)*(0.75+0.5*sat(grain+0.5))*(0.85+0.3*hash11(plank+3.0));\n        float seam = smoothstep(0.02,0.0,abs(fract(p.x/1.4)-0.5)-0.49);\n        s.alb *= 1.0-0.6*seam;\n        s.rough=0.5; s.coat=0.6; s.coatRough=0.12;\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==8.0){\n        Surf s = defaultSurf(n);\n        s.alb = vec3(0.28,0.24,0.2)*(0.8+0.2*fbm(p.xy*0.5,3)); s.rough = 0.9;\n        col = roomLightSurf(s, p, v, m, ao);\n      } else if(h.y==7.0){\n        Surf s = defaultSurf(n);\n        vec3 q = p-candlePos();\n        s.alb = q.y>0.1 ? vec3(0.8,0.75,0.65) : vec3(0.3,0.18,0.1);\n        s.sss = 1.0; s.rough=0.6;\n        col = roomLightSurf(s, p, v, m, ao);\n        // wax glows near the top\n        col += vec3(1.0,0.5,0.2)*m.candle*smoothstep(0.5,0.8,q.y)*0.6;\n      }\n    }\n  } else {\n    col = roomAmbient(ro, -rd, m)*0.2;\n    t = 120.0;\n  }\n  // candle flame (additive glow along the ray)\n  if(m.candle>0.01){\n    vec3 fl = candlePos()+vec3(0.0,1.05,0.0);\n    vec3 oc = fl-ro; float tc = max(dot(oc,rd),0.0);\n    if(tc<t+0.2){\n      vec3 d = ro+rd*tc-fl; d.y *= 0.45;\n      float fd = length(d);\n      col += vec3(1.0,0.62,0.25)*m.candle*(0.02/(fd*fd+0.004) + 0.15*exp(-fd*4.0));\n    }\n  }\n  return vec4(col, t);\n}\n\n// sunbeams through the open panel, with drifting dust\nvec3 roomBeams(vec3 ro, vec3 rd, float tmax, Mem m, int N, float dens){\n  vec3 L = sunDir(m);\n  vec3 sc = sunColor(m);\n  if(sunUp(m)<0.01) return vec3(0);\n  float tEnd = min(tmax, 30.0);\n  float dt = tEnd/float(N);\n  float t = dt*ign(gl_FragCoord.xy+uTime*60.0);\n  vec3 acc = vec3(0);\n  float mu = dot(rd, L);\n  float g=0.55; float phase = (1.0-g*g)/(4.0*PI*pow(1.0+g*g-2.0*g*mu,1.5));\n  for(int i=0;i<64;i++){\n    if(i>=N) break;\n    vec3 p = ro+rd*t;\n    vec2 tr = wallTransmit(p, L, m);\n    float d = dens*(0.25+1.2*sq(vnoise(p*0.9+vec3(0.0,uTime*0.05,0.0))));\n    acc += tr.x*d*dt;\n    t += dt;\n  }\n  return acc*sc*phase;\n}\n\n// ---------------------------------------------------------------- shards\n// Each shard = bowl shell ∩ warped Voronoi cell i, with its own rigid transform.\n// world = R_i * (local - C_i) + P_i\nuniform vec4 uShardQ[NSEED];   // rotation quaternion (local -> world)\nuniform vec4 uShardP[NSEED];   // world position of the centroid, w = visible (0/1)\nuniform vec4 uShardC[NSEED];   // rest centroid (bowl local), w = bounding radius\nuniform float uShardScale;     // world scale of the bowl (1 normally)\nuniform vec3  uBowlWorld;      // world position of the bowl origin at rest\n\nvec3 qrot(vec4 q, vec3 v){ return v + 2.0*cross(q.xyz, cross(q.xyz, v) + q.w*v); }\nvec3 qinv(vec4 q, vec3 v){ return qrot(vec4(-q.xyz, q.w), v); }\n\nvec3 shardLocal(vec3 p, int i){\n  return qinv(uShardQ[i], p-uShardP[i].xyz)/uShardScale + uShardC[i].xyz;\n}\n\nfloat sdShard(vec3 q, int i){\n  float b = sdBowl(q);\n  if(b > 0.03) return b;\n  return max(b, cellDist(q, i)*0.8);\n}\n\n// candidate list from ray / bounding-sphere tests\nstruct Cands { int n; int id[6]; float t0; float t1; };\n\nCands shardCull(vec3 ro, vec3 rd){\n  Cands c; c.n=0; c.t0=1e5; c.t1=0.0;\n  for(int i=0;i<NSEED;i++){\n    if(uShardP[i].w<0.5) continue;\n    vec3 oc = ro-uShardP[i].xyz;\n    float r = uShardC[i].w*uShardScale;\n    float b = dot(oc,rd), cc = dot(oc,oc)-r*r;\n    float h = b*b-cc;\n    if(h<0.0) continue;\n    h = sqrt(h);\n    float ta=-b-h, tb=-b+h;\n    if(tb<0.0) continue;\n    if(c.n<6){ c.id[c.n]=i; c.n++; c.t0=min(c.t0,max(ta,0.0)); c.t1=max(c.t1,tb); }\n  }\n  return c;\n}\n\n// returns (distance, shard index)\nvec2 shardMap(vec3 p, Cands c){\n  vec2 r = vec2(1e5, -1.0);\n  for(int k=0;k<6;k++){\n    if(k>=c.n) break;\n    int i = c.id[k];\n    vec3 q = shardLocal(p, i);\n    // quick reject by bounding sphere\n    float bs = length(p-uShardP[i].xyz) - uShardC[i].w*uShardScale;\n    float d = bs > 0.05 ? bs : sdShard(q, i)*uShardScale;\n    if(d<r.x) r=vec2(d, float(i));\n  }\n  return r;\n}\n\nvec3 shardNormalLocal(vec3 q, int i){\n  const vec2 e=vec2(0.0006,-0.0006);\n  return normalize(e.xyy*sdShard(q+e.xyy,i)+e.yyx*sdShard(q+e.yyx,i)+e.yxy*sdShard(q+e.yxy,i)+e.xxx*sdShard(q+e.xxx,i));\n}\n\n// march the shard field between the culled bounds. returns (t, index) or t<0\nvec2 shardTrace(vec3 ro, vec3 rd, Cands c, float tmax){\n  if(c.n==0) return vec2(-1.0);\n  float t = c.t0;\n  float te = min(c.t1, tmax);\n  for(int s=0;s<110;s++){\n    vec2 h = shardMap(ro+rd*t, c);\n    if(h.x < 0.0004*t+0.0003) return vec2(t, h.y);\n    t += h.x*0.85;\n    if(t>te) break;\n  }\n  return vec2(-1.0);\n}\n\n// ---------------------------------------------------------------- scene: BREAK\n// The shattered bowl. The room falls away into darkness; each shard's glaze\n// becomes a window into a different moment of the bowl's life.\nuniform float uMemDay, uMemSeason, uMemTwo, uMemGap, uMemCandle, uMemSteam, uMemTea, uMemTea2, uMemOpen, uMemRing;\nuniform vec4  uMemA[NSEED];    // day, season, two, candle\nuniform vec4  uMemB[NSEED];    // gap, open, tea, ring\nuniform vec4  uMemCam[NSEED];  // azimuth, elevation, distance, fov\nuniform vec4  uShardN[NSEED];  // mean outward normal (rest), w = portal strength\nuniform float uVoid;           // 0 room, 1 darkness\nuniform float uPortal;         // global portal amount\nuniform float uGoldEdge;       // gold on the fracture faces\nuniform float uGoldGlow;       // molten glow of that gold\nuniform vec3  uImpact;         // world position of the impact\nuniform vec3  uKeyDir;\nuniform float uSpecks;         // suspended chips / dust\nout vec4 fragColor;\n\nMem presentMem(){\n  Mem m;\n  m.day=uMemDay; m.season=uMemSeason; m.two=uMemTwo; m.gap=uMemGap; m.candle=uMemCandle;\n  m.steam=uMemSteam; m.tea=uMemTea; m.tea2=uMemTea2; m.open=uMemOpen; m.ring=uMemRing;\n  m.bowlOn=0.0; m.bowlOff=vec3(0); m.bowlTilt=0.0;\n  return m;\n}\nMem shardMem(int i){\n  Mem m;\n  vec4 a=uMemA[i], b=uMemB[i];\n  m.day=a.x; m.season=a.y; m.two=a.z; m.candle=a.w;\n  m.gap=b.x; m.open=b.y; m.tea=b.z; m.tea2=b.z*a.z; m.ring=b.w;\n  m.steam=step(0.01,b.z); m.bowlOn=1.0; m.bowlOff=vec3(0); m.bowlTilt=0.0;\n  return m;\n}\n\nvec3 voidEnv(vec3 d){\n  float up = d.y*0.5+0.5;\n  vec3 c = mix(vec3(0.004,0.004,0.006), vec3(0.012,0.010,0.009), up);\n  // a faint warm horizon glow, like light remembered\n  c += vec3(0.05,0.03,0.015)*exp(-abs(d.y)*6.0)*0.4;\n  return c;\n}\n\nvec3 portalView(int i, vec3 q, vec3 dl){\n  vec3 n = uShardN[i].xyz;\n  float sd = dot(dl, n);\n  vec3 f = (sd>=0.0 ? 1.0 : -1.0)*n;\n  vec3 right = normalize(cross(vec3(0,1,0), f));\n  vec3 up = cross(f, right);\n  vec3 c = uShardC[i].xyz;\n  vec3 rel = q-c;\n  vec3 ld = vec3(dot(dl,right), dot(dl,up), dot(dl,f));\n  // recentre on the direction to the shard centroid so the memory stays framed\n  vec3 cw = qinv(uShardQ[i], normalize(uShardP[i].xyz-uCamPos));\n  vec3 lc = vec3(dot(cw,right), dot(cw,up), dot(cw,f));\n  ld.xy = (ld.xy/max(ld.z,0.2) - 0.75*lc.xy/max(lc.z,0.2));\n  vec4 mc = uMemCam[i];\n  vec3 tg = vec3(-0.45, 0.32, 0 ples\n      vec3 nb = n;\n      BUMP(nb, q, glazeRipple, 0.004, 0.004);\n      s.n = nb;\n      // gold on the break (reassembly)\n      if(uGoldEdge>0.0){\n        float g = uGoldEdge*smoothstep(0.3, 0.7, uGoldEdge + 0.3*gnoise(q*20.0));\n        s.alb = mix(s.alb, vec3(0.0), g);\n        s.f0 = mix(s.f0, vec3(1.0,0.74,0.32), g);\n        s.rough = mix(s.rough, 0.25, g);\n        s.emit = vec3(1.0,0.55,0.18)*g*uGoldGlow*3.0;\n      }\n      vec3 roomL = roomLightSurf(s, p, v, pm, 1.0);\n      vec3 key = vec3(1.0,0.86,0.7)*1.6;\n      vec3 voidL = s.alb*(key*sat(dot(s.n,L)) + voidEnv(s.n)*2.0) + specGGX(s.n, v, L, s.rough, s.f0)*key\n                 + s.f0*voidEnv(reflect(-v,s.n))*0.5 + s.emit;\n      lit = mix(roomL, voidL, uVoid);\n    }\n    col = lit; depth = h.x;\n  }\n  fragColor = vec4(col, depth);\n}\n"}};
// Minimal WebGL2 helpers shared by the film and the dev spikes.
const GLX = (() => {
  function compile(gl, type, src, label) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  function checkShader(gl, s, src, label) {
    if (gl.getShaderParameter(s, gl.COMPILE_STATUS)) return;
    const log = gl.getShaderInfoLog(s) || '';
    const lines = src.split('\n');
    const ctx = [];
    const re = /ERROR: \d+:(\d+)/g;
    let m;
    while ((m = re.exec(log))) {
      const ln = +m[1];
      for (let i = Math.max(1, ln - 2); i <= Math.min(lines.length, ln + 2); i++)
        ctx.push((i === ln ? '>>' : '  ') + i + ': ' + lines[i - 1]);
      ctx.push('--');
    }
    throw new Error('[' + label + '] shader compile failed\n' + log + '\n' + ctx.join('\n'));
  }

  const VS = `#version 300 es
  out vec2 vUv;
  void main(){
    vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2);
    vUv = p;
    gl_Position = vec4(p*2.0-1.0, 0.0, 1.0);
  }`;

  // Programs are created in two steps so compiles can run in parallel
  // (KHR_parallel_shader_compile) while a loading screen animates.
  function beginProgram(gl, fsSrc, label) {
    const vs = compile(gl, gl.VERTEX_SHADER, VS, label + ':vs');
    const fs = compile(gl, gl.FRAGMENT_SHADER, fsSrc, label);
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    return { gl, p, vs, fs, fsSrc, label, ready: false, uniforms: {} };
  }

  function isDone(prog, ext) {
    if (!ext) return true;
    return prog.gl.getProgramParameter(prog.p, ext.COMPLETION_STATUS_KHR);
  }

  function finishProgram(prog) {
    const gl = prog.gl;
    if (!gl.getProgramParameter(prog.p, gl.LINK_STATUS)) {
      checkShader(gl, prog.vs, VS, prog.label + ':vs');
      checkShader(gl, prog.fs, prog.fsSrc, prog.label);
      throw new Error('[' + prog.label + '] link failed: ' + gl.getProgramInfoLog(prog.p));
    }
    const n = gl.getProgramParameter(prog.p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(prog.p, i);
      const name = info.name.replace(/\[0\]$/, '');
      prog.uniforms[name] = { loc: gl.getUniformLocation(prog.p, info.name), type: info.type, size: info.size };
    }
    prog.ready = true;
    return prog;
  }

  function program(gl, fsSrc, label) {
    return finishProgram(beginProgram(gl, fsSrc, label));
  }

  // Set uniforms by name; unknown names are ignored so scenes can share one
  // big uniform bag.
  let texUnit = 0;
  function use(prog) {
    prog.gl.useProgram(prog.p);
    texUnit = 0;
  }

  function set(prog, name, v) {
    const u = prog.uniforms[name];
    if (!u) return;
    const gl = prog.gl;
    const L = u.loc;
    switch (u.type) {
      case gl.FLOAT:
        if (u.size > 1) gl.uniform1fv(L, v); else gl.uniform1f(L, v);
        break;
      case gl.FLOAT_VEC2: gl.uniform2fv(L, v); break;
      case gl.FLOAT_VEC3: gl.uniform3fv(L, v); break;
      case gl.FLOAT_VEC4: gl.uniform4fv(L, v); break;
      case gl.INT: case gl.BOOL: gl.uniform1i(L, v); break;
      case gl.FLOAT_MAT3: gl.uniformMatrix3fv(L, false, v); break;
      case gl.FLOAT_MAT4: gl.uniformMatrix4fv(L, false, v); break;
      case gl.SAMPLER_2D: {
        gl.activeTexture(gl.TEXTURE0 + texUnit);
        gl.bindTexture(gl.TEXTURE_2D, v);
        gl.uniform1i(L, texUnit++);
        break;
      }
    }
  }

  function setAll(prog, bag) {
    for (const k in bag) set(prog, k, bag[k]);
  }

  function target(gl, w, h, opts = {}) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    const internal = opts.internal || gl.RGBA16F;
    const format = opts.format || gl.RGBA;
    const type = opts.type || gl.HALF_FLOAT;
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
    const filt = opts.nearest ? gl.NEAREST : gl.LINEAR;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  }

  function draw(gl, tgt) {
    if (tgt) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, tgt.fb);
      gl.viewport(0, 0, tgt.w, tgt.h);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // Camera: returns a 3x3 basis (column-major) for look-at.
  function lookAt(eye, target, roll = 0, upv = null) {
    const f = norm(sub(target, eye));
    let up = upv || [Math.sin(roll), Math.cos(roll), 0];
    let r = norm(cross(f, up));
    const u = cross(r, f);
    return [r[0], r[1], r[2], u[0], u[1], u[2], f[0], f[1], f[2]];
  }

  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const mix = (a, b, t) => Array.isArray(a) ? a.map((x, i) => x + (b[i] - x) * t) : a + (b - a) * t;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  return { program, beginProgram, finishProgram, isDone, use, set, setAll, target, draw, lookAt,
    v: { sub, add, mul, dot, len, norm, cross, mix, clamp, smooth } };
})();
if (typeof module !== 'undefined') module.exports = GLX;

// Timeline utilities: easing, keyframe tracks, and the tempo grid.
const TL = (() => {
  const BPM = 72;
  const BAR = 240 / BPM;          // seconds per 4/4 bar
  const BEAT = 60 / BPM;
  const bar = b => b * BAR;

  const ease = {
    lin: x => x,
    in: x => x * x,
    out: x => 1 - (1 - x) * (1 - x),
    io: x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,
    io3: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
    sine: x => 0.5 - 0.5 * Math.cos(Math.PI * x),
    expo: x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x),
    step: x => x < 1 ? 0 : 1,
  };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lin = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
  const smooth = (a, b, x) => { const t = lin(a, b, x); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * t) : a + (b - a) * t;

  // keys: [[t, value, easeName?], ...] sorted; ease applies to the segment ending at that key
  function track(keys) {
    return t => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 1; i < keys.length; i++) {
        if (t <= keys[i][0]) {
          const [t0, v0] = keys[i - 1], [t1, v1, e] = keys[i];
          const x = (t - t0) / (t1 - t0);
          return mix(v0, v1, (ease[e || 'sine'])(x));
        }
      }
      return keys[keys.length - 1][1];
    };
  }

  // smooth Catmull-Rom path through points (for cameras), param 0..1 with
  // approximately uniform speed via arc-length table
  function path(points) {
    const P = i => points[clamp(i, 0, points.length - 1)];
    const raw = u => {
      const n = points.length - 1;
      const x = clamp(u, 0, 1) * n;
      const i = Math.min(n - 1, Math.floor(x)), t = x - i;
      const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
      const t2 = t * t, t3 = t2 * t;
      return p1.map((_, c) => 0.5 * ((2 * p1[c]) + (-p0[c] + p2[c]) * t + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * t2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * t3));
    };
    const N = 200, lens = [0];
    let prev = raw(0);
    for (let i = 1; i <= N; i++) {
      const q = raw(i / N);
      lens.push(lens[i - 1] + Math.hypot(...q.map((v, c) => v - prev[c])));
      prev = q;
    }
    const total = lens[N];
    return s => {
      const target = clamp(s, 0, 1) * total;
      let lo = 0, hi = N;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (lens[m] < target) lo = m; else hi = m; }
      const f = (target - lens[lo]) / Math.max(1e-9, lens[hi] - lens[lo]);
      return raw((lo + f) / N);
    };
  }

  // Sync points shared by picture and sound (seconds). Filled in by the director.
  const CUE = {};

  return { CUE, BPM, BAR, BEAT, bar, ease, clamp, lin, smooth, mix, track, path };
})();

      const v = Math.sin(ph) * eB * 1.3 + lp.run(nz) * eS * 1.4 + (eC > 1e-4 ? hp.run(nz) * eC * 0.5 : 0);
      eB *= dB; eS *= dS; eC *= dC;
      buf[i] = v / (1 + Math.abs(v) * 0.6);
    }
    mix(buf, t, vel * 0.32, pan, 0.35);
  }

  // rin (temple bowl): inharmonic partial pairs with slow beating, long decay
  function rin(t, m, vel, pan = 0) {
    if (!inW(t)) return;
    const f0 = mtof(m);
    const len = 11, n = Math.floor(len * SR);
    const buf = new Float32Array(n);
    const ratios = [1, 2.71, 5.12, 8.21, 11.9], amps = [1, 0.55, 0.3, 0.16, 0.08], taus = [7.5, 5, 2.8, 1.6, 0.9];
    for (let k = 0; k < ratios.length; k++) {
      for (const d of [-0.35, 0.35]) {
        const w = TAU * (f0 * ratios[k] + d * (k + 1)) / SR;

        let e = amps[k] * 0.5; const dd = Math.exp(-1 / (taus[k] * SR));
        for (let i = 0; i < n; i++) { const y = cw * y1 - y2; y2 = y1; y1 = y; buf[i] += y * e; e *= dd; }
      }
    }
    const hp = biquad('hp', 4000, 0.7);
    for (let i = 0; i < 0.01 * SR; i++) buf[i] += hp.run(white()) * 0.3 * Math.exp(-i / (0.002 * SR));
    for (let i = 0; i < 32; i++) buf[i] *= i / 32;
    mix(buf, t, vel * 0.28, pan, 0.6);
  }

  // music-box / memory bell
  function bell(t, m, vel, pan = 0, send = 0.75) {
    if (!inW(t)) return;
    const f0 = mtof(m), len = 4, n = Math.floor(len * SR);
    const buf = new Float32Array(n);
    const ratios = [1, 2.0, 3.01, 4.17, 5.43], amps = [1, 0.32, 0.12, 0.1, 0.05], taus = [2.6, 1.3, 0.7, 0.45, 0.25];
    for (let k = 0; k < ratios.length; k++) {
      const w = TAU * f0 * ratios[k] / SR; if (f0 * ratios[k] > SR * 0.45) continue;
      const cw = 2 * Math.cos(w); let y1 = Math.sin(-w), y2 = Math.sin(-2 * w);
      let e = amps[k]; const dd = Math.exp(-1 / (taus[k] * SR));
      for (let i = 0; i < n; i++) { const y = cw * y1 - y2; y2 = y1; y1 = y; buf[i] += y * e; e *= dd; }
    }
    for (let i = 0; i < 48; i++) buf[i] *= i / 48;
    mix(buf, t, vel * 0.2, pan, send);
  }

  // glaze crazing ping: tiny glassy tink
  function ping(t, f, vel, pan) {
    if (!inW(t)) return;
    const n = Math.floor(0.6 * SR), buf = new Float32Array(n);
    const ratios = [1, 2.37, 3.93], taus = [0.22, 0.09, 0.05];
    for (let k = 0; k < 3; k++) {
      const w = TAU * f * ratios[k] / SR; if (f * ratios[k] > SR * 0.45) continue;
      const cw = 2 * Math.cos(w); let y1 = Math.sin(-w), y2 = Math.sin(-2 * w);
      let e = 1 / (k + 1); const dd = Math.exp(-1 / (taus[k] * SR));
      for (let i = 0; i < n; i++) { const y = cw * y1 - y2; y2 = y1; y1 = y; buf[i] += y * e; e *= dd; }
    }
    for (let i = 0; i < 16; i++) buf[i] *= i / 16;
    mix(buf, t, vel * 0.12, pan, 0.7);
  }

  // generic noise event: shaped, filtered
  function noise(t, len, env, filt, gain, pan = 0, send = 0.3, stereo = 0) {
    if (!inW(t)) return;
    const n = Math.floor(len * SR), bl = new Float32Array(n), br = new Float32Array(n);
    const q = filt();
    const b0 = q.b0, b1 = q.b1, b2 = q.b2, a1 = q.a1, a2 = q.a2;
    let lx1 = 0, lx2 = 0, ly1 = 0, ly2 = 0, rx1 = 0, rx2 = 0, ry1 = 0, ry2 = 0, e = 0;
    const pa = (pan + 1) * Math.PI / 4, gl = Math.cos(pa) * 1.41, gr = Math.sin(pa) * 1.41;
    const ms = stereo * 0.5;
    for (let i = 0; i < n; i++) {
      if ((i & 15) === 0) e = env(i / SR, len);
      const a = white(), b = white();
      const xl = a * (1 - ms) + b * ms, xr = b * (1 - ms) + a * ms;
      const yl = b0 * xl + b1 * lx1 + b2 * lx2 - a1 * ly1 - a2 * ly2; lx2 = lx1; lx1 = xl; ly2 = ly1; ly1 = yl;
      const yr = b0 * xr + b1 * rx1 + b2 * rx2 - a1 * ry1 - a2 * ry2; rx2 = rx1; rx1 = xr; ry2 = ry1; ry1 = yr;
      bl[i] = yl * e * gl; br[i] = yr * e * gr;
    }
    mix2(bl, br, t, gain, send);
  }

  // ================================================================ MATERIAL
  const THEME_A_D = parse('A4:2 C5:1 D5:1 E5:3 D5:1 C5:1 A4:1 G4:1.5 F4:0.5 G4:2 A4:2');
  const THEME_B_D = parse('A4:2 C5:1 D5:1 F5:2 E5:1 D5:1 C5:1 D5:1 A4:2 D5:4');
  const THEME_A_F = parse('C5:2 E5:1 F5:1 G5:3 F5:1 E5:1 C5:1 B4:1.5 A4:0.5 B4:2 C5:2');
  const THEME_B_F = parse('C5:2 E5:1 F5:1 A5:2 G5:1 F5:1 E5:1 F5:1 C5:2 F5:4');
  const COUNTER = parse('F4:3 E4:1 D4:2 F4:2 E4:2 C4:2 E4:4 F4:3 G4:1 F4:2 D4:2 C4:2 F4:2 F4:4');
  const CH = {
    Dm: [50, 57, 62, 64, 65, 69], Bbmaj7: [46, 53, 57, 62, 65], C: [48, 55, 62, 64, 67], Am: [45, 52, 57, 60, 64],
    F: [41, 48, 57, 60, 65], Gm: [43, 50, 58, 62, 65], CE: [40, 48, 55, 62, 64], Dm7: [38, 50, 57, 60, 65],
    G: [43, 50, 59, 62, 67], A: [45, 52, 57, 61, 64], Asus: [45, 52, 57, 62, 64], D: [38, 50, 57, 62, 66, 69],
    Bb: [46, 53, 58, 62, 65], Gm7: [43, 50, 58, 62, 65],
  };
  const PROG_D = ['Dm', 'Bbmaj7', 'C', 'Am'];
  const PROG_D2 = ['Dm', 'Bbmaj7', 'F', 'Dm'];

  function melody(bar0, notes, inst, vel, opts = {}) {
    for (const nt of notes) {
      const t = B(bar0) + nt.beat * BEAT;
      const d = nt.dur * BEAT;
      const m = nt.midi + (opts.oct || 0) * 12;
      const v = vel * (opts.dyn ? opts.dyn(nt.beat) : 1) * (0.92 + 0.16 * rnd());
      if (inst === 'shaku') shaku(t + rr(0, 0.02), d * 0.97, m, v, opts.pan ?? 0.12, { breath: opts.breath ?? 1, fall: nt.dur >= 4 });
      else if (inst === 'koto') koto(t, m, v, opts.pan ?? -0.25, { bend: nt.dur >= 3 ? [d * 0.45, 2] : null, len: Math.max(2.5, d + 1.5) });
      else if (inst === 'piano') piano(t, d, m, v, opts.pan ?? 0, opts.send ?? 0.45);
      else if (inst === 'bell') bell(t, m, v, opts.pan ?? 0);
    }
  }
  function kotoArp(bar0, bars, prog, vel, opts = {}) {
    const pat = opts.pat || [0, 2, 3, 4, 5, 4, 3, 2];
    const step = opts.step || 0.5;
    for (let b = 0; b < bars; b++) {
      const ch = CH[prog[b % prog.length]];
      for (let k = 0; k < 4 / step; k++) {
        const idx = pat[k % pat.length];
        if (idx < 0) continue;
        const m = ch[Math.min(ch.length - 1, idx)] + (opts.oct || 0) * 12;
        const t = B(bar0 + b) + k * step * BEAT + rr(0, 0.012);
        koto(t, m, vel * (k === 0 ? 1.1 : 0.8 + 0.2 * rnd()), (k % 2 ? 0.35 : -0.35) * (opts.width ?? 1), { len: 2.2 });
      }
    }
  }
  function padProg(bar0, bars, prog, vel, opts = {}) {
    for (let b = 0; b < bars; b++) {
      const ch = CH[prog[b % prog.length]].map(m => m + (opts.oct || 0) * 12);
      pad(B(bar0 + b), BAR * 1.02, ch, vel, Object.assign({ attack: 0.9, release: 1.6 }, opts));
    }
  }
  function pianoChords(bar0, bars, prog, vel, opts = {}) {
    for (let b = 0; b < bars; b++) {
      const ch = CH[prog[b % prog.length]];
      const t = B(bar0 + b);
      piano(t, BAR * 0.9, ch[0], vel * 0.9, -0.2);
      const upper = ch.slice(2);
      upper.forEach((m, i) => piano(t + BEAT * (opts.roll ? 0.12 * (i + 1) : 0) + (opts.half ? 0 : BEAT), BAR * 0.8, m, vel * 0.55, 0.1 + i * 0.1));
      if (opts.half) upper.forEach((m, i) => piano(t + BEAT * 2 + 0.05 * i, BAR * 0.4, m, vel * 0.45, 0.1 + i * 0.1));
    }
  }

  let progressDone = 0;
  const step = (x) => { progressDone = x; report && report(x); };

  // ================================================================ 0. ENSO (bars 0-6)
  rin(B(0) + 0.3, 62 + 12, 0.55, 0);
  pad(B(0.8), B(5.4), [38, 45], 0.25, { attack: 4, release: 3, cutoff: 380, send: 0.5 });
  melody(1, THEME_A_D, 'shaku', 0.95, { pan: 0.08 });
  // brush on paper follows the stroke
  noise(C.brush0, C.brush1 - C.brush0 + 0.4, (x, L) => Math.sin(Math.PI * Math.min(1, x / L)) ** 1.5 * (0.7 + 0.3 * Math.sin(x * 23)) * (1 - 0.6 * (x / L > 0.8 ? (x / L - 0.8) * 5 : 0)),
    () => biquad('bp', 3200, 0.9), 0.05, -0.1, 0.2, 0.3);
  // breath swell into the clay
  noise(B(5.2), BAR * 0.85, (x, L) => (x / L) ** 2, () => biquad('bp', 900, 1.5), 0.05, 0.1, 0.5);
  step(0.08);

  // ================================================================ 1. CLAY (bars 6-17)
  kotoArp(6, 2, PROG_D, 0.5, { pat: [0, -1, 3, -1, 4, -1, 3, -1] });
  kotoArp(8, 8, PROG_D, 0.55);
  padProg(6, 11, PROG_D, 0.55, { cutoff: 1400 });
  melody(9, THEME_A_D, 'koto', 0.95, { pan: 0.15 });
  melody(13, THEME_B_D, 'koto', 0.95, { pan: 0.15 });
  melody(13, THEME_B_D, 'shaku', 0.35, { oct: -1, breath: 0.6, pan: -0.3 });
  // wheel hum (motor + rotation) following the wheel's speed
  if (inW(C.clay0)) {
    const t0 = C.clay0, t1 = C.clay0 + 23, n = Math.floor((t1 - t0) * SR);
    const buf = new Float32Array(n); let ph = 0, ph2 = 0;
    const lp = biquad('lp', 300, 0.8), bp = biquad('bp', 900, 2.0);
    for (let i = 0; i < n; i++) {

      ph += TAU * 46 * (0.5 + 0.5 * sp) / SR; ph2 += TAU * 1.6 * sp / SR;
      const hum = (Math.sin(ph) * 0.6 + Math.sin(2 * ph) * 0.2) * sp;
      const rumble = lp.run(white()) * 0.8 * sp;
      // wet clay under hands: squish swells that follow the rotation while shaping
      const shaping = (x > 3.5 && x < 18) ? 0.5 + 0.5 * Math.sin(ph2) : 0;
      const squish = bp.run(white()) * shaping * (0.5 + 0.5 * Math.sin(x * 1.7)) * 1.2;
      const fade = Math.min(1, x / 1.5) * Math.min(1, (n / SR - x) / 1.0);
      buf[i] = (hum * 0.25 + rumble * 0.5 + squish * 0.6) * fade;
    }
    mix(buf, t0, 0.22, 0.0, 0.15);
  }
  // wheel stops: a soft wooden knock and the room breathes
  noise(C.clay0 + 21.6, 1.2, x => Math.exp(-x / 0.05), () => biquad('bp', 220, 3), 0.2, 0.0, 0.3);
  // drone swells into the fire
  pad(B(15), BAR * 2.2, [38, 45, 50], 0.8, { attack: 5, release: 1.5, cutoff: 700, swell: 2 });
  step(0.25);

  // ================================================================ 2. FIRE (bars 17-29)
  taiko(B(17), 1.0, 1.25);
  for (let b = 17; b < 21; b++) { taiko(B(b), 0.85, 1.2, -0.1); if (b >= 19) taiko(B(b) + 2 * BEAT, 0.6, 1.0, 0.2); }
  for (let b = 21; b < 23; b++) for (const k of [0, 1.5, 2, 3, 3.5]) taiko(B(b) + k * BEAT, k === 0 ? 0.95 : 0.6, k === 0 ? 1.2 : 0.9, (k % 2 ? 0.3 : -0.3));
  for (let b = 23; b < 25; b++) for (let k = 0; k < 16; k++) taiko(B(b) + k * BEAT / 4, 0.35 + 0.5 * ((b - 23) * 16 + k) / 32, 0.85, (k % 2 ? 0.35 : -0.35));
  taiko(C.firePeak, 1.3, 1.5, 0); taiko(C.firePeak + 0.02, 1.0, 0.8, 0.3);
  // low strings ostinato
  {
    const ost = [50, 50, 53, 52, 50, 50, 48, 50];
    for (let b = 17; b < 25; b++) for (let k = 0; k < 8; k++) {
      pad(B(b) + k * BEAT / 2, BEAT * 0.42, [ost[k] - 12, ost[k]], 0.5 + 0.35 * (b - 17) / 8, { attack: 0.02, release: 0.15, cutoff: 900 + 250 * (b - 17), send: 0.3 });
    }
  }
  // brass-like swells, growing dissonance
  pad(B(19), BAR * 2, [50, 57, 62, 65], 1.0, { attack: 2.5, cutoff: 1500, swell: 1.5 });
  pad(B(21), BAR * 2, [46, 53, 58, 62, 65], 1.2, { attack: 2.0, cutoff: 2000, swell: 1.5 });
  pad(B(23), C.firePeak - B(23), [45, 51, 57, 58, 63, 64], 1.6, { attack: 3.0, cutoff: 2600, swell: 2.5 });
  // the fire itself
  if (inW(C.fire0)) {
    const t0 = C.fire0, t1 = C.fire0 + 32, n = Math.floor((t1 - t0) * SR);
    const bl = new Float32Array(n), br = new Float32Array(n);
    const lpl = biquad('lp', 400, 0.7), lpr = biquad('lp', 400, 0.7);
    let bn1 = 0, bn2 = 0;
    for (let i = 0; i < n; i++) {
      const x = i / SR;
      const k = x < 5 ? 0.35 + 0.65 * x / 5 : x < 26 ? 1 : Math.max(0, 1 - (x - 26) / 4) ** 2;
      if (i % 256 === 0) { lpl.set(250 + 900 * k, 0.7); lpr.set(260 + 900 * k, 0.7); }
      bn1 = bn1 * 0.985 + white() * 0.15; bn2 = bn2 * 0.985 + white() * 0.15;
      const flick = 0.75 + 0.25 * Math.sin(x * 3.1 + Math.sin(x * 1.3) * 2);
      bl[i] = lpl.run(bn1) * k * flick * 2.2; br[i] = lpr.run(bn2) * k * flick * 2.2;
    }
    mix2(bl, br, t0, 0.11, 0.25);
    // crackles: resinous wood pops
    for (let i = 0; i < 200; i++) {
      const x = rr(0, 29), k = x < 5 ? 0.4 : x < 26 ? 1 : 0.2;
      if (rnd() > k) continue;
      noise(t0 + x, 0.03, y => Math.exp(-y / 0.004), () => biquad('bp', rr(1500, 5000), 2), rr(0.05, 0.25), rr(-0.8, 0.8), 0.2);
    }
  }
  // peak: a great exhale of flame
  noise(C.firePeak - 1.5, 4.5, (x) => (x < 1.5 ? (x / 1.5) ** 2 : Math.exp(-(x - 1.5) / 0.9)), () => biquad('lp', 1800, 0.6), 0.2, 0, 0.5, 0.6);
  // silence, then glaze crazing pings as it cools (pentatonic, high)
  {
    const pent = [86, 88, 91, 93, 96, 98, 100, 103];
    for (let i = 0; i < 46; i++) {
      const x = C.crack0 + (C.crack1 - C.crack0) * Math.pow(rnd(), 0.8);
      ping(x, mtof(pent[Math.floor(rnd() * pent.length)]) * rr(0.995, 1.005), rr(0.35, 1.0), rr(-0.9, 0.9));
    }
  }
  // kiln door: wooden scrape and cool air
  noise(C.door0, 2.5, (x) => (0.5 + 0.5 * Math.sin(x * 19)) * Math.exp(-x / 0.9) * Math.min(1, x / 0.1), () => biquad('bp', 320, 2.5), 0.25, -0.3, 0.3);
  noise(C.door0 + 0.5, 7, (x) => Math.min(1, x / 2) * Math.exp(-x / 5), () => biquad('lp', 1200, 0.5), 0.12, 0.2, 0.5, 0.7);
  // piano steps in
  piano(B(27.5), BEAT * 3, 69, 0.45, 0.1);
  piano(B(28.25), BEAT * 3, 65, 0.4, -0.1);
  step(0.45);

  // ================================================================ 3. LIFE (bars 29-47)
  pianoChords(29, 2, ['Dm', 'Bbmaj7'], 0.5, { roll: true });
  pianoChords(31, 8, [...PROG_D, ...PROG_D2], 0.42, { half: true });
  padProg(31, 11, [...PROG_D, ...PROG_D2, 'Dm', 'Bbmaj7', 'C'], 0.35, { cutoff: 1100 });
  // the duet: two voices, two bowls
  melody(31, THEME_A_D, 'shaku', 0.8, { pan: 0.25, breath: 0.7 });
  melody(31, COUNTER, 'koto', 0.7, { pan: -0.35 });
  melody(35, THEME_B_D, 'shaku', 0.8, { pan: 0.25, breath: 0.7 });
  melody(39, THEME_A_D, 'koto', 0.85, { pan: -0.3 });
  melody(39, COUNTER.filter(n => n.beat < 12), 'shaku', 0.55, { pan: 0.3, breath: 0.5, oct: 0 });
  pianoChords(39, 3, ['Dm', 'Bbmaj7', 'C'], 0.4, { half: true });
  // seasons
  for (let i = 0; i < 18; i++) { // spring birds
    const t = C.life0 + rr(0.5, 14), f = rr(2800, 5200), syl = 2 + Math.floor(rnd() * 4), pan = rr(-0.7, 0.7);
    for (let s = 0; s < syl; s++) {
      const n = Math.floor(0.07 * SR), buf = new Float32Array(n); let ph = 0;
      const f1 = f * rr(0.9, 1.1), sweep = rr(-0.5, 0.6);
      if (!inW(t)) continue;
      for (let j = 0; j < n; j++) { const x = j / n; ph += TAU * f1 * (1 + sweep * x) / SR; buf[j] = Math.sin(ph + 2 * Math.sin(ph * 0.5)) * Math.sin(Math.PI * x) ** 2; }
      mix(buf, t + s * rr(0.08, 0.13), 0.03, pan, 0.4);
    }
  }
  noise(C.life0 + 14, 14, (x, L) => Math.sin(Math.PI * x / L) * (0.6 + 0.4 * Math.sin(TAU * 70 * x) ** 2) * (0.7 + 0.3 * Math.sin(x * 0.9)), () => biquad('bp', 5200, 3), 0.035, 0.4, 0.2); // cicadas
  noise(C.life0 + 26, 22, (x, L) => Math.sin(Math.PI * x / L) * (0.5 + 0.5 * Math.sin(x * 0.7 + Math.sin(x * 0.23) * 3)), () => biquad('lp', 700, 0.5), 0.1, -0.2, 0.3, 0.8); // autumn/winter wind
  // tea: a pour at the first morning, steam hiss
  if (inW(C.pour)) {
    const t0 = C.pour, n = Math.floor(2.4 * SR), buf = new Float32Array(n);
    const bp = biquad('bp', 500, 4);
    for (let i = 0; i < n; i++) {
      const x = i / SR;
      if (i % 128 === 0) bp.set(420 + 520 * (x / 2.4) + 80 * Math.sin(x * 37), 5);
      buf[i] = bp.run(white()) * Math.min(1, x / 0.1) * Math.min(1, (2.4 - x) / 0.4) * (0.6 + 0.4 * Math.sin(x * 61) ** 2);
    }
    mix(buf, t0, 0.18, -0.15, 0.35);
  }
  // alone: the second voice stops. Piano, sparse.
  piano(B(42), BAR * 1.5, 50, 0.4, -0.2); piano(B(42) + BEAT, BAR, 69, 0.35, 0.1);
  piano(B(43), BEAT * 2, 72, 0.33, 0.1); piano(B(43) + BEAT * 2, BEAT * 2, 74, 0.3, 0.15);
  piano(B(44), BAR * 1.2, 76, 0.32, 0.1); piano(B(44), BAR, 46, 0.35, -0.2);
  piano(B(45), BAR * 1.5, 74, 0.28, 0.1); piano(B(45), BAR * 1.5, 57, 0.25, -0.1);
  pad(B(42), BAR * 3, [38, 45], 0.45, { attack: 3, cutoff: 500 });
  // the lift and the tremble: a thin high cluster, a held breath
  pad(C.lift, C.fall - C.lift + 0.3, [81, 82], 0.5, { attack: 1.5, release: 0.05, cutoff: 5000, trem: 11, swell: 2, send: 0.5 });
  pad(C.lift, C.fall - C.lift + 0.2, [26], 0.9, { attack: 2, release: 0.05, cutoff: 150 });
  noise(C.fall, C.shatter - C.fall, x => (x / Math.max(0.01, C.shatter - C.fall)) ** 2, () => biquad('bp', 1400, 0.8), 0.12, 0, 0.2);
  step(0.62);

  // ================================================================ 4. BREAK (bars 47-56)
  {
    const t0 = C.shatter;
    // impact
    taiko(t0, 0.9, 1.4, 0);
    noise(t0, 1.4, x => Math.exp(-x / 0.25), () => biquad('hp', 1800, 0.7), 0.55, 0, 0.5, 0.8);
    noise(t0, 0.3, x => Math.exp(-x / 0.03), () => biquad('bp', 600, 1.2), 0.6, 0, 0.3);
