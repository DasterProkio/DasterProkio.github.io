v(vec3 d){\n  // what glossy things see: the bright window to the left, a dim warm room\n  vec3 c = vec3(0.012,0.011,0.01) + uWarm*vec3(0.05,0.03,0.015);\n  float win = smoothstep(0.55,0.75,-d.x)*smoothstep(-0.05,0.15,d.y)*smoothstep(0.85,0.6,d.y)*smoothstep(0.7,0.4,abs(d.z+0.1));\n  c += uSunCol*0.35*win;\n  return c;\n}\n\nfloat studioAO(vec3 p, vec3 n){\n  float o=0.0, s=1.0;\n  for(int i=1;i<=4;i++){ float h=0.03*float(i*i); o+=(h-studioMap(p+n*h).x)*s; s*=0.65; }\n  return sat(1.0-1.8*o);\n}\n\nvec3 studioLight(Surf s, vec3 p, vec3 v, float ao){\n  vec3 L = normalize(uSun);\n  float lit = windowLit(p, L);\n  float sh = lit>0.0 ? studioShadow(p+s.n*0.003, L) : 0.0;\n  vec3 direct = uSunCol*lit*sh;\n  // practical warm lamp above right\n  vec3 lp = vec3(3.0, 6.0, -2.0);\n  vec3 ld = lp-p; float r2 = dot(ld,ld); vec3 Lw = ld*inversesqrt(r2);\n  vec3 warm = vec3(1.0,0.6,0.3)*uWarm*18.0/r2;\n  float nl = sat(dot(s.n,L)), nlw = sat(dot(s.n,Lw));\n  float nv = sat(dot(s.cn,v));\n  float Fc = s.coat*F_Schlick1(0.02, nv);\n  vec3 amb = studioEnv(s.n)*1.4*ao + vec3(0.02,0.022,0.025)*ao*sat(s.n.y*0.5+0.5);\n  vec3 col = s.alb*(1.0-Fc)*(direct*nl + warm*nlw + amb);\n  col += specGGX(s.n, v, L, s.rough, s.f0)*direct + specGGX(s.n, v, Lw, s.rough, s.f0)*warm;\n  if(s.coat>0.0){\n    col += s.coat*(specGGX(s.cn, v, L, s.coatRough, vec3(0.02))*direct + specGGX(s.cn, v, Lw, s.coatRough, vec3(0.02))*warm\n                  + studioEnv(reflect(-v,s.cn))*F_Schlick1(0.02,nv)*mix(1.0, 3.0, 1.0-s.coatRough*2.0));\n  }\n  return col + s.emit;\n}\n\nvec3 studioShade(vec3 p, vec3 rd, float id){\n  vec3 n = studioNormal(p);\n  vec3 v = -rd;\n  float ao = studioAO(p, n);\n  Surf s;\n  if(id==1.0){\n    s = bowlSurface(p, n, v);\n  } else if(id==2.0){\n    s = defaultSurf(n);\n    // wheel head covered in slip, rotating\n    vec3 q = rotYv(p, uWheelSpin);\n    float r = length(q.xz), a = atan(q.z,q.x);\n    float smear = sat(0.5+0.8*gnoise(vec3(a*5.0, r*6.0, 0.0)));\n    float rings = 0.5+0.5*sin(r*40.0);\n    s.alb = mix(vec3(0.07,0.04,0.028), vec3(0.14,0.09,0.06), smear*0.6)*(0.9+0.1*rings);\n    s.alb = mix(s.alb, vec3(0.35,0.36,0.37), smoothstep(1.45,1.6,r)*0.8);   // metal rim\n    s.coat = uWater*(0.4+0.6*smear); s.coatRough = 0.12; s.rough = 0.7;\n  } else if(id==3.0){\n    s = defaultSurf(n);\n    s.alb = vec3(0.08,0.07,0.065); s.rough = 0.4; s.coat = 0.3; s.coatRough = 0.3;\n    s.alb *= 0.7+0.3*sat(gnoise(p*8.0)+0.5);\n  } else if(id==4.0){\n    s = defaultSurf(n);\n    s.alb = vec3(0.2,0.18,0.16)*(0.8+0.2*fbm(p*0.8,3));\n    if(p.y < -3.0) s.alb = vec3(0.12,0.1,0.08)*(0.7+0.3*fbm(p.xz*2.0,3)); // floor\n    s.rough = 0.9;\n  } else {\n    s = defaultSurf(n);\n    s.alb = vec3(0.35,0.26,0.2)*(0.7+0.3*fbm(p*3.0,2)); s.rough = 0.6; s.coat = 0.4; s.coatRough = 0.15;\n  }\n  return studioLight(s, p, v, ao);\n}\n\nvoid main(){\n  vec3 ro = uCamPos, rd = camRay(gl_FragCoord.xy);\n  float t = 0.0; vec2 h = vec2(0); bool hit = false;\n  for(int i=0;i<150;i++){\n    h = studioMap(ro+rd*t);\n    if(h.x < 0.0003*t+0.0003){ hit=true; break; }\n    t += h.x*0.9;\n    if(t>40.0) break;\n  }\n  vec3 col = studioEnv(rd)*0.3;\n  if(hit) col = studioShade(ro+rd*t, rd, h.y); else t = 40.0;\n\n  // window shaft with dust\n  vec3 L = normalize(uSun);\n  float tEnd = min(t, 25.0);\n  const int N = 28;\n  float dt = tEnd/float(N);\n  float tt = dt*ign(gl_FragCoord.xy + fract(uTime*13.0)*97.0);\n  vec3 acc = vec3(0);\n  float mu = dot(rd, L);\n  float g = 0.6; float phase = (1.0-g*g)/(4.0*PI*pow(1.0+g*g-2.0*g*mu,1.5));\n  for(int i=0;i<N;i++){\n    vec3 p = ro+rd*tt;\n    float lit = windowLit(p, L);\n    if(lit>0.0){\n      float d = 0.03 + 0.08*sq(vnoise(p*0.6+vec3(uTime*0.03,0,0)));\n      acc += lit*d*dt;\n    }\n    tt += dt;\n  }\n  col += acc*uSunCol*phase*0.8;\n  // dust motes: bright specks drifting inside the shaft\n  for(int l=0;l<5;l++){\n    float z = 1.2 + float(l)*1.1;\n    if(z > t) break;\n    vec3 p = ro+rd*z;\n    vec3 cell = floor(p*5.0);\n    vec3 hh = hash33(cell + float(l)*31.0);\n    vec3 sp = (cell + 0.5 + 0.4*sin(hh*6.28 + uTime*vec3(0.3,0.2,0.25)))/5.0;\n    vec3 w = sp-ro; float tp = dot(w,rd);\n    float d = length(w-rd*tp);\n    float lit = windowLit(sp, L);\n    if(hh.x>0.85 && lit>0.5) col += uSunCol*lit*uDust*0.00025/(d*d*3000.0+0.004);\n  }\n  fragColor = vec4(col, t);\n}\n","kiln":"#version 300 es\n// ---------------------------------------------------------------- common\nprecision highp float;\nprecision highp int;\n\nin vec2 vUv;\nuniform vec2  uRes;\nuniform float uTime;      // film time, seconds\nuniform float uLocal;     // scene-local time\nuniform vec3  uCamPos;\nuniform mat3  uCamRot;\nuniform float uFov;       // tan(fov/2)\nuniform vec2  uJitter;    // subpixel jitter in pixels\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n\nfloat sat(float x){ return clamp(x,0.,1.); }\nvec3  sat(vec3 x){ return clamp(x,0.,1.); }\nfloat sq(float x){ return x*x; }\nfloat lin(float a,float b,float x){ return sat((x-a)/(b-a)); }\nmat2  rot(float a){ float c=cos(a),s=sin(a); return mat2(c,s,-s,c); }\n\n// ---- hashing (integer based, stable across GPUs)\nuint hashu(uint x){ x ^= x>>16; x *= 0x7feb352du; x ^= x>>15; x *= 0x846ca68bu; x ^= x>>16; return x; }\nfloat hash11(float p){ return float(hashu(floatBitsToUint(p)))*(1.0/4294967296.0); }\nfloat hash12(vec2 p){ uvec2 q = uvec2(ivec2(floor(p))); return float(hashu(q.x ^ hashu(q.y + 0x9e3779b9u)))*(1.0/4294967296.0); }\nfloat hash13(vec3 p){ uvec3 q = uvec3(ivec3(floor(p))); return float(hashu(q.x ^ hashu(q.y ^ hashu(q.z + 0x632be5abu))))*(1.0/4294967296.0); }\nvec3  hash33(vec3 p){\n  uvec3 q = uvec3(ivec3(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y ^ hashu(q.z)));\n  return vec3(float(h), float(hashu(h)), float(hashu(h+1u)))*(1.0/4294967296.0);\n}\nvec2  hash22(vec2 p){\n  uvec2 q = uvec2(ivec2(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y));\n  return vec2(float(h), float(hashu(h)))*(1.0/4294967296.0);\n}\n// screen-space blue-ish noise for dithering / jittering ray starts\nfloat ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056,0.00583715)))); }\n\n// ---- value noise\nfloat vnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*(3.0-2.0*f);\n  float a=hash13(i), b=hash13(i+vec3(1,0,0)), c=hash13(i+vec3(0,1,0)), d=hash13(i+vec3(1,1,0));\n  float e=hash13(i+vec3(0,0,1)), f1=hash13(i+vec3(1,0,1)), g=hash13(i+vec3(0,1,1)), h=hash13(i+vec3(1,1,1));\n  return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y), mix(mix(e,f1,u.x),mix(g,h,u.x),u.y), u.z);\n}\nfloat vnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*(3.0-2.0*f);\n  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y);\n}\n// gradient noise (signed, -1..1)\nfloat gnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash33(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(mix(G(vec3(0,0,0)),G(vec3(1,0,0)),u.x), mix(G(vec3(0,1,0)),G(vec3(1,1,0)),u.x),u.y),\n                mix(mix(G(vec3(0,0,1)),G(vec3(1,0,1)),u.x), mix(G(vec3(0,1,1)),G(vec3(1,1,1)),u.x),u.y),u.z);\n  #undef G\n  return r*1.6;\n}\nfloat gnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash22(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(G(vec2(0,0)),G(vec2(1,0)),u.x), mix(G(vec2(0,1)),G(vec2(1,1)),u.x), u.y);\n  #undef G\n  return r*1.4;\n}\nfloat fbm(vec3 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=p*2.03+vec3(17.1,-3.7,9.2); a*=0.5; }\n  return s;\n}\nfloat fbm(vec2 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,7.7); a*=0.5; }\n  return s;\n}\n\n// Voronoi with true border distance (iq). Returns (border distance, cell id hash, F1)\nvec3 voronoiB(vec3 x){\n  vec3 p=floor(x), f=fract(x);\n  vec3 mb; vec3 mr; float md=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=mb+vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    vec3 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash13(p+mb+vec3(7.0)), sqrt(md));\n}\nvec3 voronoiB(vec2 x){\n  vec2 p=floor(x), f=fract(x);\n  vec2 mb; vec2 mr; float md=8.0;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec2 b=vec2(i,j); vec2 r=b+hash22(p+b)-f; float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){\n    vec2 b=mb+vec2(i,j); vec2 r=b+hash22(p+b)-f; vec2 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash12(p+mb+vec2(7.0)), sqrt(md));\n}\n\n// ---- SDF helpers\nfloat smin(float a,float b,float k){ float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*0.25; }\nfloat smax(float a,float b,float k){ return -smin(-a,-b,k); }\nfloat sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }\nfloat sdBox(vec2 p, vec2 b){ vec2 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,q.y),0.0); }\nfloat sdRBox(vec3 p, vec3 b, float r){ return sdBox(p,b-r)-r; }\nfloat sdCyl(vec3 p, float r, float h){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }\nfloat sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=sat(dot(pa,ba)/dot(ba,ba)); return length(pa-ba*h); }\n\n// ---- camera\nvec3 camRay(vec2 frag){\n  vec2 uv = (2.0*(frag+uJitter)-uRes)/uRes.y;\n  return normalize(uCamRot*vec3(uv*uFov, 1.0));\n}\n\n// ---- colour\nvec3 blackbody(float t){ // t in Kelvin, returns linear rgb (normalised-ish)\n  t = clamp(t, 800.0, 12000.0)/100.0;\n  vec3 c;\n  c.r = t<=66.0 ? 1.0 : 1.292936*pow(t-60.0,-0.1332047592);\n  c.g = t<=66.0 ? 0.3900815*log(t)-0.6318414 : 1.129890*pow(t-60.0,-0.0755148492);\n  c.b = t>=66.0 ? 1.0 : (t<=19.0 ? 0.0 : 0.5432068*log(t-10.0)-1.1962541);\n  return pow(sat(c), vec3(2.2));\n}\nfloat luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }\n\n// ---- BRDF\nfloat D_GGX(float nh, float a){ float a2=a*a; float d=nh*nh*(a2-1.0)+1.0; return a2/(PI*d*d); }\nfloat V_SmithJ(float nv, float nl, float a){ float a2=a*a;\n  float gv=nl*sqrt(nv*nv*(1.0-a2)+a2), gl=nv*sqrt(nl*nl*(1.0-a2)+a2); return 0.5/max(gv+gl,1e-5); }\nvec3  F_Schlick(vec3 f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\nfloat F_Schlick1(float f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\n// returns specular (already multiplied by nl)\nvec3 specGGX(vec3 n, vec3 v, vec3 l, float rough, vec3 f0){\n  vec3 h=normalize(v+l);\n  float nl=sat(dot(n,l)), nv=max(dot(n,v),1e-4), nh=sat(dot(n,h)), vh=sat(dot(v,h));\n  float a=max(rough*rough,0.002);\n  return D_GGX(nh,a)*V_SmithJ(nv,nl,a)*F_Schlick(f0,vh)*nl;\n}\n// analytic env-BRDF approximation (Karis)\nvec2 envBRDF(float nv, float rough){\n  vec4 c0=vec4(-1,-0.0275,-0.572,0.022), c1=vec4(1,0.0425,1.04,-0.04);\n  vec4 r=rough*c0+c1; float a004=min(r.x*r.x,exp2(-9.28*nv))*r.x+r.y;\n  return vec2(-1.04,1.04)*a004+r.zw;\n}\n\n// ---------------------------------------------------------------- bowl\n// Units: 1.0 = 10 cm. Bowl local space: foot rests on y=0, axis is +y.\n#define NPROF 16\nuniform vec4  uProf[NPROF];   // centerline (r, y), half thickness, unused\nuniform vec4  uFoot;          // foot ring stroke: r0,y0,r1,y1\nuniform float uFootTh;        // foot half thickness (0 = none)\nuniform float uWobble;        // rim wobble amplitude\nuniform float uOval;          // ovality\nuniform float uRidge;         // throwing ridge amplitude\nuniform float uSpin;          // wheel angle (radians), rotates surface detail\n\n// material state\nuniform float uWet;       // 1 = wet thrown clay\nuniform float uDry;       // 0..1 wet->leather->bone dry\nuniform float uGlazeRaw;  // raw glaze slip coverage (matte)\nuniform float uMelt;      // glaze melted (glossy)\nuniform float uHeat;      // incandescence 0..1\nuniform float uAsh;       // natural ash deposit\nuniform float uCrackle;   // crackle network visibility\nuniform float uStain;     // tea stain in crackle\nuniform float uGold;      // kintsugi seams\nuniform float uTeaLevel;  // tea fill 0..1 (0 = empty)\nuniform float uFroth;     // matcha froth amount\n\n// fracture / seam network\n#define NSEED 14\nuniform vec4 uSeeds[NSEED]; // xyz seed on bowl surface (local), w unused\n\nstruct BowlHit { float d; float side; float s; vec2 nDelta; };\n\nvec2 segPerp(int i){ vec2 b=normalize(uProf[i+1].xy-uProf[i].xy); return vec2(-b.y, b.x); }\n\n// distance-only version for marching\nfloat bowlProfileD(vec2 q){\n  float d = 1e5;\n  for(int i=0;i<NPROF-1;i++){\n    vec2 a=uProf[i].xy, ba=uProf[i+1].xy-a, pa=q-a;\n    float t=sat(dot(pa,ba)/dot(ba,ba));\n    d=min(d, length(pa-ba*t)-mix(uProf[i].z, uProf[i+1].z, t));\n  }\n  return d;\n}\n\n// full version: side (+1 inside the cavity, -1 outside), arc parameter, and the\n// correction that turns faceted polyline normals into smooth (Phong-like) ones\nBowlHit bowlProfile(vec2 q){\n  BowlHit h; h.d = 1e5; h.side = 0.0; h.s = 0.0; h.nDelta=vec2(0);\n  float acc = 0.0, total = 0.0;\n  for(int i=0;i<NPROF-1;i++) total += length(uProf[i+1].xy-uProf[i].xy);\n  int bi=0; float bt=0.0;\n  for(int i=0;i<NPROF-1;i++){\n    vec2 a=uProf[i].xy, b=uProf[i+1].xy;\n    vec2 pa=q-a, ba=b-a;\n    float L = length(ba);\n    float t=sat(dot(pa,ba)/(L*L));\n    float th=mix(uProf[i].z, uProf[i+1].z, t);\n    float d=length(pa-ba*t)-th;\n    if(d<h.d){ h.d=d; h.side = (pa.x*ba.y-pa.y*ba.x) < 0.0 ? 1.0 : -1.0; h.s=(acc+t*L)/total; bi=i; bt=t; }\n    acc += L;\n  }\n  if(bt>0.0 && bt<1.0){\n    vec2 pf = segPerp(bi);\n    vec2 n0 = bi>0 ? normalize(segPerp(bi-1)+pf) : pf;\n    vec2 n1 = bi<NPROF-2 ? normalize(segPerp(bi+1)+pf) : pf;\n    vec2 ns = normalize(mix(n0,n1,bt));\n    h.nDelta = (ns-pf)*h.side;\n  }\n  return h;\n}\n\nvec2 bowlQ(vec3 p){\n  float a = atan(p.z,p.x);\n  float r = length(p.xz);\n  r *= 1.0 + uOval*cos(2.0*a-1.4);\n  float rim = smoothstep(0.25,0.75,p.y);\n  float y = p.y - uWobble*rim*(0.55*sin(a*2.0+1.3)+0.3*sin(a*5.0+4.0)+0.15*sin(a*9.0+0.5));\n  return vec2(r, y);\n}\n\nfloat sdBowl(vec3 p){\n  vec2 q = bowlQ(p);\n  float d = bowlProfileD(q);\n  if(uFootTh>0.0){\n    float th = uFootTh;\n    float df = sdSeg(q, uFoot.xy, uFoot.zw) - th;\n    d = smin(d, df, 0.03);\n  }\n  // throwing ridges (spiral rings)\n  d -= uRidge*sin(q.y*70.0 + 0.6*sin(q.y*9.0))*smoothstep(0.02,0.1,q.y);\n  return d;\n}\n\n// full info at a surface point (called once per hit)\nBowlHit bowlInfo(vec3 p){\n  vec2 q = bowlQ(p);\n  BowlHit h = bowlProfile(q);\n  if(uFootTh>0.0){\n    float df = sdSeg(q, uFoot.xy, uFoot.zw) - uFootTh;\n    if(df < h.d + 0.012){ h.side = -2.0; h.nDelta = vec2(0); } // foot ring: unglazed\n  }\n  return h;\n}\n\n// Fracture warp: cheap analytic wobble so the same cells can be marched per shard.\n// (Mirrored exactly in bowl.js for CPU-side centroids.)\nvec3 fracWarp(vec3 p){\n  return p + 0.030*sin(p.zxy*9.1+vec3(1.3,4.1,2.7))\n           + 0.012*sin(p.yzx*23.7+vec3(0.4,2.2,5.1))\n           + 0.005*sin(p.zxy*61.0+vec3(2.9,0.7,4.4));\n}\n\n// Warped Voronoi on the fixed fracture seeds. Returns (border distance, cell index, second index)\nvec3 seamField(vec3 p){\n  vec3 w = fracWarp(p);\n  float d1=1e5, d2=1e5; int i1=0, i2=0;\n  for(int i=0;i<NSEED;i++){\n    vec3 r = w-uSeeds[i].xyz;\n    float d = dot(r,r);\n    if(d<d1){ d2=d1; i2=i1; d1=d; i1=i; } else if(d<d2){ d2=d; i2=i; }\n  }\n  vec3 s1=uSeeds[i1].xyz, s2=uSeeds[i2].xyz;\n  float bd = (d2-d1)/(2.0*length(s2-s1));\n  return vec3(bd, float(i1), float(i2));\n}\n\n// signed distance (in warped space) to the boundary of cell i: <0 inside\nfloat cellDist(vec3 p, int i){\n  vec3 w = fracWarp(p);\n  vec3 si = uSeeds[i].xyz;\n  float di = dot(w-si,w-si);\n  float d = -1e5;\n  for(int j=0;j<NSEED;j++){\n    if(j==i) continue;\n    vec3 sj = uSeeds[j].xyz;\n    float dj = dot(w-sj,w-sj);\n    d = max(d, (di-dj)/(2.0*length(sj-si)));\n  }\n  return d;\n}\n\n// glaze thickness 0..~2 on the surface\nfloat glazeThickness(vec3 p, BowlHit h){\n  float a = atan(p.z,p.x);\n  if(h.side < -1.5) return 0.0;              // foot\n  float s = h.s;\n  float t;\n  if(h.side > 0.0){\n    // interior: pools in the well\n    t = 0.75 + 1.1*smoothstep(0.42,0.05,s) ;\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);     // thins over the rim\n  } else {\n    // exterior: glaze line with drips\n    float line = 0.46 + 0.04*gnoise(vec2(a*2.0,1.7));\n    float drip = pow(sat(gnoise(vec2(a*7.0, 3.1))*0.5+0.5), 5.0)*0.28\n               + pow(sat(gnoise(vec2(a*19.0, 8.3))*0.5+0.5), 8.0)*0.18;\n    float edge = line - drip;\n    float cov = smoothstep(edge-0.004, edge+0.01, s);\n    // thick roll at the drip end, thinning toward the rim\n    t = cov*(0.7 + 1.1*exp(-max(s-edge,0.0)*28.0));\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);\n  }\n  // natural ash: heavier on one flank (facing the fire)\n  float ashSide = sat(0.5+0.5*cos(a-2.4))*smoothstep(0.35,0.85,s);\n  t += uAsh*ashSide*(0.6+0.8*sat(gnoise(p*14.0)+0.3));\n  return t;\n}\n\n// ---------------------------------------------------------------- bowl material\nstruct Surf {\n  vec3 alb;      // diffuse albedo (base, under coat)\n  vec3 f0;       // base specular reflectance (metals)\n  float rough;   // base roughness\n  float coat;    // clear coat (glaze / water film) strength 0..1\n  float coatRough;\n  vec3 n;        // base normal\n  vec3 cn;       // coat normal\n  vec3 emit;\n  float sss;     // wrap / translucency amount\n};\n\nSurf defaultSurf(vec3 n){\n  Surf s; s.alb=vec3(0.5); s.f0=vec3(0.04); s.rough=0.8; s.coat=0.0; s.coatRough=0.1;\n  s.n=n; s.cn=n; s.emit=vec3(0); s.sss=0.0; return s;\n}\n\nvec3 rotYv(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x-s*p.z, p.y, s*p.x+c*p.z); }\n\n// perturb normal with a scalar height function's numerical gradient projected on the surface\n#define BUMP(n, P, F, EPS, AMT) { \\\n  vec3 _e=vec3(EPS,0,0); float _h0=F(P); \\\n  vec3 _g=vec3(F(P+_e.xyy)-_h0, F(P+_e.yxy)-_h0, F(P+_e.yyx)-_h0)/EPS; \\\n  _g-=n*dot(_g,n); n=normalize(n-AMT*_g); }\n\nfloat clayGrain(vec3 p){ return gnoise(p*140.0)*0.5+gnoise(p*330.0)*0.25; }\nfloat glazeRipple(vec3 p){ return gnoise(p*22.0)+0.35*gnoise(p*61.0); }\n\nSurf bowlSurface(vec3 p, vec3 n, vec3 v){\n  Surf s = defaultSurf(n);\n  BowlHit h = bowlInfo(p);\n  { vec2 dr = normalize(p.xz+1e-6); n = normalize(n + vec3(dr.x*h.nDelta.x, h.nDelta.y, dr.y*h.nDelta.x)); s.n=n; s.cn=n; }\n  vec3 pr = rotYv(p, uSpin);            // detail rotating with the wheel\n  float a = atan(pr.z, pr.x);\n\n  // ---------- clay body\n  float speck = smoothstep(0.86, 0.95, vnoise(pr*80.0)) * 0.7;\n  float grain = clayGrain(pr);\n  vec3 fired = vec3(0.50,0.44,0.37)*(0.92+0.1*grain);\n  fired = mix(fired, vec3(0.18,0.09,0.05), speck);\n  // flashing on the unglazed foot / exposed body\n  float flash = sat(0.5+0.8*gnoise(pr*4.0+3.0));\n  vec3 footCol = mix(fired, vec3(0.58,0.30,0.14), 0.55*flash);\n\n  // unfired clay (wet -> dry)\n  vec3 wetCol = vec3(0.19,0.10,0.065);\n  vec3 dryCol = vec3(0.60,0.53,0.46)*(0.95+0.08*grain);\n  vec3 raw = mix(wetCol, dryCol, smoothstep(0.0,1.0,uDry));\n  float slurry = sat(0.5+0.9*gnoise(vec3(a*6.0, pr.y*38.0, 0.0)));\n\n  float firedAmt = max(uMelt, uHeat);\n  // iron shows through where the glaze thins over the rim: a warm brown lip, not raw grain\n  fired = mix(fired, vec3(0.30,0.19,0.12)*(0.95+0.05*grain), smoothstep(0.9, 0.995, h.s)*0.85);\n  vec3 body = mix(raw, h.side<-1.5 ? footCol : fired, sat(firedAmt*1.5));\n  s.alb = body;\n  s.rough = 0.85;\n  BUMP(s.n, pr, clayGrain, 0.002, 0.00025*(1.0-0.8*uMelt));\n\n  // ---------- wet film\n  if(uWet>0.0){\n    float film = uWet*(0.55+0.45*slurry);\n    s.coat = film;\n    s.coatRough = mix(0.32, 0.12, slurry);\n    s.alb = mix(s.alb, s.alb*0.7, film);\n    s.cn = n;\n    // throwing lines in the film\n    vec3 nn = n;\n    float lines = sin(p.y*140.0+2.0*gnoise(vec3(a*3.0,p.y*10.0,0.0)));\n    nn = normalize(nn + 0.08*uWet*lines*vec3(0,1,0));\n    s.cn = nn;\n  }\n\n  // ---------- glaze\n  float t = glazeThickness(p, h);\n  float rawCov = smoothstep(1.02-uGlazeRaw*1.1, 1.04-uGlazeRaw*1.1, h.s)*step(0.001,uGlazeRaw);\n  float cov = sat(t*4.0)*max(rawCov, uMelt);\n  if(cov>0.0){\n    // raw slip (unfired glaze powder)\n    vec3 slip = vec3(0.70,0.72,0.70)*(0.95+0.08*grain);\n    float rawAmt = rawCov*(1.0-uMelt);\n    // melted celadon: Beer-Lambert over the body + milky scatter\n    vec3 sigma = vec3(0.62,0.26,0.33);\n    float tt = t*(1.0+0.15*gnoise(p*7.0));\n    vec3 trans = exp(-sigma*tt*1.6);\n    vec3 milk = vec3(0.55,0.72,0.66);\n    float scat = 1.0-exp(-tt*0.9);\n    vec3 glazeCol = mix(body*trans*1.15, milk*mix(vec3(1.0),trans,0.5), scat*0.72);\n    // ash: greener glassy runs\n    glazeCol = mix(glazeCol, vec3(0.30,0.42,0.22)*trans*1.4, sat(uAsh*(t-0.9)*0.9));\n    // iron specks bleed through\n    glazeCol = mix(glazeCol, vec3(0.22,0.13,0.07), speck*0.5*exp(-tt*1.2));\n\n    // crackle network (two scales, only in glaze)\n    float crk = 0.0;\n    if(uCrackle>0.0){\n      vec3 wp = p + 0.02*vec3(gnoise(p*13.0), gnoise(p*13.0+7.0), gnoise(p*13.0+3.0));\n      vec3 c1 = voronoiB(wp*vec3(5.5,7.0,5.5)+vec3(3.0));\n      vec3 c2 = voronoiB(wp*15.0+vec3(1.3));\n      float l1 = 1.0-smoothstep(0.004, 0.016, c1.x);\n      float l2 = (1.0-smoothstep(0.004, 0.02, c2.x))*0.45;\n      float reveal = smoothstep(c1.y*0.8, c1.y*0.8+0.2, uCrackle);\n      crk = max(l1*reveal, l2*smoothstep(0.4,1.0,uCrackle)*step(0.55,c2.y));\n      crk *= 0.55+0.45*sat(gnoise(p*5.0)+0.5);\n      vec3 crackCol = mix(glazeCol*1.4+0.06, vec3(0.28,0.16,0.07), uStain*(h.side>0.0?1.0:0.6));\n      glazeCol = mix(glazeCol, crackCol, crk*0.8);\n    }\n\n    vec3 glazed = glazeCol;\n    s.alb = mix(s.alb, mix(glazed, slip, rawAmt), cov);\n    s.rough = mix(s.rough, 0.9, cov*rawAmt);\n    // melted glaze is a clear coat\n    float coat = cov*uMelt;\n    s.coat = max(s.coat, coat);\n    s.coatRough = mix(s.coatRough, 0.045, coat);\n    vec3 cn = n;\n    BUMP(cn, p, glazeRipple, 0.004, 0.0004*uMelt);\n    s.cn = normalize(mix(s.cn, cn, coat));\n    s.sss = 0.35*coat*scat;\n  }\n\n  // ---------- tea stain on the unglazed foot over years\n  s.alb *= 1.0 - 0.15*uStain*step(h.side,-1.5);\n\n  // ---------- incandescence\n  if(uHeat>0.0){\n    float T = mix(800.0, 1330.0, uHeat);\n    s.emit = blackbody(T)*pow(uHeat,2.2)*2.5*(0.85+0.15*grain);\n  }\n\n  // ---------- kintsugi gold\n  if(uGold>0.0){\n    vec3 sf = seamField(p);\n    float w = 0.0075*(0.75+0.5*sat(gnoise(p*6.0)*0.5+0.5));\n    float g = 1.0-smoothstep(w*0.75, w, sf.x);\n    g *= uGold;\n    if(g>0.0){\n      vec3 e = normalize(uSeeds[int(sf.z)].xyz-uSeeds[int(sf.y)].xyz);\n      float x = sat(sf.x/w);\n      float slope = -0.9*x/sqrt(max(1.0-x*x,0.02));\n      vec3 et = normalize(e - n*dot(e,n));\n      vec3 gn = normalize(n + slope*et*0.6);\n      float burnish = sat(0.5+0.8*gnoise(p*40.0));\n      s.alb = mix(s.alb, vec3(0.0), g);\n      s.f0 = mix(s.f0, vec3(1.0,0.74,0.32), g);\n      s.rough = mix(s.rough, mix(0.34,0.14,burnish), g);\n      s.coat = mix(s.coat, 0.0, g);\n      s.n = normalize(mix(s.n, gn, g));\n      s.cn = s.n;\n    }\n  }\n  return s;\n}\n\n// ---------------------------------------------------------------- scene: FIRE (kiln)\n// Inside a wood-fired tunnel kiln. Flames pour from the firebox (+z) past the\n// bowl toward the camera. Later the fire dies and the door is opened to dawn.\nuniform float uFire;      // flame intensity 0..1\nuniform float uWallT;     // wall incandescence 0..1\nuniform float uDoor;      // cool daylight through the opened door (camera side)\nuniform float uEmber;     // ember bed glow after the fire dies\nout vec4 fragColor;\n\n#define KR 3.6\n\nfloat brickPattern(vec3 p, out vec2 cell){\n  // running bond on the vault surface: u = arc length, v = z\n  float a = atan(p.x, p.y-0.3);\n  vec2 uv = vec2(a*KR, p.z)/vec2(0.55,1.1);\n  uv.x += 0.5*mod(floor(uv.y),2.0);\n  cell = floor(uv);\n  vec2 f = abs(fract(uv)-0.5);\n  return min(0.5-f.x, (0.5-f.y)*2.0*0.55/1.1);\n}\n\n// ids: 1 bowl, 2 vault, 3 floor, 4 other wares\nvec2 kilnMap(vec3 p){\n  float bb = length(p-vec3(0,0.4,0))-0.95;\n  vec2 r = vec2(bb > 0.3 ? bb : sdBowl(p), 1.0);\n  // vault (interior of a half-cylinder along z)\n  vec2 cell;\n  float mortar = brickPattern(p, cell);\n  float vault = KR - length(p.xy-vec2(0.0,0.3)) - 0.03*smoothstep(0.05,0.0,mortar) + 0.03*hash12(cell);\n  if(vault<r.x) r = vec2(vault, 2.0);\n  // floor with ash and sand\n  float fl = p.y + 0.02*fbm(p.xz*3.0,2);\n  if(fl<r.x) r = vec2(fl, 3.0);\n  // other wares further in: a jar with a neck, a bowl, a tall vase\n  vec3 q = p-vec3(-1.7,0.0,2.8);\n  vec2 jq = vec2(length(q.xz), q.y);\n  float jar = length((jq-vec2(0.0,0.75))/vec2(0.85,0.75))*0.75-0.75;\n  jar = smin(jar, sdSeg(jq, vec2(0.0,1.3), vec2(0.0,1.75))-0.32, 0.12);\n  jar = max(jar, -(sdSeg(jq, vec2(0.0,1.2), vec2(0.0,1.9))-0.24));\n  jar = max(jar, -q.y);\n  q = p-vec3(1.8,0.0,3.6);\n  vec2 bq = vec2(length(q.xz), q.y);\n  float b2 = abs(length(bq-vec2(0.0,0.95))-0.8)-0.05;\n  b2 = max(b2, max(-q.y, q.y-0.9));\n  q = p-vec3(0.3,0.0,6.5);\n  vec2 vq = vec2(length(q.xz), q.y);\n  float b3 = length((vq-vec2(0.0,1.3))/vec2(0.7,1.3))*0.7-0.7;\n  b3 = max(smin(b3, sdSeg(vq, vec2(0.0,2.4), vec2(0.0,3.0))-0.25, 0.15), -q.y);\n  float wares = min(jar, min(b2, b3));\n  if(wares<r.x) r = vec2(wares, 4.0);\n  return r;\n}\n\nvec3 kilnNormal(vec3 p){\n  const vec2 e = vec2(0.0008,-0.0008);\n  return normalize(e.xyy*kilnMap(p+e.xyy).x + e.yyx*kilnMap(p+e.yyx).x + e.yxy*kilnMap(p+e.yxy).x + e.xxx*kilnMap(p+e.xxx).x);\n}\n\n// fire density: turbulent tongues flowing toward -z and rising\nfloat fireDensity(vec3 p){\n  vec3 q = p;\n  float t = uTime;\n  q.z += t*2.2;\n  q.y -= t*0.6;\n  vec3 w = vec3(vnoise(q*0.9), vnoise(q*0.9+7.1), vnoise(q*0.9+3.3));\n  q += (w-0.5)*1.6;\n  vec3 qa = q*vec3(1.4,0.9,0.45);                 // tongues elongated along the flow\n  float n = vnoise(qa*1.3)*0.55 + vnoise(qa*2.9)*0.3 + vnoise(qa*6.1)*0.15;\n  float ridge = 1.0-abs(2.0*vnoise(qa*2.2+vec3(0,0,t*0.5))-1.0);\n  n = n*0.7 + ridge*ridge*0.45;\n  // shape: fills the lower tunnel, thicker toward the firebox\n  float h = p.y;\n  float shape = smoothstep(2.6, 0.2, h - 0.25*p.z) * smoothstep(-4.0, 2.0, p.z) * smoothstep(-0.1, 0.3, h);\n  float d = sat(n*2.6 - 1.45 + 0.55*shape) * shape;\n  // flames hug the bowl: licking tongues around its surface, none inside\n  float sb = sdBowl(p);\n  d *= smoothstep(0.0, 0.08, sb);\n  d += 0.5*exp(-sb*7.0)*sat(n-0.35)*step(0.0,sb)*smoothstep(0.0,0.5,h);\n  return d*uFire;\n}\n\nvec3 kilnEnv(vec3 d){\n  // what glossy surfaces reflect: glowing brick, fire, and later the door\n  vec3 wall = blackbody(mix(800.0, 1250.0, uWallT))*uWallT*uWallT*1.0;\n  vec3 fire = blackbody(1400.0)*uFire*1.2*sat(d.z*0.5+0.6);\n  vec3 door = vec3(0.55,0.65,0.85)*uDoor*1.2*smoothstep(0.3,0.9,-d.z);\n  vec3 ember = vec3(1.0,0.3,0.05)*uEmber*0.3*sat(-d.y*0.5+0.3);\n  return wall + fire + door + ember + 0.005;\n}\n\nvoid main(){\n  vec3 ro = uCamPos, rd = camRay(gl_FragCoord.xy);\n  float t = 0.0; vec2 h = vec2(0); bool hit = false;\n  for(int i=0;i<140;i++){\n    h = kilnMap(ro+rd*t);\n    if(h.x < 0.0004*t+0.0004){ hit=true; break; }\n    t += h.x*0.9;\n    if(t>30.0) break;\n  }\n  vec3 col = vec3(0);\n  if(hit){\n    vec3 p = ro+rd*t;\n    vec3 n = kilnNormal(p);\n    vec3 v = -rd;\n    Surf s;\n    vec3 emitWall = vec3(0);\n    if(h.y==1.0){\n      s = bowlSurface(p, n, v);\n    } else {\n      s = defaultSurf(n);\n      vec2 cell; float mortar = brickPattern(p, cell);\n      float hb = hash12(cell);\n      vec3 brick = mix(vec3(0.35,0.2,0.12), vec3(0.5,0.35,0.22), hb);\n      // ash glaze runs on the bricks: greenish glassy drips\n      float drip = smoothstep(0.55,0.85, fbm(vec2(p.z*1.5, p.y*0.3+atan(p.x,p.y)*3.0),3)+0.4*hb);\n      brick = mix(brick, vec3(0.2,0.25,0.12), drip*0.7);\n      if(h.y==3.0) brick = vec3(0.3,0.27,0.24)*(0.8+0.3*fbm(p.xz*4.0,3));\n      if(h.y==4.0){ brick = mix(vec3(0.12,0.07,0.04), vec3(0.28,0.22,0.1), smoothstep(0.4,0.7,fbm(p*3.0,3)+0.3)); }\n      s.alb = mix(brick, brick*0.5, smoothstep(0.05,0.0,mortar)*step(h.y,2.5)*step(1.5,h.y));\n      s.rough = 0.85; s.coat = drip*0.8*step(h.y,2.5); s.coatRough = 0.1;\n      // incandescent kiln walls (hotter further in)\n      float T = mix(800.0, 1250.0, uWallT)*(0.9+0.1*hb)*(1.0+0.05*sat(p.z*0.2));\n      emitWall = blackbody(T)*pow(uWallT,2.2)*(0.5+0.5*sat(p.z*0.15))*(h.y==4.0?0.5:1.0);\n      vec3 ev = voronoiB(vec3(p.xz*9.0, uTime*0.1));\n      emitWall += vec3(1.0,0.25,0.04)*uEmber*1.5*step(h.y,3.5)*step(2.5,h.y)*smoothstep(0.35,0.1,ev.z)*step(0.6,ev.y)*smoothstep(0.3,0.7,vnoise(p*2.0));\n    }\n    // lighting: fire as a big warm light from behind/below, door daylight from the camera side\n    vec3 fireL = normalize(vec3(0.0, 0.35, 1.0));\n    vec3 fireC = blackbody(1350.0)*uFire*2.5;\n    vec3 doorL = normalize(vec3(0.3, 0.45, -1.0));\n    vec3 doorC = vec3(0.7,0.8,1.0)*uDoor*1.8;\n    float nv = sat(dot(s.cn,v));\n    float Fc = s.coat*F_Schlick1(0.04,nv);\n    vec3 amb = kilnEnv(s.n)*0.8;\n    vec3 dif = s.alb*(1.0-Fc)*(fireC*sat(dot(s.n,fireL)*0.6+0.4) + doorC*sat(dot(s.n,doorL)) + amb);\n    vec3 sp = specGGX(s.n, v, fireL, s.rough, s.f0)*fireC + specGGX(s.n, v, doorL, s.rough, s.f0)*doorC;\n    vec3 coat = s.coat*(specGGX(s.cn, v, fireL, s.coatRough, vec3(0.04))*fireC + specGGX(s.cn, v, doorL, s.coatRough, vec3(0.04))*doorC\n                        + kilnEnv(reflect(-v,s.cn))*F_Schlick1(0.04,nv)*2.0);\n    col = dif + sp + coat + s.emit + emitWall;\n  } else t = 30.0;\n\n  // volumetric fire (emission + absorption)\n  if(uFire>0.01){\n    float tEnd = min(t, 14.0);\n    const int N = 26;\n    float dt = tEnd/float(N);\n    float tt = dt*ign(gl_FragCoord.xy + fract(uTime*7.0)*61.0);\n    vec3 acc = vec3(0); float tr = 1.0; float dw = 0.0, dsum = 0.0;\n    for(int i=0;i<N;i++){\n      vec3 p = ro+rd*tt;\n      float d = fireDensity(p);\n      if(d>0.001){\n        float T = 1000.0 + 900.0*sat(d*1.6);\n        vec3 e = blackbody(T)*d*(0.4+d)*7.0;\n        acc += tr*e*dt;\n        float wl = tr*luma(e)*dt; dw += wl*tt; dsum += wl;\n        tr *= exp(-d*0.35*dt);\n      }\n      tt += dt;\n    }\n    col = col*tr + acc;\n    // depth for DOF: where the flames dominate, focus on them\n    if(dsum>1e-4) t = mix(dw/dsum, t, sat(tr*1.5));\n  }\n  // ash / sparks: drifting toward the camera\n  float sparks = uFire*0.9 + uEmber*0.2;\n  if(sparks>0.01){\n    for(int l=0;l<5;l++){\n      float z = 1.0+float(l)*1.3;\n      if(z>t) break;\n      vec3 p = ro+rd*z;\n      p.z += uTime*1.7; p.y -= uTime*0.35;\n      vec3 cell = floor(p*4.0);\n      vec3 hh = hash33(cell+float(l)*13.0);\n      vec3 spp = (cell+0.5+0.35*sin(hh*6.28+uTime*2.0))/4.0;\n      spp.z -= uTime*1.7; spp.y += uTime*0.35;\n      vec3 w = spp-ro; float tp = dot(w,rd);\n      float d = length(w-rd*tp);\n      if(hh.x>0.9) col += blackbody(1500.0+hh.y*600.0)*sparks*0.0015/(d*d*2500.0+0.002);\n    }\n  }\n  // door light haze\n  col += vec3(0.5,0.6,0.8)*uDoor*0.02*sat(-rd.z);\n  fragColor = vec4(col, t);\n}\n","seam":"#version 300 es\n// ---------------------------------------------------------------- common\nprecision highp float;\nprecision highp int;\n\nin vec2 vUv;\nuniform vec2  uRes;\nuniform float uTime;      // film time, seconds\nuniform float uLocal;     // scene-local time\nuniform vec3  uCamPos;\nuniform mat3  uCamRot;\nuniform float uFov;       // tan(fov/2)\nuniform vec2  uJitter;    // subpixel jitter in pixels\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n\nfloat sat(float x){ return clamp(x,0.,1.); }\nvec3  sat(vec3 x){ return clamp(x,0.,1.); }\nfloat sq(float x){ return x*x; }\nfloat lin(float a,float b,float x){ return sat((x-a)/(b-a)); }\nmat2  rot(float a){ float c=cos(a),s=sin(a); return mat2(c,s,-s,c); }\n\n// ---- hashing (integer based, stable across GPUs)\nuint hashu(uint x){ x ^= x>>16; x *= 0x7feb352du; x ^= x>>15; x *= 0x846ca68bu; x ^= x>>16; return x; }\nfloat hash11(float p){ return float(hashu(floatBitsToUint(p)))*(1.0/4294967296.0); }\nfloat hash12(vec2 p){ uvec2 q = uvec2(ivec2(floor(p))); return float(hashu(q.x ^ hashu(q.y + 0x9e3779b9u)))*(1.0/4294967296.0); }\nfloat hash13(vec3 p){ uvec3 q = uvec3(ivec3(floor(p))); return float(hashu(q.x ^ hashu(q.y ^ hashu(q.z + 0x632be5abu))))*(1.0/4294967296.0); }\nvec3  hash33(vec3 p){\n  uvec3 q = uvec3(ivec3(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y ^ hashu(q.z)));\n  return vec3(float(h), float(hashu(h)), float(hashu(h+1u)))*(1.0/4294967296.0);\n}\nvec2  hash22(vec2 p){\n  uvec2 q = uvec2(ivec2(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y));\n  return vec2(float(h), float(hashu(h)))*(1.0/4294967296.0);\n}\n// screen-space blue-ish noise for dithering / jittering ray starts\nfloat ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056,0.00583715)))); }\n\n// ---- value noise\nfloat vnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*(3.0-2.0*f);\n  float a=hash13(i), b=hash13(i+vec3(1,0,0)), c=hash13(i+vec3(0,1,0)), d=hash13(i+vec3(1,1,0));\n  float e=hash13(i+vec3(0,0,1)), f1=hash13(i+vec3(1,0,1)), g=hash13(i+vec3(0,1,1)), h=hash13(i+vec3(1,1,1));\n  return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y), mix(mix(e,f1,u.x),mix(g,h,u.x),u.y), u.z);\n}\nfloat vnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*(3.0-2.0*f);\n  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y);\n}\n// gradient noise (signed, -1..1)\nfloat gnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash33(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(mix(G(vec3(0,0,0)),G(vec3(1,0,0)),u.x), mix(G(vec3(0,1,0)),G(vec3(1,1,0)),u.x),u.y),\n                mix(mix(G(vec3(0,0,1)),G(vec3(1,0,1)),u.x), mix(G(vec3(0,1,1)),G(vec3(1,1,1)),u.x),u.y),u.z);\n  #undef G\n  return r*1.6;\n}\nfloat gnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash22(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(G(vec2(0,0)),G(vec2(1,0)),u.x), mix(G(vec2(0,1)),G(vec2(1,1)),u.x), u.y);\n  #undef G\n  return r*1.4;\n}\nfloat fbm(vec3 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=p*2.03+vec3(17.1,-3.7,9.2); a*=0.5; }\n  return s;\n}\nfloat fbm(vec2 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,7.7); a*=0.5; }\n  return s;\n}\n\n// Voronoi with true border distance (iq). Returns (border distance, cell id hash, F1)\nvec3 voronoiB(vec3 x){\n  vec3 p=floor(x), f=fract(x);\n  vec3 mb; vec3 mr; float md=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=mb+vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    vec3 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash13(p+mb+vec3(7.0)), sqrt(md));\n}\nvec3 voronoiB(vec2 x){\n  vec2 p=floor(x), f=fract(x);\n  vec2 mb; vec2 mr; float md=8.0;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec2 b=vec2(i,j); vec2 r=b+hash22(p+b)-f; float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){\n    vec2 b=mb+vec2(i,j); vec2 r=b+hash22(p+b)-f; vec2 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash12(p+mb+vec2(7.0)), sqrt(md));\n}\n\n// ---- SDF helpers\nfloat smin(float a,float b,float k){ float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*0.25; }\nfloat smax(float a,float b,float k){ return -smin(-a,-b,k); }\nfloat sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }\nfloat sdBox(vec2 p, vec2 b){ vec2 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,q.y),0.0); }\nfloat sdRBox(vec3 p, vec3 b, float r){ return sdBox(p,b-r)-r; }\nfloat sdCyl(vec3 p, float r, float h){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }\nfloat sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=sat(dot(pa,ba)/dot(ba,ba)); return length(pa-ba*h); }\n\n// ---- camera\nvec3 camRay(vec2 frag){\n  vec2 uv = (2.0*(frag+uJitter)-uRes)/uRes.y;\n  return normalize(uCamRot*vec3(uv*uFov, 1.0));\n}\n\n// ---- colour\nvec3 blackbody(float t){ // t in Kelvin, returns linear rgb (normalised-ish)\n  t = clamp(t, 800.0, 12000.0)/100.0;\n  vec3 c;\n  c.r = t<=66.0 ? 1.0 : 1.292936*pow(t-60.0,-0.1332047592);\n  c.g = t<=66.0 ? 0.3900815*log(t)-0.6318414 : 1.129890*pow(t-60.0,-0.0755148492);\n  c.b = t>=66.0 ? 1.0 : (t<=19.0 ? 0.0 : 0.5432068*log(t-10.0)-1.1962541);\n  return pow(sat(c), vec3(2.2));\n}\nfloat luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }\n\n// ---- BRDF\nfloat D_GGX(float nh, float a){ float a2=a*a; float d=nh*nh*(a2-1.0)+1.0; return a2/(PI*d*d); }\nfloat V_SmithJ(float nv, float nl, float a){ float a2=a*a;\n  float gv=nl*sqrt(nv*nv*(1.0-a2)+a2), gl=nv*sqrt(nl*nl*(1.0-a2)+a2); return 0.5/max(gv+gl,1e-5); }\nvec3  F_Schlick(vec3 f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\nfloat F_Schlick1(float f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\n// returns specular (already multiplied by nl)\nvec3 specGGX(vec3 n, vec3 v, vec3 l, float rough, vec3 f0){\n  vec3 h=normalize(v+l);\n  float nl=sat(dot(n,l)), nv=max(dot(n,v),1e-4), nh=sat(dot(n,h)), vh=sat(dot(v,h));\n  float a=max(rough*rough,0.002);\n  return D_GGX(nh,a)*V_SmithJ(nv,nl,a)*F_Schlick(f0,vh)*nl;\n}\n// analytic env-BRDF approximation (Karis)\nvec2 envBRDF(float nv, float rough){\n  vec4 c0=vec4(-1,-0.0275,-0.572,0.022), c1=vec4(1,0.0425,1.04,-0.04);\n  vec4 r=rough*c0+c1; float a004=min(r.x*r.x,exp2(-9.28*nv))*r.x+r.y;\n  return vec2(-1.04,1.04)*a004+r.zw;\n}\n\n// ---------------------------------------------------------------- bowl\n// Units: 1.0 = 10 cm. Bowl local space: foot rests on y=0, axis is +y.\n#define NPROF 16\nuniform vec4  uProf[NPROF];   // centerline (r, y), half thickness, unused\nuniform vec4  uFoot;          // foot ring stroke: r0,y0,r1,y1\nuniform float uFootTh;        // foot half thickness (0 = none)\nuniform float uWobble;        // rim wobble amplitude\nuniform float uOval;          // ovality\nuniform float uRidge;         // throwing ridge amplitude\nuniform float uSpin;          // wheel angle (radians), rotates surface detail\n\n// material state\nuniform float uWet;       // 1 = wet thrown clay\nuniform float uDry;       // 0..1 wet->leather->bone dry\nuniform float uGlazeRaw;  // raw glaze slip coverage (matte)\nuniform float uMelt;      // glaze melted (glossy)\nuniform float uHeat;      // incandescence 0..1\nuniform float uAsh;       // natural ash deposit\nuniform float uCrackle;   // crackle network visibility\nuniform float uStain;     // tea stain in crackle\nuniform float uGold;      // kintsugi seams\nuniform float uTeaLevel;  // tea fill 0..1 (0 = empty)\nuniform float uFroth;     // matcha froth amount\n\n// fracture / seam network\n#define NSEED 14\nuniform vec4 uSeeds[NSEED]; // xyz seed on bowl surface (local), w unused\n\nstruct BowlHit { float d; float side; float s; vec2 nDelta; };\n\nvec2 segPerp(int i){ vec2 b=normalize(uProf[i+1].xy-uProf[i].xy); return vec2(-b.y, b.x); }\n\n// distance-only version for marching\nfloat bowlProfileD(vec2 q){\n  float d = 1e5;\n  for(int i=0;i<NPROF-1;i++){\n    vec2 a=uProf[i].xy, ba=uProf[i+1].xy-a, pa=q-a;\n    float t=sat(dot(pa,ba)/dot(ba,ba));\n    d=min(d, length(pa-ba*t)-mix(uProf[i].z, uProf[i+1].z, t));\n  }\n  return d;\n}\n\n// full version: side (+1 inside the cavity, -1 outside), arc parameter, and the\n// correction that turns faceted polyline normals into smooth (Phong-like) ones\nBowlHit bowlProfile(vec2 q){\n  BowlHit h; h.d = 1e5; h.side = 0.0; h.s = 0.0; h.nDelta=vec2(0);\n  float acc = 0.0, total = 0.0;\n  for(int i=0;i<NPROF-1;i++) total += length(uProf[i+1].xy-uProf[i].xy);\n  int bi=0; float bt=0.0;\n  for(int i=0;i<NPROF-1;i++){\n    vec2 a=uProf[i].xy, b=uProf[i+1].xy;\n    vec2 pa=q-a, ba=b-a;\n    float L = length(ba);\n    float t=sat(dot(pa,ba)/(L*L));\n    float th=mix(uProf[i].z, uProf[i+1].z, t);\n    float d=length(pa-ba*t)-th;\n    if(d<h.d){ h.d=d; h.side = (pa.x*ba.y-pa.y*ba.x) < 0.0 ? 1.0 : -1.0; h.s=(acc+t*L)/total; bi=i; bt=t; }\n    acc += L;\n  }\n  if(bt>0.0 && bt<1.0){\n    vec2 pf = segPerp(bi);\n    vec2 n0 = bi>0 ? normalize(segPerp(bi-1)+pf) : pf;\n    vec2 n1 = bi<NPROF-2 ? normalize(segPerp(bi+1)+pf) : pf;\n    vec2 ns = normalize(mix(n0,n1,bt));\n    h.nDelta = (ns-pf)*h.side;\n  }\n  return h;\n}\n\nvec2 bowlQ(vec3 p){\n  float a = atan(p.z,p.x);\n  float r = length(p.xz);\n  r *= 1.0 + uOval*cos(2.0*a-1.4);\n  float rim = smoothstep(0.25,0.75,p.y);\n  float y = p.y - uWobble*rim*(0.55*sin(a*2.0+1.3)+0.3*sin(a*5.0+4.0)+0.15*sin(a*9.0+0.5));\n  return vec2(r, y);\n}\n\nfloat sdBowl(vec3 p){\n  vec2 q = bowlQ(p);\n  float d = bowlProfileD(q);\n  if(uFootTh>0.0){\n    float th = uFootTh;\n    float df = sdSeg(q, uFoot.xy, uFoot.zw) - th;\n    d = smin(d, df, 0.03);\n  }\n  // throwing ridges (spiral rings)\n  d -= uRidge*sin(q.y*70.0 + 0.6*sin(q.y*9.0))*smoothstep(0.02,0.1,q.y);\n  return d;\n}\n\n// full info at a surface point (called once per hit)\nBowlHit bowlInfo(vec3 p){\n  vec2 q = bowlQ(p);\n  BowlHit h = bowlProfile(q);\n  if(uFootTh>0.0){\n    float df = sdSeg(q, uFoot.xy, uFoot.zw) - uFootTh;\n    if(df < h.d + 0.012){ h.side = -2.0; h.nDelta = vec2(0); } // foot ring: unglazed\n  }\n  return h;\n}\n\n// Fracture warp: cheap analytic wobble so the same cells can be marched per shard.\n// (Mirrored exactly in bowl.js for CPU-side centroids.)\nvec3 fracWarp(vec3 p){\n  return p + 0.030*sin(p.zxy*9.1+vec3(1.3,4.1,2.7))\n           + 0.012*sin(p.yzx*23.7+vec3(0.4,2.2,5.1))\n           + 0.005*sin(p.zxy*61.0+vec3(2.9,0.7,4.4));\n}\n\n// Warped Voronoi on the fixed fracture seeds. Returns (border distance, cell index, second index)\nvec3 seamField(vec3 p){\n  vec3 w = fracWarp(p);\n  float d1=1e5, d2=1e5; int i1=0, i2=0;\n  for(int i=0;i<NSEED;i++){\n    vec3 r = w-uSeeds[i].xyz;\n    float d = dot(r,r);\n    if(d<d1){ d2=d1; i2=i1; d1=d; i1=i; } else if(d<d2){ d2=d; i2=i; }\n  }\n  vec3 s1=uSeeds[i1].xyz, s2=uSeeds[i2].xyz;\n  float bd = (d2-d1)/(2.0*length(s2-s1));\n  return vec3(bd, float(i1), float(i2));\n}\n\n// signed distance (in warped space) to the boundary of cell i: <0 inside\nfloat cellDist(vec3 p, int i){\n  vec3 w = fracWarp(p);\n  vec3 si = uSeeds[i].xyz;\n  float di = dot(w-si,w-si);\n  float d = -1e5;\n  for(int j=0;j<NSEED;j++){\n    if(j==i) continue;\n    vec3 sj = uSeeds[j].xyz;\n    float dj = dot(w-sj,w-sj);\n    d = max(d, (di-dj)/(2.0*length(sj-si)));\n  }\n  return d;\n}\n\n// glaze thickness 0..~2 on the surface\nfloat glazeThickness(vec3 p, BowlHit h){\n  float a = atan(p.z,p.x);\n  if(h.side < -1.5) return 0.0;              // foot\n  float s = h.s;\n  float t;\n  if(h.side > 0.0){\n    // interior: pools in the well\n    t = 0.75 + 1.1*smoothstep(0.42,0.05,s) ;\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);     // thins over the rim\n  } else {\n    // exterior: glaze line with drips\n    float line = 0.46 + 0.04*gnoise(vec2(a*2.0,1.7));\n    float drip = pow(sat(gnoise(vec2(a*7.0, 3.1))*0.5+0.5), 5.0)*0.28\n               + pow(sat(gnoise(vec2(a*19.0, 8.3))*0.5+0.5), 8.0)*0.18;\n    float edge = line - drip;\n    float cov = smoothstep(edge-0.004, edge+0.01, s);\n    // thick roll at the drip end, thinning toward the rim\n    t = cov*(0.7 + 1.1*exp(-max(s-edge,0.0)*28.0));\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);\n  }\n  // natural ash: heavier on one flank (facing the fire)\n  float ashSide = sat(0.5+0.5*cos(a-2.4))*smoothstep(0.35,0.85,s);\n  t += uAsh*ashSide*(0.6+0.8*sat(gnoise(p*14.0)+0.3));\n  return t;\n}\n\n// ---------------------------------------------------------------- bowl material\nstruct Surf {\n  vec3 alb;      // diffuse albedo (base, under coat)\n  vec3 f0;       // base specular reflectance (metals)\n  float rough;   // base roughness\n  float coat;    // clear coat (glaze / water film) strength 0..1\n  float coatRough;\n  vec3 n;        // base normal\n  vec3 cn;       // coat normal\n  vec3 emit;\n  float sss;     // wrap / translucency amount\n};\n\nSurf defaultSurf(vec3 n){\n  Surf s; s.alb=vec3(0.5); s.f0=vec3(0.04); s.rough=0.8; s.coat=0.0; s.coatRough=0.1;\n  s.n=n; s.cn=n; s.emit=vec3(0); s.sss=0.0; return s;\n}\n\nvec3 rotYv(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x-s*p.z, p.y, s*p.x+c*p.z); }\n\n// perturb normal with a scalar height function's numerical gradient projected on the surface\n#define BUMP(n, P, F, EPS, AMT) { \\\n  vec3 _e=vec3(EPS,0,0); float _h0=F(P); \\\n  vec3 _g=vec3(F(P+_e.xyy)-_h0, F(P+_e.yxy)-_h0, F(P+_e.yyx)-_h0)/EPS; \\\n  _g-=n*dot(_g,n); n=normalize(n-AMT*_g); }\n\nfloat clayGrain(vec3 p){ return gnoise(p*140.0)*0.5+gnoise(p*330.0)*0.25; }\nfloat glazeRipple(vec3 p){ return gnoise(p*22.0)+0.35*gnoise(p*61.0); }\n\nSurf bowlSurface(vec3 p, vec3 n, vec3 v){\n  Surf s = defaultSurf(n);\n  BowlHit h = bowlInfo(p);\n  { vec2 dr = normalize(p.xz+1e-6); n = normalize(n + vec3(dr.x*h.nDelta.x, h.nDelta.y, dr.y*h.nDelta.x)); s.n=n; s.cn=n; }\n  vec3 pr = rotYv(p, uSpin);            // detail rotating with the wheel\n  float a = atan(pr.z, pr.x);\n\n  // ---------- clay body\n  float speck = smoothstep(0.86, 0.95, vnoise(pr*80.0)) * 0.7;\n  float grain = clayGrain(pr);\n  vec3 fired = vec3(0.50,0.44,0.37)*(0.92+0.1*grain);\n  fired = mix(fired, vec3(0.18,0.09,0.05), speck);\n  // flashing on the unglazed foot / exposed body\n  float flash = sat(0.5+0.8*gnoise(pr*4.0+3.0));\n  vec3 footCol = mix(fired, vec3(0.58,0.30,0.14), 0.55*flash);\n\n  // unfired clay (wet -> dry)\n  vec3 wetCol = vec3(0.19,0.10,0.065);\n  vec3 dryCol = vec3(0.60,0.53,0.46)*(0.95+0.08*grain);\n  vec3 raw = mix(wetCol, dryCol, smoothstep(0.0,1.0,uDry));\n  float slurry = sat(0.5+0.9*gnoise(vec3(a*6.0, pr.y*38.0, 0.0)));\n\n  float firedAmt = max(uMelt, uHeat);\n  // iron shows through where the glaze thins over the rim: a warm brown lip, not raw grain\n  fired = mix(fired, vec3(0.30,0.19,0.12)*(0.95+0.05*grain), smoothstep(0.9, 0.995, h.s)*0.85);\n  vec3 body = mix(raw, h.side<-1.5 ? footCol : fired, sat(firedAmt*1.5));\n  s.alb = body;\n  s.rough = 0.85;\n  BUMP(s.n, pr, clayGrain, 0.002, 0.00025*(1.0-0.8*uMelt));\n\n  // ---------- wet film\n  if(uWet>0.0){\n    float film = uWet*(0.55+0.45*slurry);\n    s.coat = film;\n    s.coatRough = mix(0.32, 0.12, slurry);\n    s.alb = mix(s.alb, s.alb*0.7, film);\n    s.cn = n;\n    // throwing lines in the film\n    vec3 nn = n;\n    float lines = sin(p.y*140.0+2.0*gnoise(vec3(a*3.0,p.y*10.0,0.0)));\n    nn = normalize(nn + 0.08*uWet*lines*vec3(0,1,0));\n    s.cn = nn;\n  }\n\n  // ---------- glaze\n  float t = glazeThickness(p, h);\n  float rawCov = smoothstep(1.02-uGlazeRaw*1.1, 1.04-uGlazeRaw*1.1, h.s)*step(0.001,uGlazeRaw);\n  float cov = sat(t*4.0)*max(rawCov, uMelt);\n  if(cov>0.0){\n    // raw slip (unfired glaze powder)\n    vec3 slip = vec3(0.70,0.72,0.70)*(0.95+0.08*grain);\n    float rawAmt = rawCov*(1.0-uMelt);\n    // melted celadon: Beer-Lambert over the body + milky scatter\n    vec3 sigma = vec3(0.62,0.26,0.33);\n    float tt = t*(1.0+0.15*gnoise(p*7.0));\n    vec3 trans = exp(-sigma*tt*1.6);\n    vec3 milk = vec3(0.55,0.72,0.66);\n    float scat = 1.0-exp(-tt*0.9);\n    vec3 glazeCol = mix(body*trans*1.15, milk*mix(vec3(1.0),trans,0.5), scat*0.72);\n    // ash: greener glassy runs\n    glazeCol = mix(glazeCol, vec3(0.30,0.42,0.22)*trans*1.4, sat(uAsh*(t-0.9)*0.9));\n    // iron specks bleed through\n    glazeCol = mix(glazeCol, vec3(0.22,0.13,0.07), speck*0.5*exp(-tt*1.2));\n\n    // crackle network (two scales, only in glaze)\n    float crk = 0.0;\n    if(uCrackle>0.0){\n      vec3 wp = p + 0.02*vec3(gnoise(p*13.0), gnoise(p*13.0+7.0), gnoise(p*13.0+3.0));\n      vec3 c1 = voronoiB(wp*vec3(5.5,7.0,5.5)+vec3(3.0));\n      vec3 c2 = voronoiB(wp*15.0+vec3(1.3));\n      float l1 = 1.0-smoothstep(0.004, 0.016, c1.x);\n      float l2 = (1.0-smoothstep(0.004, 0.02, c2.x))*0.45;\n      float reveal = smoothstep(c1.y*0.8, c1.y*0.8+0.2, uCrackle);\n      crk = max(l1*reveal, l2*smoothstep(0.4,1.0,uCrackle)*step(0.55,c2.y));\n      crk *= 0.55+0.45*sat(gnoise(p*5.0)+0.5);\n      vec3 crackCol = mix(glazeCol*1.4+0.06, vec3(0.28,0.16,0.07), uStain*(h.side>0.0?1.0:0.6));\n      glazeCol = mix(glazeCol, crackCol, crk*0.8);\n    }\n\n    vec3 glazed = glazeCol;\n    s.alb = mix(s.alb, mix(glazed, slip, rawAmt), cov);\n    s.rough = mix(s.rough, 0.9, cov*rawAmt);\n    // melted glaze is a clear coat\n    float coat = cov*uMelt;\n    s.coat = max(s.coat, coat);\n    s.coatRough = mix(s.coatRough, 0.045, coat);\n    vec3 cn = n;\n    BUMP(cn, p, glazeRipple, 0.004, 0.0004*uMelt);\n    s.cn = normalize(mix(s.cn, cn, coat));\n    s.sss = 0.35*coat*scat;\n  }\n\n  // ---------- tea stain on the unglazed foot over years\n  s.alb *= 1.0 - 0.15*uStain*step(h.side,-1.5);\n\n  // ---------- incandescence\n  if(uHeat>0.0){\n    float T = mix(800.0, 1330.0, uHeat);\n    s.emit = blackbody(T)*pow(uHeat,2.2)*2.5*(0.85+0.15*grain);\n  }\n\n  // ---------- kintsugi gold\n  if(uGold>0.0){\n    vec3 sf = seamField(p);\n    float w = 0.0075*(0.75+0.5*sat(gnoise(p*6.0)*0.5+0.5));\n    float g = 1.0-smoothstep(w*0.75, w, sf.x);\n    g *= uGold;\n    if(g>0.0){\n      vec3 e = normalize(uSeeds[int(sf.z)].xyz-uSeeds[int(sf.y)].xyz);\n      float x = sat(sf.x/w);\n      float slope = -0.9*x/sqrt(max(1.0-x*x,0.02));\n      vec3 et = normalize(e - n*dot(e,n));\n      vec3 gn = normalize(n + slope*et*0.6);\n      float burnish = sat(0.5+0.8*gnoise(p*40.0));\n      s.alb = mix(s.alb, vec3(0.0), g);\n      s.f0 = mix(s.f0, vec3(1.0,0.74,0.32), g);\n      s.rough = mix(s.rough, mix(0.34,0.14,burnish), g);\n      s.coat = mix(s.coat, 0.0, g);\n      s.n = normalize(mix(s.n, gn, g));\n      s.cn = s.n;\n    }\n  }\n  return s;\n}\n\n// ---------------------------------------------------------------- scene: THE SEAM\n// A continuous zoom from millimetres to the whole bowl. The cracks are real\n// geometry (thin canyons carved through the wall); molten gold flows along them\n// from the point of impact and cools into the kintsugi seams.\nuniform float uGap;        // half-width of the crack canyon (0 = closed)\nuniform float uFlow;       // gold front distance from the source\nuniform vec3  uSource;     // where the gold starts (bowl local)\nuniform float uCool;       // how far behind the front the gold cools\nuniform vec3  uKeyDir;\nuniform float uRoomLight;  // 0 void rig, 1 morning room light (end of scene)\nuniform float uAlt;        // camera altitude (for detail LOD)\nout vec4 fragColor;\n\n// seam field restricted to near the bowl\nfloat crackD(vec3 p, out float bd){\n  vec3 sf = seamField(p);\n  bd = sf.x;\n  return sf.x;\n}\n\n// ids: 1 glaze/body, 2 gold\nvec2 seamMap(vec3 p){\n  float b = sdBowl(p);\n  if(b > 0.03) return vec2(b, 1.0);\n  float bd = seamField(p).x;\n  // rough fracture walls\n  float rough = 0.0;\n  if(bd < uGap*4.0+0.004) rough = 0.00045*gnoise(p*900.0) + 0.0012*gnoise(p*260.0);\n  float wall = (uGap + rough) - bd;          // >0 inside the canyon\n  float d = max(b, wall*0.9);\n  vec2 r = vec2(d, 1.0);\n  // gold: fills the canyon and domes slightly above the glaze\n  float front = length(p-uSource) - uFlow;\n  float gw = uGap + 0.0028 + 0.0012*gnoise(p*120.0);\n  float g = max(max(bd - gw, b - 0.0007), front);\n  if(g < r.x) r = vec2(g, 2.0);\n  return r;\n}\n\nfloat macroRipple(vec3 p){ return gnoise(p*180.0)*0.6 + gnoise(p*520.0)*0.25; }\n\nvec3 seamNormal(vec3 p, float eps){\n  const vec2 k = vec2(1,-1);\n  return normalize(k.xyy*seamMap(p+k.xyy*eps).x + k.yyx*seamMap(p+k.yyx*eps).x +\n                   k.yxy*seamMap(p+k.yxy*eps).x + k.xxx*seamMap(p+k.xxx*eps).x);\n}\n\nfloat seamShadow(vec3 ro, vec3 rd, float k, float scale){\n  float res = 1.0, t = scale*0.02;\n  for(int i=0;i<40;i++){\n    float h = seamMap(ro+rd*t).x;\n    res = min(res, k*h/t);\n    t += clamp(h, scale*0.01, scale*0.5);\n    if(res<0.003 || t>scale*40.0) break;\n  }\n  return sat(res);\n}\n\nvec3 envSeam(vec3 d){\n  vec3 dark = mix(vec3(0.004,0.004,0.006), vec3(0.012,0.010,0.009), d.y*0.5+0.5);\n  // a warm horizon, like the light of the gold itself, and one large soft key\n  dark += vec3(1.0,0.55,0.25)*0.35*exp(-abs(d.y-0.02)*7.0)*(0.55+0.45*d.z);\n  vec3 kd = normalize(uKeyDir);\n  float k = dot(d, kd);\n  dark += vec3(1.0,0.85,0.66)*(9.0*smoothstep(0.994,0.9985,k) + 0.5*pow(sat(k),24.0));\n  dark += vec3(0.6,0.62,0.7)*0.06*sat(d.y);\n  // morning room: warm window glow from +z, soft sky\n  vec3 room = mix(vec3(0.06,0.05,0.045), vec3(0.5,0.48,0.45), smoothstep(-0.2,0.6,d.z)*smoothstep(-0.3,0.4,d.y));\n  room += vec3(2.5,2.2,1.8)*smoothstep(0.75,0.95,d.z)*smoothstep(-0.1,0.2,d.y)*smoothstep(0.7,0.3,d.y);\n  return mix(dark, room, uRoomLight);\n}\n\nvoid main(){\n  vec3 ro = uCamPos, rd = camRay(gl_FragCoord.xy);\n  float scale = max(uAlt, 0.0015);\n  float t = 0.0; vec2 h = vec2(0); bool hit = false;\n  // bounding sphere of the bowl\n  vec3 oc = ro-vec3(0,0.36,0);\n  float bb = dot(oc,rd), cc = dot(oc,oc)-0.72*0.72, disc = bb*bb-cc;\n  if(disc>0.0){\n    t = max(-bb-sqrt(disc), 0.0);\n    float tend = -bb+sqrt(disc);\n    for(int i=0;i<180;i++){\n      h = seamMap(ro+rd*t);\n      if(h.x < 0.00025*t + scale*0.0015){ hit = true; break; }\n      t += h.x*0.8;\n      if(t>tend) break;\n    }\n  }\n  vec3 col = envSeam(rd);\n  float depth = 1e3;\n  if(hit){\n    vec3 p = ro+rd*t;\n    float eps = max(0.00012, t*0.0008);\n    vec3 n = seamNormal(p, eps);\n    vec3 v = -rd;\n    vec3 L = normalize(uKeyDir);\n    vec3 key = mix(vec3(1.0,0.85,0.66)*2.2, vec3(1.0,0.9,0.75)*3.0, uRoomLight);\n    float bd = seamField(p).x;\n    // light from the molten gold nearby (canyon glow)\n    float front = length(p-uSource) - uFlow;\n    float behind = -front;\n    float molten = sat(1.0 - behind/max(uCool,1e-3));\n    vec3 goldGlow = vec3(1.0,0.5,0.14)*5.0*molten*step(front,0.0);\n    float nearGold = exp(-max(bd-uGap,0.0)/(scale*0.6+0.0015));\n    float sh = seamShadow(p+n*eps*2.0, L, 10.0, max(scale,0.02));\n    if(h.y==2.0){\n      // gold: molten (emissive, rippling) cooling to burnished metal\n      Surf s = defaultSurf(n);\n      vec3 rip = vec3(gnoise(p*400.0+uTime*0.8), 0.0, gnoise(p*400.0+7.0-uTime*0.6))*0.25*molten;\n      s.n = normalize(n + rip);\n      s.alb = vec3(0.0); s.f0 = vec3(1.0,0.74,0.32); s.rough = mix(0.18, 0.35, molten);\n      float nv = sat(dot(s.n,v));\n      vec3 spec = specGGX(s.n, v, L, s.rough, s.f0)*key*sh;\n      vec2 eb = envBRDF(nv, s.rough);\n      spec += envSeam(reflect(-v,s.n))*(s.f0*eb.x+eb.y)*1.5;\n      col = spec + goldGlow*0.25*(0.5+0.5*gnoise(p*300.0-uTime))*molten + vec3(1.0,0.42,0.08)*molten*molten*0.7;\n    } else {\n      float b = sdBowl(p);\n      bool wallFace = (bd < uGap + 0.003) && b < -0.0004;\n      Surf s;\n      if(!wallFace){\n        s = bowlSurface(p, n, v);\n        // macro detail on the glaze: fine ripples and pinholes\n        if(scale < 0.08){\n          float det = 1.0-smoothstep(0.02,0.08,scale);\n          vec3 cn = s.cn;\n          BUMP(cn, p, macroRipple, 0.0003, 0.0009*det);\n          float pin = smoothstep(0.08,0.0,voronoiB(p*350.0).z)*step(0.85,hash13(floor(p*350.0)));\n          s.cn = normalize(cn + (hash33(floor(p*350.0))-0.5)*pin*0.6*det);\n        }\n      } else {\n        // fracture wall: fired clay body, the glaze a glassy band at the lip\n        s = defaultSurf(n);\n        float grain = gnoise(p*700.0)*0.5+gnoise(p*2100.0)*0.25;\n        s.alb = vec3(0.62,0.55,0.46)*(0.85+0.25*grain);\n        s.alb = mix(s.alb, vec3(0.22,0.12,0.07), smoothstep(0.75,0.95,vnoise(p*500.0))*0.6);\n        float depthIn = -b;\n        s.alb = mix(s.alb, vec3(0.42,0.6,0.54), smoothstep(0.012,0.006,depthIn)*0.85);\n        s.rough = 0.85;\n      }\n      float nl = sat(dot(s.n,L));\n      float nv = sat(dot(s.cn,v));\n      float Fc = s.coat*F_Schlick1(0.04,nv);\n      vec3 amb = envSeam(s.n)*0.9 + vec3(0.02,0.022,0.03)*(1.0-uRoomLight);\n      col = s.alb*(1.0-Fc)*(key*nl*sh + amb + goldGlow*nearGold*0.35)\n          + s.coat*(specGGX(s.cn, v, L, s.coatRough, vec3(0.04))*key*sh + envSeam(reflect(-v,s.cn))*F_Schlick1(0.04,nv))\n          + specGGX(s.n, v, L, s.rough, s.f0)*key*sh;\n      // subsurface: glaze glows with gold light nearby\n      col += vec3(0.8,0.6,0.25)*s.coat*nearGold*molten*0.25*step(front, 0.02);\n    }\n    depth = t;\n  }\n  fragColor = vec4(col, depth);\n}\n","break":"#version 300 es\n// ---------------------------------------------------------------- common\nprecision highp float;\nprecision highp int;\n\nin vec2 vUv;\nuniform vec2  uRes;\nuniform float uTime;      // film time, seconds\nuniform float uLocal;     // scene-local time\nuniform vec3  uCamPos;\nuniform mat3  uCamRot;\nuniform float uFov;       // tan(fov/2)\nuniform vec2  uJitter;    // subpixel jitter in pixels\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n\nfloat sat(float x){ return clamp(x,0.,1.); }\nvec3  sat(vec3 x){ return clamp(x,0.,1.); }\nfloat sq(float x){ return x*x; }\nfloat lin(float a,float b,float x){ return sat((x-a)/(b-a)); }\nmat2  rot(float a){ float c=cos(a),s=sin(a); return mat2(c,s,-s,c); }\n\n// ---- hashing (integer based, stable across GPUs)\nuint hashu(uint x){ x ^= x>>16; x *= 0x7feb352du; x ^= x>>15; x *= 0x846ca68bu; x ^= x>>16; return x; }\nfloat hash11(float p){ return float(hashu(floatBitsToUint(p)))*(1.0/4294967296.0); }\nfloat hash12(vec2 p){ uvec2 q = uvec2(ivec2(floor(p))); return float(hashu(q.x ^ hashu(q.y + 0x9e3779b9u)))*(1.0/4294967296.0); }\nfloat hash13(vec3 p){ uvec3 q = uvec3(ivec3(floor(p))); return float(hashu(q.x ^ hashu(q.y ^ hashu(q.z + 0x632be5abu))))*(1.0/4294967296.0); }\nvec3  hash33(vec3 p){\n  uvec3 q = uvec3(ivec3(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y ^ hashu(q.z)));\n  return vec3(float(h), float(hashu(h)), float(hashu(h+1u)))*(1.0/4294967296.0);\n}\nvec2  hash22(vec2 p){\n  uvec2 q = uvec2(ivec2(floor(p)));\n  uint h = hashu(q.x ^ hashu(q.y));\n  return vec2(float(h), float(hashu(h)))*(1.0/4294967296.0);\n}\n// screen-space blue-ish noise for dithering / jittering ray starts\nfloat ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056,0.00583715)))); }\n\n// ---- value noise\nfloat vnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*(3.0-2.0*f);\n  float a=hash13(i), b=hash13(i+vec3(1,0,0)), c=hash13(i+vec3(0,1,0)), d=hash13(i+vec3(1,1,0));\n  float e=hash13(i+vec3(0,0,1)), f1=hash13(i+vec3(1,0,1)), g=hash13(i+vec3(0,1,1)), h=hash13(i+vec3(1,1,1));\n  return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y), mix(mix(e,f1,u.x),mix(g,h,u.x),u.y), u.z);\n}\nfloat vnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*(3.0-2.0*f);\n  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y);\n}\n// gradient noise (signed, -1..1)\nfloat gnoise(vec3 p){\n  vec3 i=floor(p), f=fract(p);\n  vec3 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash33(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(mix(G(vec3(0,0,0)),G(vec3(1,0,0)),u.x), mix(G(vec3(0,1,0)),G(vec3(1,1,0)),u.x),u.y),\n                mix(mix(G(vec3(0,0,1)),G(vec3(1,0,1)),u.x), mix(G(vec3(0,1,1)),G(vec3(1,1,1)),u.x),u.y),u.z);\n  #undef G\n  return r*1.6;\n}\nfloat gnoise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);\n  #define G(o) dot(hash22(i+o)*2.0-1.0, f-o)\n  float r = mix(mix(G(vec2(0,0)),G(vec2(1,0)),u.x), mix(G(vec2(0,1)),G(vec2(1,1)),u.x), u.y);\n  #undef G\n  return r*1.4;\n}\nfloat fbm(vec3 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=p*2.03+vec3(17.1,-3.7,9.2); a*=0.5; }\n  return s;\n}\nfloat fbm(vec2 p, int oct){\n  float s=0., a=0.5;\n  for(int i=0;i<8;i++){ if(i>=oct) break; s+=a*gnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,7.7); a*=0.5; }\n  return s;\n}\n\n// Voronoi with true border distance (iq). Returns (border distance, cell id hash, F1)\nvec3 voronoiB(vec3 x){\n  vec3 p=floor(x), f=fract(x);\n  vec3 mb; vec3 mr; float md=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec3 b=mb+vec3(i,j,k);\n    vec3 r=b+hash33(p+b)-f;\n    vec3 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash13(p+mb+vec3(7.0)), sqrt(md));\n}\nvec3 voronoiB(vec2 x){\n  vec2 p=floor(x), f=fract(x);\n  vec2 mb; vec2 mr; float md=8.0;\n  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){\n    vec2 b=vec2(i,j); vec2 r=b+hash22(p+b)-f; float d=dot(r,r);\n    if(d<md){ md=d; mr=r; mb=b; }\n  }\n  float bd=8.0;\n  for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){\n    vec2 b=mb+vec2(i,j); vec2 r=b+hash22(p+b)-f; vec2 dr=r-mr;\n    if(dot(dr,dr)>1e-5) bd=min(bd, dot(0.5*(mr+r), normalize(dr)));\n  }\n  return vec3(bd, hash12(p+mb+vec2(7.0)), sqrt(md));\n}\n\n// ---- SDF helpers\nfloat smin(float a,float b,float k){ float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*0.25; }\nfloat smax(float a,float b,float k){ return -smin(-a,-b,k); }\nfloat sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }\nfloat sdBox(vec2 p, vec2 b){ vec2 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,q.y),0.0); }\nfloat sdRBox(vec3 p, vec3 b, float r){ return sdBox(p,b-r)-r; }\nfloat sdCyl(vec3 p, float r, float h){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }\nfloat sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=sat(dot(pa,ba)/dot(ba,ba)); return length(pa-ba*h); }\n\n// ---- camera\nvec3 camRay(vec2 frag){\n  vec2 uv = (2.0*(frag+uJitter)-uRes)/uRes.y;\n  return normalize(uCamRot*vec3(uv*uFov, 1.0));\n}\n\n// ---- colour\nvec3 blackbody(float t){ // t in Kelvin, returns linear rgb (normalised-ish)\n  t = clamp(t, 800.0, 12000.0)/100.0;\n  vec3 c;\n  c.r = t<=66.0 ? 1.0 : 1.292936*pow(t-60.0,-0.1332047592);\n  c.g = t<=66.0 ? 0.3900815*log(t)-0.6318414 : 1.129890*pow(t-60.0,-0.0755148492);\n  c.b = t>=66.0 ? 1.0 : (t<=19.0 ? 0.0 : 0.5432068*log(t-10.0)-1.1962541);\n  return pow(sat(c), vec3(2.2));\n}\nfloat luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }\n\n// ---- BRDF\nfloat D_GGX(float nh, float a){ float a2=a*a; float d=nh*nh*(a2-1.0)+1.0; return a2/(PI*d*d); }\nfloat V_SmithJ(float nv, float nl, float a){ float a2=a*a;\n  float gv=nl*sqrt(nv*nv*(1.0-a2)+a2), gl=nv*sqrt(nl*nl*(1.0-a2)+a2); return 0.5/max(gv+gl,1e-5); }\nvec3  F_Schlick(vec3 f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\nfloat F_Schlick1(float f0, float vh){ return f0+(1.0-f0)*pow(1.0-vh,5.0); }\n// returns specular (already multiplied by nl)\nvec3 specGGX(vec3 n, vec3 v, vec3 l, float rough, vec3 f0){\n  vec3 h=normalize(v+l);\n  float nl=sat(dot(n,l)), nv=max(dot(n,v),1e-4), nh=sat(dot(n,h)), vh=sat(dot(v,h));\n  float a=max(rough*rough,0.002);\n  return D_GGX(nh,a)*V_SmithJ(nv,nl,a)*F_Schlick(f0,vh)*nl;\n}\n// analytic env-BRDF approximation (Karis)\nvec2 envBRDF(float nv, float rough){\n  vec4 c0=vec4(-1,-0.0275,-0.572,0.022), c1=vec4(1,0.0425,1.04,-0.04);\n  vec4 r=rough*c0+c1; float a004=min(r.x*r.x,exp2(-9.28*nv))*r.x+r.y;\n  return vec2(-1.04,1.04)*a004+r.zw;\n}\n\n// ---------------------------------------------------------------- bowl\n// Units: 1.0 = 10 cm. Bowl local space: foot rests on y=0, axis is +y.\n#define NPROF 16\nuniform vec4  uProf[NPROF];   // centerline (r, y), half thickness, unused\nuniform vec4  uFoot;          // foot ring stroke: r0,y0,r1,y1\nuniform float uFootTh;        // foot half thickness (0 = none)\nuniform float uWobble;        // rim wobble amplitude\nuniform float uOval;          // ovality\nuniform float uRidge;         // throwing ridge amplitude\nuniform float uSpin;          // wheel angle (radians), rotates surface detail\n\n// material state\nuniform float uWet;       // 1 = wet thrown clay\nuniform float uDry;       // 0..1 wet->leather->bone dry\nuniform float uGlazeRaw;  // raw glaze slip coverage (matte)\nuniform float uMelt;      // glaze melted (glossy)\nuniform float uHeat;      // incandescence 0..1\nuniform float uAsh;       // natural ash deposit\nuniform float uCrackle;   // crackle network visibility\nuniform float uStain;     // tea stain in crackle\nuniform float uGold;      // kintsugi seams\nuniform float uTeaLevel;  // tea fill 0..1 (0 = empty)\nuniform float uFroth;     // matcha froth amount\n\n// fracture / seam network\n#define NSEED 14\nuniform vec4 uSeeds[NSEED]; // xyz seed on bowl surface (local), w unused\n\nstruct BowlHit { float d; float side; float s; vec2 nDelta; };\n\nvec2 segPerp(int i){ vec2 b=normalize(uProf[i+1].xy-uProf[i].xy); return vec2(-b.y, b.x); }\n\n// distance-only version for marching\nfloat bowlProfileD(vec2 q){\n  float d = 1e5;\n  for(int i=0;i<NPROF-1;i++){\n    vec2 a=uProf[i].xy, ba=uProf[i+1].xy-a, pa=q-a;\n    float t=sat(dot(pa,ba)/dot(ba,ba));\n    d=min(d, length(pa-ba*t)-mix(uProf[i].z, uProf[i+1].z, t));\n  }\n  return d;\n}\n\n// full version: side (+1 inside the cavity, -1 outside), arc parameter, and the\n// correction that turns faceted polyline normals into smooth (Phong-like) ones\nBowlHit bowlProfile(vec2 q){\n  BowlHit h; h.d = 1e5; h.side = 0.0; h.s = 0.0; h.nDelta=vec2(0);\n  float acc = 0.0, total = 0.0;\n  for(int i=0;i<NPROF-1;i++) total += length(uProf[i+1].xy-uProf[i].xy);\n  int bi=0; float bt=0.0;\n  for(int i=0;i<NPROF-1;i++){\n    vec2 a=uProf[i].xy, b=uProf[i+1].xy;\n    vec2 pa=q-a, ba=b-a;\n    float L = length(ba);\n    float t=sat(dot(pa,ba)/(L*L));\n    float th=mix(uProf[i].z, uProf[i+1].z, t);\n    float d=length(pa-ba*t)-th;\n    if(d<h.d){ h.d=d; h.side = (pa.x*ba.y-pa.y*ba.x) < 0.0 ? 1.0 : -1.0; h.s=(acc+t*L)/total; bi=i; bt=t; }\n    acc += L;\n  }\n  if(bt>0.0 && bt<1.0){\n    vec2 pf = segPerp(bi);\n    vec2 n0 = bi>0 ? normalize(segPerp(bi-1)+pf) : pf;\n    vec2 n1 = bi<NPROF-2 ? normalize(segPerp(bi+1)+pf) : pf;\n    vec2 ns = normalize(mix(n0,n1,bt));\n    h.nDelta = (ns-pf)*h.side;\n  }\n  return h;\n}\n\nvec2 bowlQ(vec3 p){\n  float a = atan(p.z,p.x);\n  float r = length(p.xz);\n  r *= 1.0 + uOval*cos(2.0*a-1.4);\n  float rim = smoothstep(0.25,0.75,p.y);\n  float y = p.y - uWobble*rim*(0.55*sin(a*2.0+1.3)+0.3*sin(a*5.0+4.0)+0.15*sin(a*9.0+0.5));\n  return vec2(r, y);\n}\n\nfloat sdBowl(vec3 p){\n  vec2 q = bowlQ(p);\n  float d = bowlProfileD(q);\n  if(uFootTh>0.0){\n    float th = uFootTh;\n    float df = sdSeg(q, uFoot.xy, uFoot.zw) - th;\n    d = smin(d, df, 0.03);\n  }\n  // throwing ridges (spiral rings)\n  d -= uRidge*sin(q.y*70.0 + 0.6*sin(q.y*9.0))*smoothstep(0.02,0.1,q.y);\n  return d;\n}\n\n// full info at a surface point (called once per hit)\nBowlHit bowlInfo(vec3 p){\n  vec2 q = bowlQ(p);\n  BowlHit h = bowlProfile(q);\n  if(uFootTh>0.0){\n    float df = sdSeg(q, uFoot.xy, uFoot.zw) - uFootTh;\n    if(df < h.d + 0.012){ h.side = -2.0; h.nDelta = vec2(0); } // foot ring: unglazed\n  }\n  return h;\n}\n\n// Fracture warp: cheap analytic wobble so the same cells can be marched per shard.\n// (Mirrored exactly in bowl.js for CPU-side centroids.)\nvec3 fracWarp(vec3 p){\n  return p + 0.030*sin(p.zxy*9.1+vec3(1.3,4.1,2.7))\n           + 0.012*sin(p.yzx*23.7+vec3(0.4,2.2,5.1))\n           + 0.005*sin(p.zxy*61.0+vec3(2.9,0.7,4.4));\n}\n\n// Warped Voronoi on the fixed fracture seeds. Returns (border distance, cell index, second index)\nvec3 seamField(vec3 p){\n  vec3 w = fracWarp(p);\n  float d1=1e5, d2=1e5; int i1=0, i2=0;\n  for(int i=0;i<NSEED;i++){\n    vec3 r = w-uSeeds[i].xyz;\n    float d = dot(r,r);\n    if(d<d1){ d2=d1; i2=i1; d1=d; i1=i; } else if(d<d2){ d2=d; i2=i; }\n  }\n  vec3 s1=uSeeds[i1].xyz, s2=uSeeds[i2].xyz;\n  float bd = (d2-d1)/(2.0*length(s2-s1));\n  return vec3(bd, float(i1), float(i2));\n}\n\n// signed distance (in warped space) to the boundary of cell i: <0 inside\nfloat cellDist(vec3 p, int i){\n  vec3 w = fracWarp(p);\n  vec3 si = uSeeds[i].xyz;\n  float di = dot(w-si,w-si);\n  float d = -1e5;\n  for(int j=0;j<NSEED;j++){\n    if(j==i) continue;\n    vec3 sj = uSeeds[j].xyz;\n    float dj = dot(w-sj,w-sj);\n    d = max(d, (di-dj)/(2.0*length(sj-si)));\n  }\n  return d;\n}\n\n// glaze thickness 0..~2 on the surface\nfloat glazeThickness(vec3 p, BowlHit h){\n  float a = atan(p.z,p.x);\n  if(h.side < -1.5) return 0.0;              // foot\n  float s = h.s;\n  float t;\n  if(h.side > 0.0){\n    // interior: pools in the well\n    t = 0.75 + 1.1*smoothstep(0.42,0.05,s) ;\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);     // thins over the rim\n  } else {\n    // exterior: glaze line with drips\n    float line = 0.46 + 0.04*gnoise(vec2(a*2.0,1.7));\n    float drip = pow(sat(gnoise(vec2(a*7.0, 3.1))*0.5+0.5), 5.0)*0.28\n               + pow(sat(gnoise(vec2(a*19.0, 8.3))*0.5+0.5), 8.0)*0.18;\n    float edge = line - drip;\n    float cov = smoothstep(edge-0.004, edge+0.01, s);\n    // thick roll at the drip end, thinning toward the rim\n    t = cov*(0.7 + 1.1*exp(-max(s-edge,0.0)*28.0));\n    t *= 0.35+0.65*smoothstep(1.0,0.9,s);\n  }\n  // natural ash: heavier on one flank (facing the fire)\n  float ashSide = sat(0.5+0.5*cos(a-2.4))*smoothstep(0.35,0.85,s);\n  t += uAsh*ashSide*(0.6+0.8*sat(gnoise(p*14.0)+0.3));\n  return t;\n}\n\n// ---------------------------------------------------------------- bowl material\nstruct Surf {\n  vec3 alb;      // diffuse albedo (base, under coat)\n  vec3 f0;       // base specular reflectance (metals)\n  float rough;   // base roughness\n  float coat;    // clear coat (glaze / water film) strength 0..1\n  float coatRough;\n  vec3 n;        // base normal\n  vec3 cn;       // coat normal\n  vec3 emit;\n  float sss;     // wrap / translucency amount\n};\n\nSurf defaultSurf(vec3 n){\n  Surf s; s.alb=vec3(0.5); s.f0=vec3(0.04); s.rough=0.8; s.coat=0.0; s.coatRough=0.1;\n  s.n=n; s.cn=n; s.emit=vec3(0); s.sss=0.0; return s;\n}\n\nvec3 rotYv(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x-s*p.z, p.y, s*p.x+c*p.z); }\n\n// perturb normal with a scalar height function's numerical gradient projected on the surface\n#define BUMP(n, P, F, EPS, AMT) { \\\n  vec3 _e=vec3(EPS,0,0); float _h0=F(P); \\\n  vec3 _g=vec3(F(P+_e.xyy)-_h0, F(P+_e.yxy)-_h0, F(P+_e.yyx)-_h0)/EPS; \\\n  _g-=n*dot(_g,n); n=normalize(n-AMT*_g); }\n\nfloat clayGrain(vec3 p){ return gnoise(p*140.0)*0.5+gnoise(p*330.0)*0.25; }\nfloat glazeRipple(vec3 p){ return gnoise(p*22.0)+0.35*gnoise(p*61.0); }\n\nSurf bowlSurface(vec3 p, vec3 n, vec3 v){\n  Surf s = defaultSurf(n);\n  BowlHit h = bowlInfo(p);\n  { vec2 dr = normalize(p.xz+1e-6); n = normalize(n + vec3(dr.x*h.nDelta.x, h.nDelta.y, dr.y*h.nDelta.x)); s.n=n; s.cn=n; }\n  vec3 pr = rotYv(p, uSpin);            // detail rotating with the wheel\n  float a = atan(pr.z, pr.x);\n\n  // ---------- clay body\n  float speck = smoothstep(0.86, 0.95, vnoise(pr*80.0)) * 0.7;\n  float grain = clayGrain(pr);\n  vec3 fired = vec3(0.50,0.44,0.37)*(0.92+0.1*grain);\n  fired = mix(fired, vec3(0.18,0.09,0.05), speck);\n  // flashing on the unglazed foot / exposed body\n  float flash = sat(0.5+0.8*gnoise(pr*4.0+3.0));\n  vec3 footCol = mix(fired, vec3(0.58,0.30,0.14), 0.55*flash);\n\n  // unfired clay (wet -> dry)\n  vec3 wetCol = vec3(0.19,0.10,0.065);\n  vec3 dryCol = vec3(0.60,0.53,0.46)*(0.95+0.08*grain);\n  vec3 raw = mix(wetCol, dryCol, smoothstep(0.0,1.0,uDry));\n  float slurry = sat(0.5+0.9*gnoise(vec3(a*6.0, pr.y*38.0, 0.0)));\n\n  float firedAmt = max(uMelt, uHeat);\n  // iron shows through where the glaze thins over the rim: a warm brown lip, not raw grain\n  fired = mix(fired, vec3(0.30,0.19,0.12)*(0.95+0.05*grain), smoothstep(0.9, 0.995, h.s)*0.85);\n  vec3 body = mix(raw, h.side<-1.5 ? footCol : fired, sat(firedAmt*1.5));\n  s.alb = body;\n  s.rough = 0.85;\n  BUMP(s.n, pr, clayGrain, 0.002, 0.00025*(1.0-0.8*uMelt));\n\n  // ---------- wet film\n  if(uWet>0.0){\n    float film = uWet*(0.55+0.45*slurry);\n    s.coat = film;\n    s.coatRough = mix(0.32, 0.12, slurry);\n    s.alb = mix(s.alb, s.alb*0.7, film);\n    s.cn = n;\n    // throwing lines in the film\n    vec3 nn = n;\n    float lines = sin(p.y*140.0+2.0*gnoise(vec3(a*3.0,p.y*10.0,0.0)));\n    nn = normalize(nn + 0.08*uWet*lines*vec3(0,1,0));\n    s.cn = nn;\n  }\n\n  // ---------- glaze\n  float t = glazeThickness(p, h);\n  float rawCov = smoothstep(1.02-uGlazeRaw*1.1, 1.04-uGlazeRaw*1.1, h.s)*step(0.001,uGlazeRaw);\n  float cov = sat(t*4.0)*max(rawCov, uMelt);\n  if(cov>0.0){\n    // raw slip (unfired glaze powder)\n    vec3 slip = vec3(0.70,0.72,0.70)*(0.95+0.08*grain);\n    float rawAmt = rawCov*(1.0-uMelt);\n    // melted celadon: Beer-Lambert over the body + milky scatter\n    vec3 sigma = vec3(0.62,0.26,0.33);\n    float tt = t*(1.0+0.15*gnoise(p*7.0));\n    vec3 trans = exp(-sigma*tt*1.6);\n    vec3 milk = vec3(0.55,0.72,0.66);\n    float scat = 1.0-exp(-tt*0.9);\n    vec3 glazeCol = mix(body*trans*1.15, milk*mix(vec3(1.0),trans,0.5), scat*0.72);\n    // ash: greener glassy runs\n    glazeCol = mix(glazeCol, vec3(0.30,0.42,0.22)*trans*1.4, sat(uAsh*(t-0.9)*0.9));\n    // iron specks bleed through\n    glazeCol = mix(glazeCol, vec3(0.22,0.13,0.07), speck*0.5*exp(-tt*1.2));\n\n    // crackle network (two scales, only in glaze)\n    float crk = 0.0;\n    if(uCrackle>0.0){\n      vec3 wp = p + 0.02*vec3(gnoise(p*13.0), gnoise(p*13.0+7.0), gnoise(p*13.0+3.0));\n      vec3 c1 = voronoiB(wp*vec3(5.5,7.0,5.5)+vec3(3.0));\n      vec3 c2 = voronoiB(wp*15.0+vec3(1.3));\n      float l1 = 1.0-smoothstep(0.004, 0.016, c1.x);\n      float l2 = (1.0-smoothstep(0.004, 0.02, c2.x))*0.45;\n      float reveal = smoothstep(c1.y*0.8, c1.y*0.8+0.2, uCrackle);\n      crk = max(l1*reveal, l2*smoothstep(0.4,1.0,uCrackle)*step(0.55,c2.y));\n      crk *= 0.55+0.45*sat(gnoise(p*5.0)+0.5);\n      vec3 crackCol = mix(glazeCol*1.4+0.06, vec3(0.28,0.16,0.07), uStain*(h.side>0.0?1.0:0.6));\n      glazeCol = mix(glazeCol, crackCol, crk*0.8);\n    }\n\n    vec3 glazed = glazeCol;\n    s.alb = mix(s.alb, mix(glazed, slip, rawAmt), cov);\n    s.rough = mix(s.rough, 0.9, cov*rawAmt);\n    // melted glaze is a clear coat\n    float coat = cov*uMelt;\n    s.coat = max(s.coat, coat);\n    s.coatRough = mix(s.coatRough, 0.045, coat);\n    vec3 cn = n;\n    BUMP(cn, p, glazeRipple, 0.004, 0.0004*uMelt);\n    s.cn = normalize(mix(s.cn, cn, coat));\n    s.sss = 0.35*coat*scat;\n  }\n\n  // ---------- tea stain on the unglazed foot over years\n  s.alb *= 1.0 - 0.15*uStain*step(h.side,-1.5);\n\n  // ---------- incandescence\n  if(uHeat>0.0){\n    float T = mix(800.0, 1330.0, uHeat);\n    s.emit = blackbody(T)*pow(uHeat,2.2)*2.5*(0.85+0.15*grain);\n  }\n\n  // ---------- kintsugi gold\n  if(uGold>0.0){\n    vec3 sf = seamField(p);\n    float w = 0.0075*(0.75+0.5*sat(gnoise(p*6.0)*0.5+0.5));\n    float g = 1.0-smoothstep(w*0.75, w, sf.x);\n    g *= uGold;\n    if(g>0.0){\n      vec3 e = normalize(uSeeds[int(sf.z)].xyz-uSeeds[int(sf.y)].xyz);\n      float x = sat(sf.x/w);\n      float slope = -0.9*x/sqrt(max(1.0-x*x,0.02));\n      vec3 et = normalize(e - n*dot(e,n));\n      vec3 gn = normalize(n + slope*et*0.6);\n      float burnish = sat(0.5+0.8*gnoise(p*40.0));\n      s.alb = mix(s.alb, vec3(0.0), g);\n      s.f0 = mix(s.f0, vec3(1.0,0.74,0.32), g);\n      s.rough = mix(s.rough, mix(0.34,0.14,burnish), g);\n      s.coat = mix(s.coat, 0.0, g);\n      s.n = normalize(mix(s.n, gn, g));\n      s.cn = s.n;\n    }\n  }\n  return s;\n}\n\n// ---------------------------------------------------------------- the room\n// A low table by a shoji wall. Every visual parameter lives in a Mem struct so\n// the same room can be traced \"now\" (Life scene) or at any remembered moment\n// (the shard portals).\n//\n// Room coordinates (units 10cm): table top y=0, bowl at origin.\n// Shoji wall is the plane z = WALLZ, facing -z. Floor at y = FLOORY.\n#define WALLZ 7.0\n#define FLOORY -3.3\n#define TABLE_HX 6.0\n#define TABLE_HZ 4.2\n\nstruct Mem {\n  float day;      // 0..1  (0.25 sunrise, 0.5 noon, 0.75 sunset)\n  float season;   // 0 spring, 1 summer, 2 autumn, 3 winter (continuous)\n  float two;      // second bowl presence 0..1\n  float gap;      // distance between the bowls (bowl-centre spacing)\n  float candle;   // candle light 0..1\n  float steam;    // steam amount 0..1\n  float tea;      // tea level 0..1 in the celadon bowl\n  float tea2;     // tea in the tenmoku\n  float open;     // shoji panel open 0..1\n  float ring;     // faint ring left where the second bowl stood\n  float bowlOn;   // celadon bowl present on table (0 while lifted/fallen)\n  vec3  bowlOff;  // offset of the celadon bowl (lift)\n  float bowlTilt; // tilt of the celadon bowl\n};\n\nuniform vec4 uProf2[6]; // tenmoku profile\n\n// ---- second bowl: tenmoku (conical, dark iron glaze), analytic 6-point lathe\nfloat sdTenmoku(vec3 p){\n  vec2 q = vec2(length(p.xz), p.y);\n  float d = 1e5;\n  for(int i=0;i<5;i++){\n    vec2 a=uProf2[i].xy, ba=uProf2[i+1].xy-a, pa=q-a;\n    float t=sat(dot(pa,ba)/dot(ba,ba));\n    d=min(d, length(pa-ba*t)-mix(uProf2[i].z, uProf2[i+1].z, t));\n  }\n  // foot\n  d = smin(d, sdSeg(q, vec2(0.17,0.07), vec2(0.18,0.025))-0.022, 0.02);\n  return d;\n}\n\nvec3 sunDir(Mem m){\n  // sun travels across the sky beyond the shoji (+z), lower in winter\n  float a = (m.day-0.25)*PI;            // 0 at sunrise, PI at sunset\n  float elev = mix(0.95, 0.5, sat(abs(m.season-1.0)/2.0)) ;\n  vec3 d = vec3(-cos(a)*0.9, sin(a)*elev, 1.0);\n  return normalize(d);\n}\nfloat sunUp(Mem m){ return smoothstep(0.2,0.3,m.day)*smoothstep(0.8,0.7,m.day); }\nvec3 sunColor(Mem m){\n  float h = sunDir(m).y;\n  vec3 c = mix(vec3(1.0,0.45,0.16), vec3(1.0,0.86,0.68), smoothstep(0.05,0.45,h));\n  c *= mix(1.0, 0.8, smoothstep(2.5,3.0,m.season)); // pale winter\n  return c*6.0*sunUp(m);\n}\nvec3 skyColor(Mem m, float up){\n  float d = sunUp(m);\n  vec3 night = vec3(0.012,0.016,0.03);\n  vec3 dayc = mix(vec3(0.45,0.58,0.8), vec3(0.62,0.66,0.72), smoothstep(2.4,3.0,m.season));\n  vec3 c = mix(night, dayc*(0.6+0.4*up), d);\n  float dusk = sat(1.0-abs(m.day-0.25)*12.0)+sat(1.0-abs(m.day-0.75)*12.0);\n  c = mix(c, vec3(0.9,0.5,0.3)*0.8, dusk*0.5*(1.0-up));\n  return c;\n}\n\n// shoji lattice: 1 on paper, 0 on wood bars. uv in wall coords (x, y)\nfloat shojiPaper(vec2 w){\n  vec2 cell = vec2(1.9, 2.3);\n  vec2 f = abs(fract(w/cell+0.5)-0.5)*cell;\n  float bar = min(f.x, f.y);\n  return smoothstep(0.07, 0.1, bar);\n}\n// open panel: a slid-open gap in the shoji (x from -1.2 widening to the right)\nfloat openPanel(vec2 w, Mem m){\n  float x0 = -1.2, x1 = x0 + m.open*4.0;\n  return step(x0,w.x)*step(w.x,x1)*step(-1.0,w.y)*step(w.y,14.0);\n}\n// light transmitted through the wall toward direction L from point p\n// returns (direct sun fraction through the gap, diffuse paper glow factor)\nvec2 wallTransmit(vec3 p, vec3 L, Mem m){\n  if(L.z<=0.01) return vec2(0);\n  float t = (WALLZ-p.z)/L.z;\n  vec2 w = (p+L*t).xy;\n  if(w.y<-1.0 || w.y>14.0) return vec2(0);\n  // soft penumbra on the gap edges (sun is not a point, th
