<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kintsugi — a real-time film</title>
<meta name="description" content="A four-minute real-time procedural short film about a tea bowl: made, loved, broken, and mended with gold. One HTML file, no assets.">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:default}
  #film{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;background:#000}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      color:#cfc6b8;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
      background:#050505;transition:opacity 2.5s ease;user-select:none}
  #ui.gone{opacity:0;pointer-events:none}
  #ui h1{font-weight:400;letter-spacing:.9em;margin:0 0 .6em .9em;font-size:clamp(20px,3.2vw,40px)}
  #ui .sub{letter-spacing:.25em;font-size:clamp(10px,1.1vw,13px);opacity:.55;text-transform:lowercase}
  #ui .go{margin-top:3.2em;letter-spacing:.35em;font-size:clamp(10px,1.1vw,13px);opacity:0;transition:opacity 1.2s}
  #ui.ready{cursor:pointer}
  #ui.ready .go{opacity:.8;animation:breathe 3.2s ease-in-out infinite}
  #ui .enso{width:64px;height:64px;margin-bottom:2.2em;opacity:.7}
  #status{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;opacity:.45}
  @keyframes breathe{50%{opacity:.35}}
  #dbg{position:absolute;left:10px;right:10px;bottom:6px;color:#ff0;font:12px monospace;z-index:9}
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="ui">
  <svg class="enso" viewBox="0 0 64 64"><path d="M47 13 A24 24 0 1 0 55 30" fill="none" stroke="#cfc6b8" stroke-width="3.2" stroke-linecap="round"/></svg>
  <h1>KINTSUGI</h1>
  <div class="sub">a real-time film &nbsp;·&nbsp; four minutes &nbsp;·&nbsp; sound on</div>
  <div class="go">click to begin</div>
  <div id="status">preparing</div>
</div>
<script>
/*@SRC*/
/*@JS*/
</script>
</body>
</html>
